<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12AM - DASHBOARD</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="navigation.css">
    <script src="theme.js"></script>
    <script src="device-auth.js"></script>
  <script src="navigation.js" defer></script>
    <script src="injector.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root {
            --bg-page: var(--bg-primary, #000000);
            --bg-card: var(--bg-secondary, #0d0d0d);
            --text-main: var(--text-primary, #ffffff);
            --text-muted: var(--text-secondary, #c0c0c0);
            --accent-color: var(--accent-primary, #4f46e5);
            --accent-glow: var(--accent-secondary, rgba(79, 70, 229, 0.4));
            --border-main: var(--border-primary, #1a1a1a);
            --border-faint: var(--border-secondary, rgba(255,255,255,0.05));
            --btn-bg: var(--button-bg, rgba(79, 70, 229, 0.1));
            --btn-text: var(--button-text, #4f46e5);
        }

        * { box-sizing: border-box; }

        body { 
            font-family: 'Geist', sans-serif; 
            color: var(--text-main);
            background-color: var(--bg-page);
            font-weight: 300;
            overflow: hidden;
            min-height: 100vh;
        }

        /* Subtle dot grid */
        .grid-bg {
            background-image: radial-gradient(var(--border-faint) 1px, transparent 0);
            background-size: 24px 24px;
        }

        #dynamic-background {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 20%, var(--accent-glow), transparent 65%);
            pointer-events: none;
            z-index: -1;
        }

        /* ------------------------------------------------------------------ */
        /* CARDS & COMPONENTS                                                 */
        /* ------------------------------------------------------------------ */
        .feature-card {
            border-radius: 2rem;
            border: 1px solid var(--border-main);
            background: var(--bg-card);
            box-shadow: 0 50px 100px -20px rgba(0,0,0,0.5);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .feature-card:hover:not(.no-hover) {
            border-color: var(--accent-color);
            transform: translateY(-4px);
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.6);
        }

        .stat-pill {
            background: var(--bg-card);
            border: 1px solid var(--border-main);
            border-radius: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .btn-toolbar-style {
            background: var(--bg-card);
            border: 1px solid var(--border-main);
            border-radius: 16px;
            color: var(--text-muted);
            padding: 0.6rem 1.25rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            outline: 1px solid transparent;
        }
        .btn-primary-override {
            background-color: var(--btn-bg) !important;
            border: 1px solid var(--accent-color) !important;
            color: var(--accent-color) !important;
            outline: 1px solid var(--accent-glow);
        }
        .btn-primary-override:hover {
            background-color: var(--accent-color) !important;
            color: #fff !important;
            transform: scale(1.02);
            outline: 1px solid rgba(255,255,255,0.2);
        }

        /* ------------------------------------------------------------------ */
        /* LEADERBOARD WIDGET SPECIFICS                                        */
        /* ------------------------------------------------------------------ */
        #leaderboard-widget.greyed-out {
            filter: grayscale(1) brightness(0.4);
        }
        #leaderboard-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            pointer-events: auto;
        }

        /* ------------------------------------------------------------------ */
        /* RECENT PAGES                                                        */
        /* ------------------------------------------------------------------ */
        .page-btn {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1.25rem;
            background: var(--bg-page);
            border: 1px solid var(--border-main);
            border-radius: 24px;
            transition: all 0.2s;
            cursor: pointer;
            position: relative;
            z-index: 1;
        }
        .page-btn:hover {
            background: var(--btn-bg);
            border-color: var(--accent-color);
            transform: scale(1.02) translateX(4px);
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
            z-index: 10;
        }
        .icon-box {
            width: 3rem;
            height: 3rem;
            border-radius: 16px;
            background: var(--btn-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-color);
            font-size: 1.25rem;
            border: 1px solid var(--border-main);
        }

        .custom-scroll::-webkit-scrollbar { width: 0; }
    </style>
</head>

<body class="grid-bg relative">
    <div id="dynamic-background"></div>
    <div id="navbar-container"></div>

    <main class="flex min-h-screen h-screen">
        <section class="flex-1 min-w-0 p-6 md:p-12 lg:p-16 pt-10 overflow-y-auto custom-scroll flex flex-col justify-between">
            <div class="max-w-[1200px] w-full mx-auto pb-6">
                
                <div class="mb-10 flex flex-col xl:flex-row justify-between items-start xl:items-end gap-8 border-b pb-8" style="border-color: var(--border-main);">
                    <div>
                        <p id="clock-date" class="text-[10px] font-black uppercase tracking-[0.3em] mb-4 opacity-80" style="color: var(--accent-color);">--------</p>
                        <h2 id="clock-time" class="text-6xl md:text-8xl font-light tracking-tight mb-2 select-none cursor-pointer transition-transform duration-200 hover:scale-[1.01] active:scale-[0.99]" style="color: var(--text-main); user-select: none; -webkit-user-select: none;" title="Click for fullscreen clock" onclick="openFullscreenClock()">00:00:00<span class="text-2xl md:text-4xl ml-3 opacity-30 uppercase font-light">--</span></h2>
                        <p class="text-xl md:text-2xl mt-4" style="color: var(--text-muted); opacity: 0.7;">Good day, <span id="user-name-display" class="font-medium opacity-100" style="color: var(--accent-color);">User</span>.</p>
                    </div>

                    <div class="flex flex-col sm:flex-row gap-4 w-full xl:w-auto shrink-0 mb-2">
                        <div class="stat-pill flex-1 xl:w-56 px-6 py-5">
                            <div>
                                <p class="text-[10px] font-black uppercase tracking-[0.3em] opacity-40 mb-2">Highest Streak</p>
                                <div id="stat-highest-streak" class="text-3xl font-light flex items-center gap-2" style="color: var(--accent-color);">0 <i class="fa-solid fa-fire text-2xl ml-1" style="color: var(--accent-color);"></i></div>
                            </div>
                            <p class="text-[10px] mt-4 opacity-40 uppercase tracking-widest" style="color: var(--text-muted);">Active DailyPhoto</p>
                        </div>

                        <div class="stat-pill flex-1 xl:w-56 px-6 py-5">
                            <div>
                                <p class="text-[10px] font-black uppercase tracking-[0.3em] opacity-40 mb-2">Experience Time</p>
                                <div id="stat-total-time" class="text-3xl font-light" style="color: var(--text-main);">0h 0m</div>
                            </div>
                            <p class="text-[10px] mt-4 opacity-40 uppercase tracking-widest" style="color: var(--text-muted);">Session Duration</p>
                        </div>
                    </div>
                </div>

                <div class="flex flex-col gap-8">
                    <div class="feature-card p-8 md:p-10 no-hover">
                        <div class="flex justify-between items-end mb-8 border-b pb-6" style="border-color: var(--border-main);">
                            <div>
                                <p class="text-[10px] font-black uppercase tracking-[0.3em] opacity-30 mb-2">Frequently Used</p>
                                <h3 class="text-3xl font-light tracking-tight" style="color: var(--text-main);">Recent Pages</h3>
                            </div>
                            <div class="text-right">
                                <div id="stat-pageviews" class="text-4xl font-light opacity-80" style="color: var(--accent-color);">0</div>
                                <span class="text-[10px] uppercase tracking-widest text-[var(--text-muted)] opacity-40">Total Views</span>
                            </div>
                        </div>
                        
                        <div id="recent-pages-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Fullscreen Clock Overlay -->
    <div id="fullscreen-clock-overlay" class="fixed inset-0 z-[999999] flex flex-col items-center justify-center select-none cursor-pointer p-6" style="display: none; background: var(--bg-page); user-select: none; -webkit-user-select: none;" onclick="closeFullscreenClock()">
        <p id="fs-clock-date" class="text-xs md:text-sm font-black uppercase tracking-[0.4em] mb-4 opacity-80" style="color: var(--accent-color, #818cf8);">--------</p>
        <h1 id="fs-clock-time" class="text-7xl sm:text-9xl md:text-[10rem] lg:text-[12rem] font-light tracking-tight leading-none text-center" style="color: var(--text-main);">00:00:00<span class="text-3xl md:text-5xl ml-4 opacity-30 uppercase font-light">--</span></h1>
        <div id="fs-clock-battery" class="mt-6 inline-flex items-center gap-3 px-4 py-2 rounded-2xl text-xs md:text-sm tracking-wider uppercase" style="background: var(--bg-card); border: 1px solid var(--border-main); color: var(--text-main);">
            <i id="fs-clock-battery-icon" class="fa-solid fa-battery-full" style="color: var(--accent-color, #818cf8);"></i>
            <span id="fs-clock-battery-pct" class="font-semibold">--%</span>
            <span class="opacity-40">&bull;</span>
            <span id="fs-clock-battery-time" class="opacity-80">Battery status unavailable</span>
        </div>
        <p class="text-xs text-[var(--text-muted)] opacity-40 mt-8 tracking-widest uppercase">Click anywhere or press Esc to exit</p>
    </div>

    <script>
        function formatBatteryDuration(seconds) {
            const totalMinutes = Math.max(1, Math.round(seconds / 60));
            const hours = Math.floor(totalMinutes / 60);
            const mins = totalMinutes % 60;
            if (hours > 0 && mins > 0) return `${hours}h ${mins}m`;
            if (hours > 0) return `${hours}h`;
            return `${mins}m`;
        }

        function renderBatteryStatus(battery) {
            const pctEl = document.getElementById('fs-clock-battery-pct');
            const timeEl = document.getElementById('fs-clock-battery-time');
            const iconEl = document.getElementById('fs-clock-battery-icon');
            if (!pctEl || !timeEl || !iconEl || !battery) return;

            const pct = Math.max(0, Math.min(100, Math.round((Number(battery.level) || 0) * 100)));
            pctEl.textContent = `${pct}%`;

            if (battery.charging) {
                iconEl.className = 'fa-solid fa-bolt';
                if (pct >= 100) {
                    timeEl.textContent = 'Fully charged';
                } else if (Number.isFinite(battery.chargingTime) && battery.chargingTime > 0 && battery.chargingTime < Infinity) {
                    timeEl.textContent = `Charging (${formatBatteryDuration(battery.chargingTime)} to full)`;
                } else {
                    timeEl.textContent = 'Charging';
                }
            } else {
                let batClass = 'fa-battery-empty';
                if (pct >= 88) batClass = 'fa-battery-full';
                else if (pct >= 63) batClass = 'fa-battery-three-quarters';
                else if (pct >= 38) batClass = 'fa-battery-half';
                else if (pct >= 13) batClass = 'fa-battery-quarter';
                iconEl.className = `fa-solid ${batClass}`;

                if (Number.isFinite(battery.dischargingTime) && battery.dischargingTime > 0 && battery.dischargingTime < Infinity) {
                    timeEl.textContent = `${formatBatteryDuration(battery.dischargingTime)} until empty`;
                } else {
                    timeEl.textContent = 'Estimating time until empty';
                }
            }
        }

        let __dashboardBatteryManager = null;
        function refreshDashboardBatteryStatus() {
            if (__dashboardBatteryManager) {
                renderBatteryStatus(__dashboardBatteryManager);
                return;
            }
            if (navigator && typeof navigator.getBattery === 'function') {
                navigator.getBattery().then((battery) => {
                    if (!battery) return;
                    __dashboardBatteryManager = battery;
                    renderBatteryStatus(battery);
                    if (!battery.__clockListenersBound) {
                        battery.__clockListenersBound = true;
                        const onChange = () => renderBatteryStatus(battery);
                        battery.addEventListener('levelchange', onChange);
                        battery.addEventListener('chargingchange', onChange);
                        battery.addEventListener('dischargingtimechange', onChange);
                        battery.addEventListener('chargingtimechange', onChange);
                    }
                }).catch(() => {});
            }
        }
        refreshDashboardBatteryStatus();

        function openFullscreenClock() {
            const overlay = document.getElementById('fullscreen-clock-overlay');
            if (overlay) {
                overlay.style.display = 'flex';
                refreshDashboardBatteryStatus();
            }
        }

        function closeFullscreenClock() {
            const overlay = document.getElementById('fullscreen-clock-overlay');
            if (overlay) {
                overlay.style.display = 'none';
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeFullscreenClock();
        });

        (function() {
            // 1. Clock Engine (includes seconds)
            function startClock() {
                const timeEl = document.getElementById('clock-time');
                const dateEl = document.getElementById('clock-date');
                const fsTimeEl = document.getElementById('fs-clock-time');
                const fsDateEl = document.getElementById('fs-clock-date');

                function update() {
                    const now = new Date();
                    let hours = now.getHours();
                    const minutes = String(now.getMinutes()).padStart(2, '0');
                    const seconds = String(now.getSeconds()).padStart(2, '0');
                    const ampm = hours >= 12 ? 'PM' : 'AM';
                    hours = hours % 12 || 12;

                    const timeHTML = `${String(hours).padStart(2, '0')}:${minutes}:${seconds}<span class="text-2xl md:text-4xl ml-3 opacity-30 uppercase font-light">${ampm}</span>`;
                    const fsTimeHTML = `${String(hours).padStart(2, '0')}:${minutes}:${seconds}<span class="text-3xl md:text-5xl ml-4 opacity-30 uppercase font-light">${ampm}</span>`;

                    if (timeEl) timeEl.innerHTML = timeHTML;
                    if (fsTimeEl) fsTimeEl.innerHTML = fsTimeHTML;

                    if (dateEl || fsDateEl) {
                        const options = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' };
                        const dateStr = now.toLocaleDateString('en-US', options).toUpperCase();
                        if (dateEl) dateEl.textContent = dateStr;
                        if (fsDateEl) fsDateEl.textContent = dateStr;
                    }
                }
                update();
                setInterval(update, 1000);
            }

            // 2. User Greeting
            function initUser() {
                const nameEl = document.getElementById('user-name-display');
                if (!nameEl) return;

                let user = null;
                try {
                    if (window.TwelveAMAuth && typeof window.TwelveAMAuth.getCurrentUser === 'function') {
                        user = window.TwelveAMAuth.getCurrentUser();
                    } else {
                        user = JSON.parse(localStorage.getItem('12am_user') || 'null');
                    }
                } catch(e) {}

                if (user && (user.nickname || user.firstName)) {
                    const name = user.nickname || user.firstName;
                    nameEl.textContent = `@${name}`;
                } else {
                    nameEl.textContent = 'Explorer';
                }
            }

            // 3. Local Streak Tracker
            function updateStreak() {
                const streakEl = document.getElementById('stat-highest-streak');
                if (!streakEl) return;

                const today = new Date().toISOString().slice(0, 10);
                let data = { count: 1, highest: 1, lastDate: today };

                try {
                    const saved = JSON.parse(localStorage.getItem('12am_streak_data') || 'null');
                    if (saved && saved.lastDate) {
                        data = saved;
                        if (data.lastDate !== today) {
                            const last = new Date(data.lastDate);
                            const curr = new Date(today);
                            const diffDays = Math.round((curr - last) / (1000 * 60 * 60 * 24));
                            if (diffDays === 1) {
                                data.count = (data.count || 0) + 1;
                                if (data.count > (data.highest || 0)) {
                                    data.highest = data.count;
                                }
                            } else if (diffDays > 1) {
                                data.count = 1;
                            }
                            data.lastDate = today;
                            localStorage.setItem('12am_streak_data', JSON.stringify(data));
                        }
                    } else {
                        localStorage.setItem('12am_streak_data', JSON.stringify(data));
                    }
                } catch(e) {}

                streakEl.innerHTML = `${data.count || 1} <i class="fa-solid fa-fire text-2xl ml-1" style="color: var(--accent-color);"></i>`;
            }

            // 4. Local Experience Time Tracker
            function updateExperienceTime() {
                const timeEl = document.getElementById('stat-total-time');
                if (!timeEl) return;

                function render() {
                    let sec = parseInt(localStorage.getItem('12am_total_time_seconds') || '0', 10);
                    if (isNaN(sec) || sec < 0) sec = 0;
                    const hrs = Math.floor(sec / 3600);
                    const mins = Math.floor((sec % 3600) / 60);
                    timeEl.textContent = `${hrs}h ${mins}m`;
                }

                render();
                setInterval(render, 3000);
            }

            // 5. Recent Pages Tracker (Top 6)
            const PAGES_CONFIG = [
                { id: 'games', name: 'Games', icon: 'fa-gamepad', url: 'games.html', desc: '2,200+ Unblocked Titles' },
                { id: 'movies', name: 'Media', icon: 'fa-film', url: 'movies.html', desc: 'Fast Multi-Source Stream' },
                { id: 'music', name: '12 Music', icon: 'fa-music', url: 'music.html', desc: 'Full Audio Player' },
                { id: 'messenger', name: 'Messenger', icon: 'fa-comments', url: 'messenger.html', desc: 'Realtime Chat' },
                { id: 'notes', name: 'Notes', icon: 'fa-note-sticky', url: 'notes.html', desc: 'Study Notebook' },
                { id: 'dictionary', name: 'Dictionary', icon: 'fa-book-bookmark', url: 'dictionary.html', desc: 'Definitions & Audio' },
                { id: 'ai', name: '12AM AI', icon: 'fa-robot', url: 'ai.html', desc: 'Smart Assistant' },
                { id: 'proxy', name: 'Web Proxy', icon: 'fa-globe', url: 'proxy.html', desc: 'Unblocked Browser' },
                { id: 'settings', name: 'Settings', icon: 'fa-gear', url: 'settings.html', desc: 'Themes & Cloak' }
            ];

            function renderMostOpenedPages() {
                const listEl = document.getElementById('recent-pages-list');
                const viewsEl = document.getElementById('stat-pageviews');
                if (!listEl) return;

                let visits = {};
                try {
                    visits = JSON.parse(localStorage.getItem('12am_page_visits') || '{}');
                } catch(e) {}

                let recents = [];
                try {
                    recents = JSON.parse(localStorage.getItem('12am_recent_pages_history') || '[]');
                } catch(e) {}

                let totalViews = 0;
                Object.values(visits).forEach(v => {
                    if (typeof v === 'number') totalViews += v;
                });
                if (viewsEl) viewsEl.textContent = totalViews.toLocaleString();

                // Sort by recency if recorded, filling remainder by visit count
                let sorted = [];
                if (recents && recents.length > 0) {
                    const recentIds = recents.map(r => (typeof r === 'object' ? r.id : r));
                    const recentPages = [];
                    recentIds.forEach(id => {
                        const found = PAGES_CONFIG.find(p => p.id === id);
                        if (found && !recentPages.some(p => p.id === found.id)) {
                            recentPages.push({ ...found, count: visits[found.id] || 0 });
                        }
                    });
                    const remaining = PAGES_CONFIG
                        .filter(p => !recentPages.some(r => r.id === p.id))
                        .map(p => ({ ...p, count: visits[p.id] || 0 }))
                        .sort((a, b) => b.count - a.count);
                    sorted = [...recentPages, ...remaining].slice(0, 6);
                } else {
                    sorted = PAGES_CONFIG.map(p => ({
                        ...p,
                        count: visits[p.id] || 0
                    })).sort((a, b) => b.count - a.count).slice(0, 6);
                }

                listEl.innerHTML = sorted.map(p => `
                    <a href="${p.url}" class="page-btn flex items-center justify-between p-4 rounded-2xl transition-all group">
                        <div class="flex items-center gap-3.5 min-w-0">
                            <div class="icon-box shrink-0 group-hover:scale-105 transition-transform">
                                <i class="fa-solid ${p.icon}" style="color: var(--accent-color);"></i>
                            </div>
                            <div class="min-w-0">
                                <p class="text-sm font-medium truncate" style="color: var(--text-main);">${p.name}</p>
                                <p class="text-[11px] opacity-60 truncate" style="color: var(--text-muted);">${p.desc}</p>
                            </div>
                        </div>
                        <div class="text-right shrink-0 pl-2">
                            <span class="text-sm font-semibold" style="color: var(--accent-color);">${p.count}</span>
                            <span class="text-[10px] block opacity-40 uppercase tracking-widest" style="color: var(--text-muted);">views</span>
                        </div>
                    </a>
                `).join('');
            }

            document.addEventListener('DOMContentLoaded', () => {
                startClock();
                initUser();
                updateStreak();
                updateExperienceTime();
                renderMostOpenedPages();
            });
        })();
    </script>
</body>
</html>
