<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12AM — Device Authentication</title>
    <meta name="description" content="Local device-bound authentication for 12AM.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Supabase & 12AM Device Auth Core -->
    <script type="module" src="supabase-config.js"></script>
    <script src="device-auth.js"></script>

    <!-- 12AM Core Theme & Navigation -->
    <link rel="stylesheet" href="navigation.css">
    <script src="theme.js"></script>
    <script src="navigation.js" defer></script>

    <style>
        :root {
            --bg-page: var(--bg-primary, #070709);
            --bg-card: var(--bg-secondary, #0f0f14);
            --text-main: var(--text-primary, #ffffff);
            --text-muted: var(--text-secondary, #ffd700);
            --accent-color: var(--accent-primary, #ff8800);
            --accent-glow: var(--accent-secondary, rgba(255, 136, 0, 0.4));
            --border-main: var(--border-primary, rgba(255, 140, 0, 0.25));
            --border-hover: rgba(255, 140, 0, 0.4);
        }

        body { 
            font-family: 'Geist', sans-serif; 
            background-color: var(--bg-page); 
            color: var(--text-muted); 
            font-weight: 400;
            overflow: hidden;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }

        .auth-page-backdrop {
            position: fixed;
            inset: 0;
            z-index: 100050;
            backdrop-filter: blur(32px);
            -webkit-backdrop-filter: blur(32px);
            background: rgba(3, 3, 6, 0.82);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.25rem;
            overflow-y: auto;
        }

        .auth-card {
            background-color: var(--bg-card, #0c0c11);
            border: 1px solid var(--border-main, rgba(255, 140, 0, 0.28));
            border-radius: 26px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.85), 0 0 45px var(--accent-glow, rgba(255, 140, 0, 0.25));
            overflow: hidden;
            position: relative;
            max-width: 420px;
            width: 100%;
            margin: auto;
            color: var(--text-main, #ffffff);
            animation: twelveAmFadeIn 0.24s cubic-bezier(0.16, 1, 0.3, 1);
            box-sizing: border-box;
        }

        @keyframes twelveAmFadeIn {
            from { opacity: 0; transform: scale(0.96) translateY(6px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .auth-modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            background: transparent;
            border: none;
            color: #a1a1aa;
            font-size: 15px;
            width: 32px;
            height: 32px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.15s ease;
            z-index: 10;
        }
        .auth-modal-close:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.08);
        }

        .input-style {
            width: 100%; 
            padding: 0.85rem 1rem; 
            border: 1px solid var(--border-main); 
            background-color: #050508; 
            border-radius: 16px; 
            color: var(--text-main); 
            font-size: 0.95rem;
            transition: all 0.25s ease;
            outline: none;
        }
        .input-style:focus {
            border-color: var(--accent-color); 
            box-shadow: 0 0 0 3px var(--accent-glow);
            background-color: #08080c;
        }

        .btn-primary-purple {
            background: linear-gradient(135deg, var(--accent-primary, #ff8800) 0%, #ea580c 100%);
            border: none;
            color: #ffffff;
            font-weight: 500;
            padding: 0.85rem 1.25rem;
            border-radius: 16px;
            width: 100%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 8px 24px var(--accent-glow);
        }
        .btn-primary-purple:hover {
            background: linear-gradient(135deg, #ffa028 0%, #f97316 100%);
            box-shadow: 0 12px 30px var(--accent-glow);
            transform: translateY(-1px);
        }

        .error-message { 
            color: #f87171; 
            background: rgba(248, 113, 113, 0.1); 
            border: 1px solid rgba(248, 113, 113, 0.25); 
            padding: 0.75rem; 
            border-radius: 12px; 
            font-size: 0.85rem;
        }
        .success-message { 
            color: #a78bfa; 
            background: rgba(139, 92, 246, 0.1); 
            border: 1px solid rgba(139, 92, 246, 0.25); 
            padding: 0.75rem; 
            border-radius: 12px; 
            font-size: 0.85rem;
        }

        .brand-bg-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 50% 30%, var(--accent-glow) 0%, transparent 60%);
            z-index: -1;
            pointer-events: none;
            opacity: 0.6;
        }
    </style>
</head>
<body class="overflow-hidden">
    <div class="brand-bg-glow"></div>
    <div id="dynamic-background"></div>

    <div class="auth-page-backdrop">
        <div class="auth-card p-8 sm:p-10">
            <a href="index.html" class="auth-modal-close" title="Return to Home">✕</a>
            <!-- Logo and Brand Header -->
            <div class="text-center mb-6">
                <img src="images/logo-white.png" alt="12AM Logo" class="h-9 mx-auto mb-2 object-contain opacity-95">
            </div>

        <!-- VIEW A: Device Login View (When account already bound to this device) -->
        <div id="deviceLoginView" style="display: none;">
            <div class="text-center mb-6">
                <h2 class="text-xl font-medium text-white mb-1" id="deviceUserName">Welcome Back</h2>
                <p class="text-xs text-purple-400 font-mono" id="deviceUserNick">@user</p>
                <p class="text-xs text-zinc-500 mt-2">Enter your PIN to unlock.</p>
            </div>

            <form id="loginForm" onsubmit="handleDeviceLogin(event)" class="space-y-4">
                <div>
                    <label class="block mb-1.5 text-zinc-400 text-xs font-normal">PIN (4-6 digits)</label>
                    <input type="password" id="loginPin" placeholder="••••" maxlength="6" pattern="[0-9]{4,6}" inputmode="numeric" required class="input-style text-center tracking-[0.3em] font-mono text-lg" autofocus autocomplete="current-password">
                </div>
                <button type="submit" class="btn-primary-purple mt-2">
                    <span>Unlock</span>
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>
            </form>

            <div id="loginMessage" class="mt-4 text-center"></div>

            <div class="mt-8 pt-4 border-t border-zinc-800/80 flex items-center justify-between text-xs">
                <button type="button" onclick="confirmResetDevice()" class="text-zinc-500 hover:text-red-400 transition-colors">
                    Reset Account
                </button>
            </div>
        </div>

        <!-- VIEW B: Device Register View (Only when NO account is bound to this device) -->
        <div id="deviceRegisterView" style="display: none;">
            <div class="text-center mb-6">
                <h2 class="text-xl font-medium text-white mb-1">Create Account</h2>
                <p class="text-xs text-zinc-500">Choose your handle and PIN.</p>
            </div>

            <form id="signupForm" onsubmit="handleDeviceRegister(event)" class="space-y-4">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block mb-1 text-zinc-400 text-xs font-normal">First Name</label>
                        <input type="text" id="regFirstName" placeholder="First" required class="input-style">
                    </div>
                    <div>
                        <label class="block mb-1 text-zinc-400 text-xs font-normal">Last Name</label>
                        <input type="text" id="regLastName" placeholder="Last" required class="input-style">
                    </div>
                </div>

                <div>
                    <label class="block mb-1 text-zinc-400 text-xs font-normal">Nickname</label>
                    <input type="text" id="regNickname" placeholder="Choose a handle" required class="input-style" autocomplete="username">
                </div>

                <div>
                    <label class="block mb-1 text-zinc-400 text-xs font-normal">Security PIN (4-6 digits)</label>
                    <input type="password" id="regPin" placeholder="••••" maxlength="6" pattern="[0-9]{4,6}" inputmode="numeric" required class="input-style tracking-widest font-mono">
                </div>

                <button type="submit" class="btn-primary-purple mt-2">
                    <span>Create Account</span>
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>
            </form>

            <div id="registerMessage" class="mt-4 text-center"></div>
        </div>

        </div>
    </div>

    <script>
        let currentBoundAccount = null;

        // Initialize and enforce single account per device
        async function initAuthView() {
            currentBoundAccount = await window.TwelveAMAuth.getBoundDeviceAccount();

            const loginView = document.getElementById('deviceLoginView');
            const regView = document.getElementById('deviceRegisterView');

            if (currentBoundAccount) {
                // Device already has an account: show Login View
                document.getElementById('deviceUserName').textContent = `Welcome, ${currentBoundAccount.firstName || currentBoundAccount.nickname}`;
                document.getElementById('deviceUserNick').textContent = `@${currentBoundAccount.nickname}`;

                loginView.style.display = 'block';
                regView.style.display = 'none';

                // If already logged in, redirect to dashboard or show session
                const active = window.TwelveAMAuth.getCurrentUser();
                if (active) {
                    document.getElementById('loginMessage').innerHTML = `<div class="success-message">Device is already unlocked as @${active.nickname}. <a href="dashboard.html" class="underline font-bold">Go to Dashboard &rarr;</a></div>`;
                }
            } else {
                // Device has NO account: show Register View
                loginView.style.display = 'none';
                regView.style.display = 'block';
            }
        }

        function getRedirectTarget() {
            try {
                const params = new URLSearchParams(window.location.search);
                const r = params.get('redirect');
                if (r && !r.includes('authentication.html') && !r.includes('//')) {
                    return r;
                }
            } catch(e) {}
            return 'dashboard.html';
        }

        async function handleDeviceRegister(e) {
            e.preventDefault();
            const msgEl = document.getElementById('registerMessage');
            msgEl.innerHTML = '';

            const firstName = document.getElementById('regFirstName').value.trim();
            const lastName = document.getElementById('regLastName').value.trim();
            const nickname = document.getElementById('regNickname').value.trim();
            const pin = document.getElementById('regPin').value.trim();

            if (!firstName || !lastName || !nickname || !pin) {
                msgEl.innerHTML = '<div class="error-message">All fields are required.</div>';
                return;
            }

            if (!/^\d{4,6}$/.test(pin)) {
                msgEl.innerHTML = '<div class="error-message">PIN must be 4 to 6 numbers (e.g. 1234).</div>';
                return;
            }

            const res = await window.TwelveAMAuth.registerAccount({
                firstName,
                lastName,
                nickname,
                pin
            });

            if (!res.success) {
                msgEl.innerHTML = `<div class="error-message">${res.error}</div>`;
                return;
            }

            msgEl.innerHTML = `<div class="success-message">Device bound successfully to @${nickname}! Redirecting...</div>`;
            setTimeout(() => {
                window.location.href = getRedirectTarget();
            }, 600);
        }

        async function handleDeviceLogin(e) {
            e.preventDefault();
            const msgEl = document.getElementById('loginMessage');
            msgEl.innerHTML = '';

            const pin = document.getElementById('loginPin').value.trim();
            if (!pin) {
                msgEl.innerHTML = '<div class="error-message">Please enter your PIN.</div>';
                return;
            }

            const res = await window.TwelveAMAuth.loginAccount(pin);
            if (!res.success) {
                msgEl.innerHTML = `<div class="error-message">${res.error}</div>`;
                return;
            }

            msgEl.innerHTML = `<div class="success-message">Unlocked! Welcome back, ${res.account.nickname}. Redirecting...</div>`;
            setTimeout(() => {
                window.location.href = getRedirectTarget();
            }, 500);
        }

        async function confirmResetDevice() {
            const confirmed = confirm(
                "Are you sure you want to reset this device?\n\nThis will permanently delete the single account registered to this browser so a new profile can be created. This prevents glitching and spam."
            );
            if (!confirmed) return;

            await window.TwelveAMAuth.resetDevice();
            alert("Device profile wiped. You may now create a fresh account.");
            window.location.reload();
        }

        window.addEventListener('DOMContentLoaded', initAuthView);
    </script>
</body>
</html>
