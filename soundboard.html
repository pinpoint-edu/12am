<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12AM — Soundboard</title>
    <meta name="description" content="High-fidelity interactive soundboard with Web Audio API 300% volume boost and rapid sound triggering.">

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- 12AM Core Theme & Navigation -->
    <link rel="stylesheet" href="navigation.css">
    <script src="theme.js"></script>
    <script src="device-auth.js"></script>
    <script src="navigation.js" defer></script>

    <style>
        *, *::before, *::after,
        h1, h2, h3, h4, h5, h6,
        b, strong, th,
        .font-bold, .font-semibold, .font-extrabold, .font-black {
            font-weight: 500 !important;
        }

        :root {
            --bg-page: var(--bg-primary, #040404);
            --bg-card: var(--bg-secondary, #0c0c0e);
            --text-main: var(--text-primary, #ffffff);
            --text-muted: var(--text-secondary, #a1a1aa);
            --accent-color: var(--accent-primary, #8b5cf6);
            --accent-glow: var(--accent-secondary, rgba(139, 92, 246, 0.4));
            --border-main: var(--border-primary, #1c1c20);
            --border-faint: var(--border-secondary, rgba(255, 255, 255, 0.06));
            --btn-bg: var(--button-bg, rgba(139, 92, 246, 0.12));
        }

        body {
            font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            min-height: 100vh;
            margin: 0;
            padding: 0;
            padding-top: 5rem !important;
            padding-bottom: 7rem;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        #minimal-footer-cluster {
            position: fixed !important;
            bottom: 1.5rem !important;
            right: 28px !important;
            margin: 0 !important;
            z-index: 999 !important;
        }

        .soundboard-layout {
            max-width: 1300px;
            width: 100%;
            margin: 0 auto;
            padding: 0 1.5rem;
            box-sizing: border-box;
            flex: 1 0 auto;
        }

        /* Top Section Headers */
        .section-header-wrap {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border-faint);
        }

        .section-title {
            font-size: 1.15rem;
            font-weight: 500;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-count {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-family: monospace;
        }

        /* Sound Grid & Pinning */
        .sound-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 10px;
            margin-bottom: 2.5rem;
        }

        .sound-card {
            background: var(--bg-card);
            border: 1px solid var(--border-main);
            border-radius: 16px;
            padding: 10px 14px;
            min-height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-size: 0.84rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
            user-select: none;
            line-height: 1.3;
            word-break: break-word;
            position: relative;
            outline: none;
            text-align: left;
        }

        .sound-card:hover {
            border-color: var(--accent-color);
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.04);
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
        }

        .sound-card:active,
        .sound-card.playing {
            background: var(--btn-bg) !important;
            border-color: var(--accent-color) !important;
            color: var(--accent-color) !important;
            box-shadow: 0 0 16px var(--accent-glow) !important;
        }

        .sound-card.pinned {
            border-color: rgba(234, 179, 8, 0.35);
            background: rgba(234, 179, 8, 0.04);
        }

        .sound-title {
            flex: 1 1 auto;
            font-size: 0.84rem;
            color: var(--text-main);
            line-height: 1.3;
            word-break: break-word;
        }

        .sound-pin-btn {
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            border-radius: 6px;
            background: transparent;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            opacity: 0.4;
            transition: all 0.15s ease;
            padding: 0;
        }

        .sound-pin-btn:hover {
            opacity: 1;
            color: #facc15;
            background: rgba(255, 255, 255, 0.08);
        }

        .sound-card.pinned .sound-pin-btn {
            opacity: 1;
            color: #facc15;
        }

        /* Floating Bottom Controls Bar */
        .floating-bottom-bar {
            position: fixed;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 2rem);
            max-width: 820px;
            background: rgba(12, 12, 16, 0.88);
            backdrop-filter: blur(28px) saturate(180%);
            -webkit-backdrop-filter: blur(28px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 0.7rem 1.2rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px var(--accent-glow);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            z-index: 1000;
        }

        .search-area {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-main);
            border-radius: 16px;
            padding: 6px 14px;
            transition: border-color 0.2s;
        }

        .search-area:focus-within {
            border-color: var(--accent-color);
        }

        .search-area input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-size: 0.92rem;
            width: 100%;
            font-family: inherit;
        }

        .search-area input::placeholder {
            color: var(--text-muted);
            opacity: 0.7;
        }

        .controls-area {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        /* Volume Booster Slider */
        .volume-control-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-faint);
            border-radius: 16px;
            padding: 6px 12px;
        }

        .volume-icon {
            font-size: 16px;
            color: var(--text-muted);
            cursor: pointer;
        }

        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 80px;
            height: 4px;
            border-radius: 2px;
            background: var(--border-main);
            outline: none;
            cursor: pointer;
            transition: background 0.2s;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent-color);
            cursor: pointer;
            box-shadow: 0 0 8px var(--accent-glow);
        }

        .volume-slider::-moz-range-thumb {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent-color);
            cursor: pointer;
            border: none;
        }

        .volume-val {
            font-size: 0.75rem;
            color: var(--accent-color);
            font-family: monospace;
            min-width: 38px;
            text-align: right;
        }

        .bar-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-main);
            border-radius: 16px;
            height: 38px;
            padding: 0 14px;
            color: var(--text-muted);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            outline: none;
        }

        .bar-btn:hover {
            color: var(--text-main);
            border-color: var(--accent-color);
            background: var(--btn-bg);
        }

        .bar-btn.active {
            color: var(--accent-color);
            border-color: var(--accent-color);
            background: var(--btn-bg);
        }

        .bar-btn-stop {
            color: #f87171 !important;
            border-color: rgba(248, 113, 113, 0.3) !important;
        }

        .bar-btn-stop:hover {
            background: rgba(248, 113, 113, 0.15) !important;
            border-color: #f87171 !important;
        }

        /* Centered Minimal Footer */
        .soundboard-footer {
            margin-top: 5rem;
            border-top: 1px solid var(--border-faint);
            padding: 2rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="page-content" class="soundboard-layout">
        <!-- Normal Sounds -->
        <section id="normalSection">
            <div class="section-header-wrap">
                <div class="section-title">
                    <span class="material-symbols-sharp" style="color: var(--accent-color);">volume_up</span>
                    <span>Soundboard</span>
                </div>
                <span class="section-count" id="normalCount">Loading...</span>
            </div>
            <div class="sound-grid" id="normalGrid"></div>
        </section>

        <!-- Explicit Sounds -->
        <section id="explicitSection">
            <div class="section-header-wrap">
                <div class="section-title">
                    <span class="material-symbols-sharp" style="color: #f87171;">warning</span>
                    <span>Explicit Sounds</span>
                </div>
                <span class="section-count" id="explicitCount">0 sounds</span>
            </div>
            <div class="sound-grid" id="explicitGrid"></div>
        </section>

        <!-- Third Party Sounds -->
        <section id="thirdPartySection">
            <div class="section-header-wrap">
                <div class="section-title">
                    <span class="material-symbols-sharp" style="color: #60a5fa;">hub</span>
                    <span>Community Sounds</span>
                </div>
                <span class="section-count" id="thirdPartyCount">Loading...</span>
            </div>
            <div class="sound-grid" id="thirdPartyGrid"></div>
        </section>
    </div>

    <!-- Floating Bottom Controls Bar -->
    <div class="floating-bottom-bar">
        <div class="search-area">
            <span class="material-symbols-sharp" style="color: var(--text-muted); font-size: 18px;">search</span>
            <input type="text" id="soundSearchInput" placeholder="Search sounds... (Press /)" autocomplete="off">
        </div>

        <div class="controls-area">
            <!-- 300% Web Audio API Volume Booster -->
            <div class="volume-control-wrap" title="Web Audio API Volume Booster (Up to 300%)">
                <span class="material-symbols-sharp volume-icon" id="volumeIcon">volume_up</span>
                <input type="range" id="volumeSlider" class="volume-slider" min="0" max="300" value="100">
                <span class="volume-val" id="volumeVal">100%</span>
            </div>

            <!-- Overlay Mode -->
            <button class="bar-btn active" id="overlayBtn" title="Play sounds simultaneously without cutting off (Press X)">
                <span class="material-symbols-sharp" style="font-size: 16px;">layers</span>
                <span class="hidden sm:inline">Overlay</span>
            </button>

            <!-- Stop All Sounds -->
            <button class="bar-btn bar-btn-stop" id="stopAllBtn" title="Stop all playing audio (Press Space)">
                <span class="material-symbols-sharp" style="font-size: 16px;">volume_off</span>
                <span class="hidden sm:inline">Stop</span>
            </button>
        </div>
    </div>

    <script type="module">
        // Import Community Sounds from genizymath (pinpoint-mini soundboard source)
        let thirdPartyList = [];
        try {
            const mod = await import('https://cdn.jsdelivr.net/gh/genizymath/soundboard@main/sounds.js');
            thirdPartyList = mod.sounds || [];
        } catch(e) {
            console.warn('Could not load community sounds:', e);
        }

        // Pinned Sounds System (pinpoint-mini compatibility)
        function getPinnedSounds() {
            try {
                return JSON.parse(localStorage.getItem('soundboard_pinned_sounds') || localStorage.getItem('favorites') || '[]');
            } catch(e) {
                return [];
            }
        }

        function savePinnedSounds(list) {
            try {
                localStorage.setItem('soundboard_pinned_sounds', JSON.stringify(list));
                localStorage.setItem('favorites', JSON.stringify(list));
            } catch(e) {}
        }

        function isPinned(name) {
            const list = getPinnedSounds();
            return list.some(item => (typeof item === 'string' ? item : item.name) === name);
        }

        function togglePin(name, cardEl) {
            let list = getPinnedSounds();
            const exists = list.some(item => (typeof item === 'string' ? item : item.name) === name);
            if (exists) {
                list = list.filter(item => (typeof item === 'string' ? item : item.name) !== name);
                cardEl.classList.remove('pinned');
            } else {
                list.push(name);
                cardEl.classList.add('pinned');
            }
            savePinnedSounds(list);
            loadAllSounds();
        }

        // --- Web Audio API Gain Node State (Volume Booster 0% - 300%) ---
        let audioCtx = null;
        let masterGain = null;
        let currentVolumeFactor = 1.0;
        let isOverlayMode = true;
        let activeAudios = [];

        function initAudioContext() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
                masterGain = audioCtx.createGain();
                masterGain.gain.setValueAtTime(currentVolumeFactor, audioCtx.currentTime);
                masterGain.connect(audioCtx.destination);
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return { audioCtx, masterGain };
        }

        // Volume Slider Control
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeVal = document.getElementById('volumeVal');
        const volumeIcon = document.getElementById('volumeIcon');

        function updateVolume(val) {
            const num = parseInt(val, 10);
            currentVolumeFactor = num / 100;
            volumeVal.textContent = `${num}%`;

            if (num === 0) {
                volumeIcon.textContent = 'volume_off';
            } else if (num < 100) {
                volumeIcon.textContent = 'volume_down';
            } else if (num > 100) {
                volumeIcon.textContent = 'volume_up';
                volumeVal.style.color = '#f59e0b'; // Amber warning for boosted
            } else {
                volumeIcon.textContent = 'volume_up';
                volumeVal.style.color = 'var(--accent-color)';
            }

            if (masterGain && audioCtx) {
                masterGain.gain.setValueAtTime(currentVolumeFactor, audioCtx.currentTime);
            }
            try {
                localStorage.setItem('12am_soundboard_vol', String(num));
            } catch(e) {}
        }

        volumeSlider.addEventListener('input', (e) => updateVolume(e.target.value));

        // Restore volume
        try {
            const savedVol = localStorage.getItem('12am_soundboard_vol');
            if (savedVol) {
                volumeSlider.value = savedVol;
                updateVolume(savedVol);
            }
        } catch(e) {}

        // Overlay Toggle
        const overlayBtn = document.getElementById('overlayBtn');
        function toggleOverlay() {
            isOverlayMode = !isOverlayMode;
            overlayBtn.classList.toggle('active', isOverlayMode);
            if (!isOverlayMode) stopAllAudios();
        }
        overlayBtn.addEventListener('click', toggleOverlay);

        // Stop All Audios
        const stopAllBtn = document.getElementById('stopAllBtn');
        function stopAllAudios() {
            activeAudios.forEach(({ audio, btn }) => {
                try {
                    audio.pause();
                    audio.currentTime = 0;
                } catch(e) {}
                if (btn) btn.classList.remove('playing');
            });
            activeAudios = [];
        }
        stopAllBtn.addEventListener('click', stopAllAudios);

        // Sound Trigger with Web Audio API Boost
        async function playSound(audioUrl, btn) {
            initAudioContext();
            if (!isOverlayMode) {
                stopAllAudios();
            }

            try {
                const audio = new Audio(audioUrl);
                audio.crossOrigin = 'anonymous';

                if (audioCtx && masterGain) {
                    try {
                        const source = audioCtx.createMediaElementSource(audio);
                        source.connect(masterGain);
                    } catch(err) {
                        audio.volume = Math.min(1, currentVolumeFactor);
                    }
                }

                btn.classList.add('playing');
                const entry = { audio, btn };
                activeAudios.push(entry);

                audio.addEventListener('ended', () => {
                    btn.classList.remove('playing');
                    activeAudios = activeAudios.filter(x => x !== entry);
                });

                audio.addEventListener('error', () => {
                    btn.classList.remove('playing');
                    activeAudios = activeAudios.filter(x => x !== entry);
                });

                await audio.play();
            } catch(err) {
                console.warn('Playback error:', err);
                btn.classList.remove('playing');
            }
        }

        // Create Sound Card Element with Pin Button
        function createSoundCard(name, url) {
            const card = document.createElement('div');
            card.className = 'sound-card';
            if (isPinned(name)) {
                card.classList.add('pinned');
            }
            card.dataset.name = name.toLowerCase();

            const title = document.createElement('span');
            title.className = 'sound-title';
            title.textContent = name;

            const pinBtn = document.createElement('button');
            pinBtn.type = 'button';
            pinBtn.className = 'sound-pin-btn';
            pinBtn.title = 'Left-click to pin/unpin sound';
            pinBtn.innerHTML = '<span class="material-symbols-sharp" style="font-size: 16px;">push_pin</span>';

            pinBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                togglePin(name, card);
            });

            card.addEventListener('click', () => playSound(url, card));

            card.appendChild(title);
            card.appendChild(pinBtn);
            return card;
        }

        // Sort Sounds Helper: Pinned sounds automatically move to top
        function sortPinned(list, getName) {
            return [...list].sort((a, b) => {
                const aName = getName(a);
                const bName = getName(b);
                const aPinned = isPinned(aName);
                const bPinned = isPinned(bName);
                if (aPinned && !bPinned) return -1;
                if (!aPinned && bPinned) return 1;
                return 0;
            });
        }

        // Load 4SP & Community Sounds
        const soundBlacklist = ['ear ringing', 'smoke detector'];

        async function loadAllSounds() {
            const normalGrid = document.getElementById('normalGrid');
            const explicitGrid = document.getElementById('explicitGrid');
            const thirdPartyGrid = document.getElementById('thirdPartyGrid');

            // 1. Load Local 4SP CDN Sounds
            try {
                const res = await fetch('https://cdn.jsdelivr.net/npm/4sp-sounds@latest/soundboard_names.json');
                const data = await res.json();

                if (Array.isArray(data.NormalSounds)) {
                    const normalFiltered = data.NormalSounds.filter(f => {
                        const n = f.replace('.mp3', '').replace(/_/g, ' ').toLowerCase();
                        return !soundBlacklist.some(b => n.includes(b));
                    });
                    const normalSorted = sortPinned(normalFiltered, f => f.replace('.mp3', '').replace(/_/g, ' '));
                    document.getElementById('normalCount').textContent = `${normalSorted.length} sounds`;
                    normalGrid.innerHTML = '';
                    normalSorted.forEach(f => {
                        const name = f.replace('.mp3', '').replace(/_/g, ' ');
                        const path = `https://cdn.jsdelivr.net/npm/4sp-sounds@latest/sounds/${f}`;
                        normalGrid.appendChild(createSoundCard(name, path));
                    });
                }

                if (Array.isArray(data.ExplicitSounds)) {
                    const explicitFiltered = data.ExplicitSounds.filter(f => {
                        const n = f.replace('.mp3', '').replace(/_/g, ' ').toLowerCase();
                        return !soundBlacklist.some(b => n.includes(b));
                    });
                    const explicitSorted = sortPinned(explicitFiltered, f => f.replace('.mp3', '').replace(/_/g, ' '));
                    document.getElementById('explicitCount').textContent = `${explicitSorted.length} sounds`;
                    explicitGrid.innerHTML = '';
                    explicitSorted.forEach(f => {
                        const name = f.replace('.mp3', '').replace(/_/g, ' ');
                        const path = `https://cdn.jsdelivr.net/npm/4sp-sounds@latest/sounds/${f}`;
                        explicitGrid.appendChild(createSoundCard(name, path));
                    });
                }
            } catch(e) {
                console.warn('Failed loading 4SP sounds:', e);
                normalGrid.innerHTML = '<div style="color: #f87171; font-size: 0.85rem; padding: 1rem;">Unable to load sound directory.</div>';
            }

            // 2. Load Community Sounds (genizymath soundboard format)
            if (thirdPartyList && thirdPartyList.length > 0) {
                const thirdPartyFiltered = thirdPartyList.filter(s => {
                    const n = (s.name || '').toLowerCase();
                    return !soundBlacklist.some(b => n.includes(b));
                });
                const thirdPartySorted = sortPinned(thirdPartyFiltered, s => s.name);
                document.getElementById('thirdPartyCount').textContent = `${thirdPartySorted.length} sounds`;
                thirdPartyGrid.innerHTML = '';
                thirdPartySorted.forEach(s => {
                    const path = s.mp3.startsWith('http')
                        ? s.mp3
                        : 'https://cdn.jsdelivr.net/gh/genizymath/soundboard@main' + (s.mp3.startsWith('/') ? '' : '/') + s.mp3;
                    thirdPartyGrid.appendChild(createSoundCard(s.name, path));
                });
            } else {
                document.getElementById('thirdPartyCount').textContent = '0 sounds';
                thirdPartyGrid.innerHTML = '<div style="color: var(--text-muted); font-size: 0.85rem; padding: 1rem;">No community sounds available.</div>';
            }

            // Reapply any active search filter
            applySearch();
        }

        // Live Filtering
        const searchInput = document.getElementById('soundSearchInput');
        function applySearch() {
            const query = searchInput.value.toLowerCase().trim();
            const allCards = document.querySelectorAll('.sound-card');
            allCards.forEach(card => {
                const name = card.dataset.name || '';
                if (!query || name.includes(query)) {
                    card.style.display = '';
                } else {
                    card.style.display = 'none';
                }
            });
        }
        searchInput.addEventListener('input', applySearch);

        // pinpoint-mini Soundboard Shortcuts: Space to stop, X for overlap, / for search, Escape to blur
        window.addEventListener('keydown', (e) => {
            if (document.activeElement === searchInput) {
                if (e.key === 'Escape') {
                    searchInput.blur();
                }
                return;
            }
            if (['INPUT', 'TEXTAREA'].includes(e.target.tagName)) return;

            if (e.code === 'Space') {
                e.preventDefault();
                stopAllAudios();
            } else if (e.key === 'x' || e.key === 'X') {
                e.preventDefault();
                toggleOverlay();
            } else if (e.key === '/') {
                e.preventDefault();
                searchInput.focus();
                searchInput.select();
            }
        });

        loadAllSounds();
    </script>
</body>
</html>
