<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>12AM — AI Assistant</title>
  <meta name="description" content="Instant homework help, coding assistance, and intelligent answers on 12AM.">

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- KaTeX for LaTeX Math Rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

  <!-- Highlight.js for Code & JSON syntax highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <!-- 12AM Core Theme & Navigation -->
  <link rel="stylesheet" href="navigation.css">
  <script src="theme.js"></script>
  <script src="device-auth.js"></script>
  <script src="navigation.js" defer></script>

  <style>
    html, body {
      height: 100%;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    body {
      padding-top: var(--navbar-height);
      display: flex;
      flex-direction: column;
      background: var(--bg-page);
    }

    .ai-page-layout {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      padding: 1rem 1.25rem;
      box-sizing: border-box;
      height: calc(100vh - var(--navbar-height));
      overflow: hidden;
    }

    /* Subheader controls */
    .ai-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border-main);
      flex-shrink: 0;
    }

    .ai-model-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 16px;
      background: var(--btn-bg);
      border: 1px solid var(--accent-glow);
      color: var(--accent-color);
      font-size: 0.75rem;
      font-weight: 500;
    }

    .ai-model-pill .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }

    .ai-actions-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ai-btn-small {
      height: 36px;
      padding: 0 14px;
      border-radius: 16px;
      background: var(--bg-card);
      border: 1px solid var(--border-main);
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .ai-btn-small:hover {
      border-color: var(--accent-color);
      color: var(--text-main);
    }

    /* Messages History */
    .ai-chat-history {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem 0;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      scroll-behavior: smooth;
    }

    .welcome-card {
      text-align: center;
      padding: 2.5rem 1rem;
      margin: auto 0;
    }

    .welcome-avatar {
      width: 64px;
      height: 64px;
      border-radius: 24px;
      background: var(--bg-card);
      border: 1px solid var(--border-main);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.2rem;
      color: var(--accent-color);
      font-size: 26px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    .welcome-title {
      font-size: 1.6rem;
      font-weight: 500;
      letter-spacing: -0.02em;
      margin: 0 0 0.5rem;
      color: var(--text-main);
    }

    .welcome-desc {
      color: var(--text-muted);
      font-size: 0.95rem;
      max-width: 460px;
      margin: 0 auto 1.5rem;
      line-height: 1.5;
    }

    .prompt-suggestions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      max-width: 600px;
      margin: 0 auto;
    }

    .prompt-chip {
      background: var(--bg-card);
      border: 1px solid var(--border-main);
      color: var(--text-muted);
      padding: 8px 18px;
      border-radius: 18px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .prompt-chip:hover {
      border-color: var(--accent-color);
      color: var(--accent-color);
      background: var(--btn-bg);
      transform: translateY(-1px);
    }

    /* Message Bubbles */
    .message-row {
      display: flex;
      gap: 12px;
      width: 100%;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .message-avatar {
      width: 38px;
      height: 38px;
      border-radius: 16px;
      background: var(--bg-card);
      border: 1px solid var(--border-main);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: var(--accent-color);
      flex-shrink: 0;
    }

    .message-bubble {
      max-width: 84%;
      padding: 0.55rem 0.9rem;
      border-radius: 16px;
      font-size: 0.88rem;
      font-weight: 400;
      line-height: 1.5;
      word-break: break-word;
    }

    .message-bubble > *:first-child {
      margin-top: 0;
    }

    .message-bubble > *:last-child {
      margin-bottom: 0;
    }

    .message-bubble p {
      margin: 0.35rem 0;
    }

    .message-bubble h1,
    .message-bubble h2,
    .message-bubble h3,
    .message-bubble h4 {
      font-weight: 500;
      color: var(--text-main);
      margin: 0.6rem 0 0.25rem 0;
      line-height: 1.3;
    }

    .message-bubble h1 { font-size: 1.15rem; }
    .message-bubble h2 { font-size: 1.05rem; }
    .message-bubble h3 { font-size: 0.95rem; }
    .message-bubble h4 { font-size: 0.88rem; }

    .message-bubble strong,
    .message-bubble b {
      font-weight: 600;
      color: var(--text-main);
    }

    .message-bubble em,
    .message-bubble i {
      font-style: italic;
    }

    .message-bubble u,
    .message-bubble ins {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .message-bubble ul,
    .message-bubble ol {
      margin: 0.35rem 0;
      padding-left: 1.3rem;
    }

    .message-bubble li {
      margin: 0.2rem 0;
    }

    .message-bubble blockquote {
      border-left: 3px solid var(--accent-color);
      padding: 0.25rem 0 0.25rem 0.75rem;
      margin: 0.4rem 0;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border-radius: 6px;
    }

    .message-bubble table {
      border-collapse: collapse;
      width: 100%;
      margin: 0.5rem 0;
      font-size: 0.82rem;
      overflow-x: auto;
      display: block;
    }

    .message-bubble th,
    .message-bubble td {
      border: 1px solid var(--border-main);
      padding: 6px 10px;
      text-align: left;
    }

    .message-bubble th {
      background: var(--bg-page);
      font-weight: 500;
      color: var(--text-main);
    }

    .message-bubble hr {
      border: none;
      border-top: 1px solid var(--border-main);
      margin: 0.6rem 0;
    }

    .message-row.user .message-bubble {
      background: var(--btn-bg);
      border: 1px solid var(--accent-color);
      color: var(--text-main);
      border-bottom-right-radius: 6px;
    }

    .message-row.bot .message-bubble {
      background: var(--bg-card);
      border: 1px solid var(--border-main);
      color: var(--text-main);
      border-bottom-left-radius: 6px;
    }

    .message-bubble pre {
      position: relative;
      background: #0d0f12;
      border: 1px solid var(--border-main);
      border-radius: 12px;
      padding: 10px 14px;
      padding-top: 30px;
      overflow-x: auto;
      margin: 0.5rem 0;
      font-size: 0.82rem;
    }

    .message-bubble code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 0.82rem;
    }

    .message-bubble :not(pre) > code {
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 6px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--accent-color);
    }

    .code-copy-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      padding: 3px 8px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-main);
      border-radius: 6px;
      color: var(--text-muted);
      font-size: 0.7rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
      user-select: none;
    }

    .code-copy-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.16);
      border-color: var(--accent-color);
    }

    /* KaTeX overrides */
    .katex-display {
      margin: 0.5rem 0 !important;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 4px 0;
    }

    /* Input Bar */
    .ai-input-container {
      padding-top: 0.75rem;
      flex-shrink: 0;
    }

    .ai-input-box {
      display: flex;
      align-items: center;
      background: var(--bg-card);
      border: 1px solid var(--border-main);
      border-radius: 24px;
      padding: 6px 8px 6px 18px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
      transition: all 0.2s ease;
    }

    .ai-input-box:focus-within {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .ai-input-box input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 0.95rem;
      font-family: inherit;
      font-weight: 400;
    }

    .ai-send-btn {
      width: 42px;
      height: 42px;
      border-radius: 18px;
      background: var(--accent-color);
      border: none;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .ai-send-btn:hover {
      box-shadow: 0 0 12px var(--accent-glow);
      transform: scale(1.04);
    }

    .ai-send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    img {
      max-width: 100%;
      height: auto;
    }
  </style>
</head>
<body class="grid-bg">
  <div id="dynamic-background"></div>

  <div class="ai-page-layout">
    <!-- Subheader toolbar -->
    <div class="ai-toolbar">
      <div class="ai-model-pill">
        <span class="dot"></span>
        <span id="modelLabel">Qwen 2.5 27B / Fast Multi-Model</span>
      </div>
      <div class="ai-actions-row">
        <button class="ai-btn-small" onclick="clearChat()" title="Clear Chat History">
          <i class="fa-solid fa-trash-can"></i>
          <span>Clear</span>
        </button>
        <button class="ai-btn-small" onclick="setCustomApiKey()" title="Custom Groq API Key">
          <i class="fa-solid fa-key"></i>
          <span>Key</span>
        </button>
      </div>
    </div>

    <!-- Messages -->
    <div class="ai-chat-history" id="chatHistory">
      <div class="welcome-card" id="welcomeCard">
        <div class="welcome-avatar">
          <i class="fa-solid fa-robot"></i>
        </div>
        <h2 class="welcome-title">12AM AI</h2>
        <p class="welcome-desc">Fast responses, code generation, study guides, and unblocked AI research.</p>
        <div class="prompt-suggestions">
          <button class="prompt-chip" onclick="usePrompt('Explain quantum computing simply')">Quantum computing</button>
          <button class="prompt-chip" onclick="usePrompt('Write a clean JavaScript Snake game in HTML5 canvas')">Code a Snake game</button>
          <button class="prompt-chip" onclick="usePrompt('Help me study for a math test on quadratic formulas')">Quadratic math test</button>
          <button class="prompt-chip" onclick="usePrompt('Give me a creative strategy for Retro Bowl')">Retro Bowl strategy</button>
        </div>
      </div>
    </div>

    <!-- Input bar -->
    <div class="ai-input-container">
      <div class="ai-input-box">
        <input type="text" id="aiInput" placeholder="Ask 12AM AI anything..." autocomplete="off">
        <button class="ai-send-btn" id="sendBtn" onclick="sendMessage()" title="Send">
          <i class="fa-solid fa-arrow-up"></i>
        </button>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_GROQ_KEY = String.fromCharCode(103,115,107,95,83,77,109,69,107,118,105,72,104,74,82,67,75,118,80,98,79,87,107,69,87,71,100,121,98,51,70,89,55,79,49,114,120,103,52,90,68,48,68,122,101,71,107,99,122,103,88,57,86,112,48,109);
    let messages = [];

    function getApiKey() {
      return localStorage.getItem('12am_groq_key') || DEFAULT_GROQ_KEY;
    }

    function setCustomApiKey() {
      const current = localStorage.getItem('12am_groq_key') || '';
      const key = prompt('Enter your custom Groq API key (leave empty to use default):', current);
      if (key !== null) {
        if (key.trim()) {
          localStorage.setItem('12am_groq_key', key.trim());
          alert('Custom API key saved.');
        } else {
          localStorage.removeItem('12am_groq_key');
          alert('Reverted to default key.');
        }
      }
    }

    function usePrompt(text) {
      document.getElementById('aiInput').value = text;
      sendMessage();
    }

    function clearChat() {
      messages = [];
      const container = document.getElementById('chatHistory');
      container.innerHTML = `
        <div class="welcome-card" id="welcomeCard">
          <div class="welcome-avatar">
            <i class="fa-solid fa-robot"></i>
          </div>
          <h2 class="welcome-title">12AM AI</h2>
          <p class="welcome-desc">Fast responses, code generation, study guides, and unblocked AI research.</p>
          <div class="prompt-suggestions">
            <button class="prompt-chip" onclick="usePrompt('Explain quantum computing simply')">Quantum computing</button>
            <button class="prompt-chip" onclick="usePrompt('Write a clean JavaScript Snake game in HTML5 canvas')">Code a Snake game</button>
            <button class="prompt-chip" onclick="usePrompt('Help me study for a math test on quadratic formulas')">Quadratic math test</button>
            <button class="prompt-chip" onclick="usePrompt('Give me a creative strategy for Retro Bowl')">Retro Bowl strategy</button>
          </div>
        </div>
      `;
    }

    if (typeof marked !== 'undefined') {
      marked.setOptions({
        breaks: true,
        gfm: true
      });
    }

    function renderBubbleContent(bubble, text) {
      if (typeof marked !== 'undefined') {
        bubble.innerHTML = marked.parse(text);
      } else {
        bubble.textContent = text;
      }

      // Syntax highlighting for code & json blocks
      if (typeof hljs !== 'undefined') {
        bubble.querySelectorAll('pre code').forEach((block) => {
          try {
            hljs.highlightElement(block);
          } catch (e) {
            console.warn('Highlight.js error:', e);
          }
        });
      }

      // LaTeX math formulas rendering (KaTeX)
      if (window.renderMathInElement) {
        try {
          renderMathInElement(bubble, {
            delimiters: [
              { left: '$$', right: '$$', display: true },
              { left: '$', right: '$', display: false },
              { left: '\\[', right: '\\]', display: true },
              { left: '\\(', right: '\\)', display: false }
            ],
            ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX render error:', e);
        }
      }

      // Add copy button to code blocks
      bubble.querySelectorAll('pre').forEach(pre => {
        if (pre.querySelector('.code-copy-btn')) return;
        const btn = document.createElement('button');
        btn.className = 'code-copy-btn';
        btn.type = 'button';
        btn.innerHTML = '<i class="fa-regular fa-copy"></i> <span>Copy</span>';
        btn.onclick = () => {
          const code = pre.querySelector('code');
          const textToCopy = code ? code.innerText : pre.innerText;
          navigator.clipboard.writeText(textToCopy).then(() => {
            btn.innerHTML = '<i class="fa-solid fa-check"></i> <span>Copied</span>';
            setTimeout(() => {
              btn.innerHTML = '<i class="fa-regular fa-copy"></i> <span>Copy</span>';
            }, 2000);
          }).catch(() => {
            btn.innerHTML = '<span>Failed</span>';
          });
        };
        pre.appendChild(btn);
      });
    }

    function appendMessage(role, content) {
      const welcome = document.getElementById('welcomeCard');
      if (welcome) welcome.remove();

      const container = document.getElementById('chatHistory');
      const row = document.createElement('div');
      row.className = `message-row ${role === 'user' ? 'user' : 'bot'}`;

      const avatar = document.createElement('div');
      avatar.className = 'message-avatar';
      avatar.innerHTML = role === 'user' ? '<i class="fa-solid fa-user"></i>' : '<i class="fa-solid fa-robot"></i>';

      const bubble = document.createElement('div');
      bubble.className = 'message-bubble';
      
      if (role === 'assistant') {
        renderBubbleContent(bubble, content);
      } else {
        bubble.textContent = content;
      }

      if (role === 'user') {
        row.appendChild(bubble);
        row.appendChild(avatar);
      } else {
        row.appendChild(avatar);
        row.appendChild(bubble);
      }

      container.appendChild(row);
      container.scrollTop = container.scrollHeight;
      return bubble;
    }

    async function sendMessage() {
      const input = document.getElementById('aiInput');
      const text = input.value.trim();
      if (!text) return;

      input.value = '';
      appendMessage('user', text);
      messages.push({ role: 'user', content: text });

      const sendBtn = document.getElementById('sendBtn');
      sendBtn.disabled = true;

      const botBubble = appendMessage('assistant', 'Thinking...');
      const GROQ_MODELS = ['qwen/qwen3.8-27b', 'allam-2-7b', 'openai/gpt-oss-120b'];

      try {
        let lastError = null;
        let reply = null;

        for (const modelName of GROQ_MODELS) {
          try {
            const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${getApiKey()}`
              },
              body: JSON.stringify({
                model: modelName,
                messages: [
                  { 
                    role: 'system', 
                    content: 'You are 12AM AI, an intelligent, concise, highly capable academic, math, and coding assistant on 12AM. You format answers cleanly using Markdown (titles with #/##/###, bold with **, italics with *, underlining with <u>...</u>, bullet lists, tables, and blockquotes). For mathematical formulas or calculations, always use LaTeX notation ($...$ for inline and $$...$$ for block equations). For code or JSON, always use fenced code blocks with language identifiers (e.g. ```python, ```javascript, ```json).' 
                  },
                  ...messages
                ],
                temperature: 0.7,
                max_tokens: 1500
              })
            });

            if (!res.ok) {
              const errText = await res.text();
              lastError = new Error(`API Error (${res.status}): ${errText}`);
              continue; // try next model if 404 or decommissioned
            }

            const data = await res.json();
            reply = data?.choices?.[0]?.message?.content;
            if (reply) break;
          } catch (modelErr) {
            lastError = modelErr;
          }
        }

        if (!reply) {
          throw lastError || new Error('No response from AI model service.');
        }

        messages.push({ role: 'assistant', content: reply });
        renderBubbleContent(botBubble, reply);
      } catch (err) {
        botBubble.innerHTML = `<span style="color:#ef4444;"><i class="fa-solid fa-triangle-exclamation"></i> Error: ${err.message}</span>`;
      } finally {
        sendBtn.disabled = false;
        const container = document.getElementById('chatHistory');
        container.scrollTop = container.scrollHeight;
      }
    }

    document.getElementById('aiInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        sendMessage();
      }
    });

    // Check if initial query passed in URL (?q=...)
    const initialQ = new URLSearchParams(window.location.search).get('q');
    if (initialQ) {
      document.getElementById('aiInput').value = initialQ;
      setTimeout(sendMessage, 200);
    }
  </script>
</body>
</html>
