<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>12AM — AI Assistant</title>
  <meta name="description" content="Instant homework help, coding assistance, and intelligent answers on 12AM.">

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- 12AM Core Theme & Navigation -->
  <link rel="stylesheet" href="navigation.css">
  <script src="theme.js"></script>
  <script src="device-auth.js"></script>
  <script src="navigation.js" defer></script>

  <style>
    html, body {
      height: 100%;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    body {
      padding-top: var(--navbar-height);
      display: flex;
      flex-direction: column;
      background: var(--bg-page);
    }

    .ai-page-layout {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      padding: 1rem 1.25rem;
      box-sizing: border-box;
      height: calc(100vh - var(--navbar-height));
      overflow: hidden;
    }

    /* Subheader controls */
    .ai-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border-main);
      flex-shrink: 0;
    }

    .ai-model-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 16px;
      background: var(--btn-bg);
      border: 1px solid var(--accent-glow);
      color: var(--accent-color);
      font-size: 0.75rem;
      font-weight: 500;
    }

    .ai-model-pill .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }

    .ai-actions-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ai-btn-small {
      height: 36px;
      padding: 0 14px;
      border-radius: 16px;
      background: var(--bg-card);
      border: 1px solid var(--border-main);
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .ai-btn-small:hover {
      border-color: var(--accent-color);
      color: var(--text-main);
    }

    /* Messages History */
    .ai-chat-history {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem 0;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      scroll-behavior: smooth;
    }

    .welcome-card {
      text-align: center;
      padding: 2.5rem 1rem;
      margin: auto 0;
    }

    .welcome-avatar {
      width: 64px;
      height: 64px;
      border-radius: 24px;
      background: var(--bg-card);
      border: 1px solid var(--border-main);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.2rem;
      color: var(--accent-color);
      font-size: 26px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    .welcome-title {
      font-size: 1.6rem;
      font-weight: 500;
      letter-spacing: -0.02em;
      margin: 0 0 0.5rem;
      color: var(--text-main);
    }

    .welcome-desc {
      color: var(--text-muted);
      font-size: 0.95rem;
      max-width: 460px;
      margin: 0 auto 1.5rem;
      line-height: 1.5;
    }

    .prompt-suggestions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      max-width: 600px;
      margin: 0 auto;
    }

    .prompt-chip {
      background: var(--bg-card);
      border: 1px solid var(--border-main);
      color: var(--text-muted);
      padding: 8px 18px;
      border-radius: 18px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .prompt-chip:hover {
      border-color: var(--accent-color);
      color: var(--accent-color);
      background: var(--btn-bg);
      transform: translateY(-1px);
    }

    /* Message Bubbles */
    .message-row {
      display: flex;
      gap: 12px;
      width: 100%;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .message-avatar {
      width: 38px;
      height: 38px;
      border-radius: 16px;
      background: var(--bg-card);
      border: 1px solid var(--border-main);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: var(--accent-color);
      flex-shrink: 0;
    }

    .message-bubble {
      max-width: 82%;
      padding: 1rem 1.4rem;
      border-radius: 22px;
      font-size: 0.92rem;
      font-weight: 400;
      line-height: 1.6;
    }

    .message-row.user .message-bubble {
      background: var(--btn-bg);
      border: 1px solid var(--accent-color);
      color: var(--text-main);
      border-bottom-right-radius: 8px;
    }

    .message-row.bot .message-bubble {
      background: var(--bg-card);
      border: 1px solid var(--border-main);
      color: var(--text-main);
      border-bottom-left-radius: 8px;
    }

    .message-bubble pre {
      background: #000000;
      border: 1px solid var(--border-main);
      border-radius: 16px;
      padding: 12px 16px;
      overflow-x: auto;
      margin: 10px 0;
    }

    .message-bubble code {
      font-family: monospace;
      font-size: 0.85rem;
    }

    /* Input Bar */
    .ai-input-container {
      padding-top: 0.75rem;
      flex-shrink: 0;
    }

    .ai-input-box {
      display: flex;
      align-items: center;
      background: var(--bg-card);
      border: 1px solid var(--border-main);
      border-radius: 24px;
      padding: 6px 8px 6px 18px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
      transition: all 0.2s ease;
    }

    .ai-input-box:focus-within {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .ai-input-box input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 0.95rem;
      font-family: inherit;
      font-weight: 400;
    }

    .ai-send-btn {
      width: 42px;
      height: 42px;
      border-radius: 18px;
      background: var(--accent-color);
      border: none;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .ai-send-btn:hover {
      box-shadow: 0 0 12px var(--accent-glow);
      transform: scale(1.04);
    }

    .ai-send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    img {
      max-width: 100%;
      height: auto;
    }
  </style>
</head>
<body class="grid-bg">
  <div id="dynamic-background"></div>

  <div class="ai-page-layout">
    <!-- Subheader toolbar -->
    <div class="ai-toolbar">
      <div class="ai-model-pill">
        <span class="dot"></span>
        <span id="modelLabel">Llama 3.3 70B Versatile</span>
      </div>
      <div class="ai-actions-row">
        <button class="ai-btn-small" onclick="clearChat()" title="Clear Chat History">
          <i class="fa-solid fa-trash-can"></i>
          <span>Clear</span>
        </button>
        <button class="ai-btn-small" onclick="setCustomApiKey()" title="Custom Groq API Key">
          <i class="fa-solid fa-key"></i>
          <span>Key</span>
        </button>
      </div>
    </div>

    <!-- Messages -->
    <div class="ai-chat-history" id="chatHistory">
      <div class="welcome-card" id="welcomeCard">
        <div class="welcome-avatar">
          <i class="fa-solid fa-robot"></i>
        </div>
        <h2 class="welcome-title">12AM AI</h2>
        <p class="welcome-desc">Fast responses, code generation, study guides, and unblocked AI research.</p>
        <div class="prompt-suggestions">
          <button class="prompt-chip" onclick="usePrompt('Explain quantum computing simply')">Quantum computing</button>
          <button class="prompt-chip" onclick="usePrompt('Write a clean JavaScript Snake game in HTML5 canvas')">Code a Snake game</button>
          <button class="prompt-chip" onclick="usePrompt('Help me study for a math test on quadratic formulas')">Quadratic math test</button>
          <button class="prompt-chip" onclick="usePrompt('Give me a creative strategy for Retro Bowl')">Retro Bowl strategy</button>
        </div>
      </div>
    </div>

    <!-- Input bar -->
    <div class="ai-input-container">
      <div class="ai-input-box">
        <input type="text" id="aiInput" placeholder="Ask 12AM AI anything..." autocomplete="off">
        <button class="ai-send-btn" id="sendBtn" onclick="sendMessage()" title="Send">
          <i class="fa-solid fa-arrow-up"></i>
        </button>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_GROQ_KEY = String.fromCharCode(103,115,107,95,83,77,109,69,107,118,105,72,104,74,82,67,75,118,80,98,79,87,107,69,87,71,100,121,98,51,70,89,55,79,49,114,120,103,52,90,68,48,68,122,101,71,107,99,122,103,88,57,86,112,48,109);
    let messages = [];

    function getApiKey() {
      return localStorage.getItem('12am_groq_key') || DEFAULT_GROQ_KEY;
    }

    function setCustomApiKey() {
      const current = localStorage.getItem('12am_groq_key') || '';
      const key = prompt('Enter your custom Groq API key (leave empty to use default):', current);
      if (key !== null) {
        if (key.trim()) {
          localStorage.setItem('12am_groq_key', key.trim());
          alert('Custom API key saved.');
        } else {
          localStorage.removeItem('12am_groq_key');
          alert('Reverted to default key.');
        }
      }
    }

    function usePrompt(text) {
      document.getElementById('aiInput').value = text;
      sendMessage();
    }

    function clearChat() {
      messages = [];
      const container = document.getElementById('chatHistory');
      container.innerHTML = `
        <div class="welcome-card" id="welcomeCard">
          <div class="welcome-avatar">
            <i class="fa-solid fa-robot"></i>
          </div>
          <h2 class="welcome-title">12AM AI</h2>
          <p class="welcome-desc">Fast responses, code generation, study guides, and unblocked AI research.</p>
          <div class="prompt-suggestions">
            <button class="prompt-chip" onclick="usePrompt('Explain quantum computing simply')">Quantum computing</button>
            <button class="prompt-chip" onclick="usePrompt('Write a clean JavaScript Snake game in HTML5 canvas')">Code a Snake game</button>
            <button class="prompt-chip" onclick="usePrompt('Help me study for a math test on quadratic formulas')">Quadratic math test</button>
            <button class="prompt-chip" onclick="usePrompt('Give me a creative strategy for Retro Bowl')">Retro Bowl strategy</button>
          </div>
        </div>
      `;
    }

    function appendMessage(role, content) {
      const welcome = document.getElementById('welcomeCard');
      if (welcome) welcome.remove();

      const container = document.getElementById('chatHistory');
      const row = document.createElement('div');
      row.className = `message-row ${role === 'user' ? 'user' : 'bot'}`;

      const avatar = document.createElement('div');
      avatar.className = 'message-avatar';
      avatar.innerHTML = role === 'user' ? '<i class="fa-solid fa-user"></i>' : '<i class="fa-solid fa-robot"></i>';

      const bubble = document.createElement('div');
      bubble.className = 'message-bubble';
      
      if (role === 'assistant' && typeof marked !== 'undefined') {
        bubble.innerHTML = marked.parse(content);
      } else {
        bubble.textContent = content;
      }

      if (role === 'user') {
        row.appendChild(bubble);
        row.appendChild(avatar);
      } else {
        row.appendChild(avatar);
        row.appendChild(bubble);
      }

      container.appendChild(row);
      container.scrollTop = container.scrollHeight;
      return bubble;
    }

    async function sendMessage() {
      const input = document.getElementById('aiInput');
      const text = input.value.trim();
      if (!text) return;

      input.value = '';
      appendMessage('user', text);
      messages.push({ role: 'user', content: text });

      const sendBtn = document.getElementById('sendBtn');
      sendBtn.disabled = true;

      const botBubble = appendMessage('assistant', 'Thinking...');

      try {
        const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${getApiKey()}`
          },
          body: JSON.stringify({
            model: 'llama-3.3-70b-versatile',
            messages: [
              { role: 'system', content: 'You are 12AM AI, an intelligent, concise, helpful academic and coding assistant on the 12AM gaming website.' },
              ...messages
            ],
            temperature: 0.7,
            max_tokens: 1500
          })
        });

        if (!res.ok) {
          throw new Error(`API Error (${res.status}): ${await res.text()}`);
        }

        const data = await res.json();
        const reply = data.choices[0].message.content;
        messages.push({ role: 'assistant', content: reply });

        if (typeof marked !== 'undefined') {
          botBubble.innerHTML = marked.parse(reply);
        } else {
          botBubble.textContent = reply;
        }
      } catch (err) {
        botBubble.innerHTML = `<span style="color:#ef4444;"><i class="fa-solid fa-triangle-exclamation"></i> Error: ${err.message}</span>`;
      } finally {
        sendBtn.disabled = false;
        const container = document.getElementById('chatHistory');
        container.scrollTop = container.scrollHeight;
      }
    }

    document.getElementById('aiInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        sendMessage();
      }
    });

    // Check if initial query passed in URL (?q=...)
    const initialQ = new URLSearchParams(window.location.search).get('q');
    if (initialQ) {
      document.getElementById('aiInput').value = initialQ;
      setTimeout(sendMessage, 200);
    }
  </script>
</body>
</html>
