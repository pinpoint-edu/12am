<!DOCTYPE html>
<html lang="en" class="dark custom-scroll">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12AM — Home</title>
    <meta name="description" content="12AM — Enter a new era of digital productivity with an integrated workspace for research, focus audio, encrypted notes, and personalized organization.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@200;300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Supabase & 12AM Device Auth Core -->
    <script type="module" src="supabase-config.js"></script>
    <script src="device-auth.js"></script>

    <!-- 12AM Core Theme & Navigation -->
    <link rel="stylesheet" href="navigation.css">
    <script src="theme.js"></script>
    <script src="navigation.js" defer></script>

    <style>
        :root {
            --bg-page: var(--bg-primary, #040404);
            --bg-card: var(--bg-secondary, #0c0c0e);
            --text-main: var(--text-primary, #ffffff);
            --text-muted: var(--text-secondary, #a1a1aa);
            --accent-color: var(--accent-primary, #ff8800);
            --accent-glow: var(--accent-secondary, rgba(255, 136, 0, 0.4));
            --border-main: var(--border-primary, #1c1c20);
            --border-faint: var(--border-secondary, rgba(255, 255, 255, 0.05));
            --btn-bg: var(--button-bg, rgba(255, 136, 0, 0.12));
            --btn-text: var(--button-text, #ff8800);
        }

        * {
            box-sizing: border-box;
            font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif !important;
            font-weight: 400;
        }

        body { 
            font-family: 'Geist', sans-serif !important; 
            color: var(--text-main);
            background-color: var(--bg-page);
            font-weight: 300 !important;
            overflow-x: hidden;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Subtle dot grid full bleed */
        .grid-bg {
            background-image: radial-gradient(var(--border-faint, rgba(255, 255, 255, 0.07)) 1px, transparent 0);
            background-size: 24px 24px;
        }

        #dynamic-background {
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(circle 360px at 92% 10%, var(--accent-color) 0%, var(--accent-glow) 45%, transparent 75%),
                radial-gradient(circle 700px at 90% 14%, var(--accent-glow) 0%, transparent 65%);
            pointer-events: none;
            z-index: 0;
            opacity: 0.9;
        }

        /* Thinner Gradient Text Animation */
        .gradient-text {
            background-image: linear-gradient(90deg, var(--accent-color), var(--tab-active-text, var(--text-muted)), var(--text-muted), var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            background-size: 300% auto;
            animation: shine 8s linear infinite;
            font-weight: 400 !important;
            letter-spacing: -0.02em;
        }

        @keyframes shine {
            to { background-position: 300% center; }
        }

        /* Hero Button (Squircle) */
        .btn-primary-override {
            background-color: var(--btn-bg) !important;
            border: 1px solid var(--accent-color) !important;
            color: var(--accent-color) !important;
            outline: 1px solid var(--accent-glow);
            border-radius: 18px !important;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            font-weight: 500 !important;
            text-decoration: none;
        }

        .btn-primary-override:hover {
            background-color: var(--accent-color) !important;
            color: #ffffff !important;
            transform: translateY(-2px);
            box-shadow: 0 12px 30px -8px var(--accent-glow);
        }

        /* Squircle Action Buttons */
        .hero-btn-base {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.65rem 1.4rem;
            font-size: 0.85rem;
            font-weight: 400 !important;
            color: var(--text-muted);
            border-radius: 14px !important; 
            text-decoration: none;
            background: var(--bg-card);
            border: 1px solid var(--border-main);
            transition: all 0.2s ease;
        }

        .hero-btn-base:hover {
            border-color: var(--accent-color);
            color: var(--text-main);
            transform: translateY(-1px);
        }

        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: var(--border-main); border-radius: 10px; }
    </style>
</head>

<body class="grid-bg">
    <div id="dynamic-background"></div>

    <!-- Main Content Aligned to the Right -->
    <main id="page-content" class="flex-1 min-w-0 flex flex-col justify-center items-end relative z-10 py-16 px-6 sm:px-12 md:px-16 lg:pr-24 xl:pr-32">
        <section class="text-right max-w-2xl sm:max-w-3xl ml-auto flex flex-col items-end">
            <h1 class="text-xs md:text-sm font-normal uppercase tracking-widest mb-6 opacity-85 text-right" style="color: var(--accent-color);">
                Welcome to a New Era of Digital Flow
            </h1>

            <h2 class="text-4xl sm:text-6xl md:text-7xl font-light tracking-tight mb-8 leading-tight text-right">
                <span class="gradient-text">A New Era of Focus, Built Around You.</span>
            </h2>

            <p class="text-base md:text-xl text-[var(--text-muted)] max-w-2xl ml-auto mb-10 font-light leading-relaxed text-right">
                Step into <strong>12AM</strong> — a modern, unified workspace crafted for deep concentration, ambient study audio, encrypted notes, and instant reference tools.
            </p>
            
            <div id="auth-button-container" class="mb-10 flex justify-end">
                <a id="auth-button" href="authentication.html" class="btn-primary-override inline-flex items-center justify-center px-8 py-4 text-base md:text-lg tracking-wide shadow-xl">
                    Get Started <i class="fas fa-arrow-right ml-3"></i>
                </a>
            </div>

            <div class="flex flex-wrap items-center justify-end gap-3">
                <a href="dashboard.html" class="hero-btn-base">
                    <i class="fa-solid fa-gauge mr-2" style="color: var(--accent-color);"></i> Dashboard
                </a>
                <a href="music.html" class="hero-btn-base">
                    <i class="fa-solid fa-headphones mr-2" style="color: var(--accent-color);"></i> Audio
                </a>
                <a href="notes.html" class="hero-btn-base">
                    <i class="fa-solid fa-note-sticky mr-2" style="color: var(--accent-color);"></i> Notes
                </a>
                <a href="dictionary.html" class="hero-btn-base">
                    <i class="fa-solid fa-book-bookmark mr-2" style="color: var(--accent-color);"></i> Reference
                </a>
            </div>
        </section>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const authBtn = document.getElementById('auth-button');
            const acc = (typeof TwelveAMAuth !== 'undefined' && TwelveAMAuth.getCurrentUser) ? TwelveAMAuth.getCurrentUser() : null;
            if (acc && authBtn) {
                authBtn.href = "dashboard.html";
                authBtn.innerHTML = `Go to Dashboard <i class="fas fa-arrow-right ml-3"></i>`;
            }
        });
    </script>
</body>
</html>
