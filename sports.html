<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12AM — Sports</title>
    <meta name="description" content="Stream live sports across soccer, basketball, hockey, combat, baseball, football, racing, tennis, and cricket on 12AM.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <script src="https://cdn.tailwindcss.com"></script>

    <script type="module" src="supabase-config.js"></script>
    <script src="device-auth.js"></script>

    <link rel="stylesheet" href="navigation.css">
    <script src="theme.js"></script>
    <script src="navigation.js" defer></script>

    <style>
        :root {
            --bg-page: var(--bg-primary, #040404);
            --bg-card: var(--bg-secondary, #0c0c0e);
            --text-main: var(--text-primary, #ffffff);
            --text-muted: var(--text-secondary, #a1a1aa);
            --accent-color: var(--accent-primary, #8b5cf6);
            --accent-glow: var(--accent-secondary, rgba(139, 92, 246, 0.4));
            --border-main: var(--border-primary, #1c1c20);
            --border-faint: var(--border-secondary, rgba(255, 255, 255, 0.06));
            --btn-bg: var(--button-bg, rgba(139, 92, 246, 0.12));
            --navbar-bg: var(--bg-secondary, #09090b);
            --navbar-border: var(--border-primary, #27272a);
        }

        html, body, input, button, select, textarea {
            font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif !important;
        }

        .material-symbols-sharp {
            font-family: 'Material Symbols Sharp' !important;
            font-weight: normal;
            font-style: normal;
            font-size: 20px;
            line-height: 1;
            display: inline-block;
            white-space: nowrap;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            padding-top: 5.5rem;
            -webkit-font-smoothing: antialiased;
        }

        .cinema-wrapper {
            max-width: 1440px;
            width: 100%;
            margin: 0 auto;
            padding: 1.5rem 1.5rem 5rem;
            box-sizing: border-box;
        }

        .cinema-topbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 1.25rem;
            margin-bottom: 2rem;
            position: relative;
            z-index: 20;
        }

        .cinema-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .cinema-brand-icon {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: var(--btn-bg);
            border: 1px solid var(--border-main);
            color: var(--accent-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .cinema-brand-title {
            font-size: 1.6rem;
            font-weight: 500;
            letter-spacing: -0.02em;
            color: var(--text-main);
            margin: 0;
        }

        .cinema-search-container {
            flex: 1;
            max-width: 520px;
            min-width: 240px;
            position: relative;
        }

        .cinema-search-box {
            display: flex;
            align-items: center;
            background: var(--bg-card);
            border: 1px solid var(--border-main);
            border-radius: 18px;
            padding: 6px 14px;
            transition: all 0.25s ease;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
        }

        .cinema-search-box:focus-within {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .cinema-search-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-size: 0.92rem;
            padding: 6px 10px;
        }

        .cinema-search-input::placeholder {
            color: var(--text-muted);
            opacity: 0.7;
        }

        .cinema-tabs {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            margin-bottom: 1.5rem;
            scrollbar-width: none;
        }
        .cinema-tabs::-webkit-scrollbar { display: none; }

        .cinema-tab {
            padding: 8px 16px;
            border-radius: 14px;
            background: var(--bg-card);
            border: 1px solid var(--border-main);
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            text-transform: capitalize;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .cinema-tab:hover {
            color: var(--text-main);
            border-color: var(--accent-color);
        }

        .cinema-tab.active {
            background: var(--accent-color);
            color: #ffffff;
            border-color: var(--accent-color);
            box-shadow: 0 0 18px var(--accent-glow);
        }

        /* Spotlight Banner */
        .spotlight-banner {
            position: relative;
            width: 100%;
            height: 360px;
            border-radius: 26px;
            overflow: hidden;
            margin-bottom: 2.25rem;
            border: 1px solid var(--border-main);
            background: var(--bg-card);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
            display: flex;
            align-items: flex-end;
            transition: opacity 0.35s ease, transform 0.35s ease, max-height 0.4s ease, margin-bottom 0.4s ease;
            max-height: 400px;
        }

        .spotlight-banner.is-hidden-search {
            opacity: 0;
            transform: translateY(-28px);
            max-height: 0;
            margin-bottom: 0;
            border-width: 0;
            pointer-events: none;
        }

        .spotlight-bg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.68);
        }

        .spotlight-gradient {
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, rgba(6, 6, 10, 0.92) 0%, rgba(6, 6, 10, 0.62) 55%, rgba(6, 6, 10, 0.25) 100%),
                        linear-gradient(180deg, transparent 35%, rgba(6, 6, 10, 0.95) 100%);
        }

        .spotlight-content {
            position: relative;
            z-index: 2;
            padding: 2.25rem;
            max-width: 680px;
        }

        .spotlight-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 999px;
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.5);
            color: #fca5a5;
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 0.75rem;
        }

        .spotlight-badge.is-upcoming {
            background: var(--btn-bg);
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .spotlight-title {
            font-size: 2.15rem;
            font-weight: 600;
            line-height: 1.15;
            margin: 0 0 0.65rem;
            color: #ffffff;
            letter-spacing: -0.02em;
        }

        .spotlight-meta {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 0.85rem;
            color: #d4d4d8;
            margin-bottom: 1.25rem;
            font-weight: 500;
        }

        .spotlight-btn-play {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 22px;
            border-radius: 16px;
            background: var(--accent-color);
            color: #ffffff;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            box-shadow: 0 10px 25px var(--accent-glow);
        }

        .spotlight-btn-play:hover {
            transform: translateY(-2px);
            filter: brightness(1.08);
        }

        /* Sports Grid (16:9 event cards) */
        .sports-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(275px, 1fr));
            gap: 1.25rem;
            width: 100%;
        }

        .sport-card {
            background: var(--bg-card);
            border: 1px solid var(--border-main);
            border-radius: 20px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.2s ease, box-shadow 0.25s ease;
            display: flex;
            flex-direction: column;
        }

        .sport-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-color);
            box-shadow: 0 14px 32px rgba(0, 0, 0, 0.32), 0 0 18px var(--accent-glow);
        }

        .sport-thumb-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #0d0d12;
            overflow: hidden;
        }

        .sport-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.35s ease;
        }

        .sport-card:hover .sport-thumb {
            transform: scale(1.04);
        }

        .sport-live-pill {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 3px 9px;
            border-radius: 999px;
            font-size: 10.5px;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            backdrop-filter: blur(8px);
        }

        .sport-live-pill.is-live {
            background: rgba(220, 38, 38, 0.88);
            color: #ffffff;
        }

        .sport-live-pill.is-upcoming {
            background: rgba(15, 23, 42, 0.78);
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.16);
        }

        .sport-quality-pill {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 3px 8px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.68);
            color: #ffffff;
            font-size: 10.5px;
            font-weight: 700;
            backdrop-filter: blur(8px);
        }

        .sport-card-body {
            padding: 14px 16px 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .sport-card-league {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--accent-color);
        }

        .sport-card-title {
            font-size: 0.96rem;
            font-weight: 600;
            color: var(--text-main);
            margin: 0;
            line-height: 1.3;
        }

        .sport-card-meta {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 2px;
        }

        /* Fullscreen Player Modal */
        #playerModal {
            position: fixed;
            inset: 0;
            z-index: 10000;
            background: #000000;
            display: none;
            flex-direction: column;
        }

        .player-bar {
            height: 56px;
            background: var(--navbar-bg, var(--bg-secondary, #09090b)) !important;
            border-bottom: 1px solid var(--navbar-border, var(--border-primary, #27272a)) !important;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            flex-shrink: 0;
            color: var(--text-main, #ffffff);
        }

        .player-left, .player-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .player-btn-squircle {
            width: 36px;
            height: 36px;
            border-radius: 11px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-card, #18181b);
            border: 1px solid var(--border-primary, #27272a);
            color: var(--text-main, #fafafa);
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .player-btn-squircle:hover {
            background: var(--button-bg, rgba(255, 255, 255, 0.1));
            border-color: var(--accent-primary, #8b5cf6);
            color: var(--accent-primary, #ffffff);
        }

        .player-btn-squircle.btn-close:hover {
            background: rgba(239, 68, 68, 0.2);
            border-color: #ef4444;
            color: #ef4444;
        }

        .player-title {
            font-size: 13.5px;
            font-weight: 500;
            color: var(--text-main, #f4f4f5);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 360px;
            padding: 5px 14px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-primary, rgba(255, 255, 255, 0.1));
            border-radius: 11px;
        }

        .select-dark {
            height: 36px;
            background: var(--bg-card, #18181b);
            border: 1px solid var(--border-primary, #27272a);
            color: var(--text-main, #ffffff);
            font-size: 13px;
            font-weight: 500;
            padding: 0 10px;
            border-radius: 11px;
            outline: none;
            cursor: pointer;
        }

        #streamFrame {
            flex: 1;
            width: 100%;
            height: 100%;
            border: none;
            background: #000000;
        }

        .live-dot {
            width: 7px;
            height: 7px;
            border-radius: 9999px;
            background: #ef4444;
            box-shadow: 0 0 8px #ef4444;
            display: inline-block;
        }

        @media (max-width: 640px) {
            .spotlight-banner { height: 300px; }
            .spotlight-content { padding: 1.5rem; }
            .spotlight-title { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div id="dynamic-background"></div>

    <main class="cinema-wrapper">
        <header class="cinema-topbar">
            <div class="cinema-brand">
                <div class="cinema-brand-icon">
                    <i class="fa-solid fa-trophy"></i>
                </div>
                <h1 class="cinema-brand-title">Sports</h1>
            </div>

            <div class="cinema-search-container" style="display:flex; align-items:center; gap:10px; max-width:680px;">
                <div class="cinema-search-box" style="flex:1;">
                    <i class="fa-solid fa-magnifying-glass" style="color: var(--text-muted); font-size: 0.9rem;"></i>
                    <input type="text" id="sportsSearchInput" class="cinema-search-input" placeholder="Search live matches, teams, leagues, or past games..." autocomplete="off">
                    <button id="refreshStreamsBtn" type="button" title="Refresh" style="background:transparent; border:none; color:var(--text-muted); cursor:pointer; padding:4px 6px;">
                        <i class="fa-solid fa-rotate-right"></i>
                    </button>
                </div>
                <div style="display:flex; gap:6px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); padding:4px; border-radius:16px;">
                    <button id="modeLiveBtn" type="button" class="cinema-tab active" style="padding:7px 14px; border-radius:12px; font-size:0.84rem;">Live</button>
                    <button id="modeArchiveBtn" type="button" class="cinema-tab" style="padding:7px 14px; border-radius:12px; font-size:0.84rem;">Past Games</button>
                </div>
            </div>
        </header>

        <nav id="categoryTabs" class="cinema-tabs">
            <button class="cinema-tab active" data-category="all">All Sports</button>
        </nav>

        <section id="spotlightBanner" class="spotlight-banner hidden">
            <img id="spotlightBg" class="spotlight-bg" src="" alt="">
            <div class="spotlight-gradient"></div>
            <div class="spotlight-content">
                <div id="spotlightBadge" class="spotlight-badge">
                    <span class="live-dot"></span>
                    <span id="spotlightBadgeText">Live Now</span>
                </div>
                <h2 id="spotlightTitle" class="spotlight-title">Featured Match</h2>
                <div class="spotlight-meta">
                    <span id="spotlightLeague">League</span>
                    <span id="spotlightTime">Starting soon</span>
                </div>
                <button id="spotlightPlayBtn" class="spotlight-btn-play" type="button">
                    <i class="fa-solid fa-play"></i>
                    <span>Watch Stream</span>
                </button>
            </div>
        </section>

        <div id="sectionHeader" style="display:flex; align-items:center; justify-content:space-between; margin-bottom:1rem;">
            <h2 id="gridHeading" style="font-size:1.15rem; font-weight:600; margin:0; color:var(--text-main);">Live &amp; Upcoming</h2>
            <span id="streamCountLabel" style="font-size:0.82rem; color:var(--text-muted);">Loading streams...</span>
        </div>

        <section id="sportsGrid" class="sports-grid"></section>
        <div id="loadMoreWrap" class="hidden" style="text-align:center; padding:1.75rem 0;">
            <button id="loadMoreBtn" type="button" class="spotlight-btn-play" style="margin:0 auto;">
                <i class="fa-solid fa-plus"></i>
                <span>Load More Past Games</span>
            </button>
        </div>
        <div id="emptyState" class="hidden" style="text-align:center; padding:4rem 1rem; color:var(--text-muted);">
            <i class="fa-solid fa-tv" style="font-size:2.2rem; margin-bottom:0.75rem; opacity:0.5;"></i>
            <p style="font-size:0.95rem; margin:0;">No matching streams or replays found.</p>
        </div>
    </main>

    <!-- Fullscreen Stream Player Modal -->
    <div id="playerModal">
        <div class="player-bar">
            <div class="player-left">
                <button id="closePlayerBtn" class="player-btn-squircle btn-close" title="Close stream">
                    <span class="material-symbols-sharp">close</span>
                </button>
                <span id="playerTitle" class="player-title">Match Stream</span>
            </div>
            <div class="player-right">
                <select id="sourceSelect" class="select-dark" title="Select stream source / quality"></select>
                <a id="openExternalBtn" class="player-btn-squircle hidden" href="#" target="_blank" rel="noopener" title="Open replay link in new tab" style="text-decoration:none;">
                    <span class="material-symbols-sharp">open_in_new</span>
                </a>
                <button id="shieldToggleBtn" class="player-btn-squircle" title="Smart AdShield: ON (Zero-Alarm)" style="color: var(--accent-color); border-color: var(--accent-color);">
                    <span class="material-symbols-sharp">shield</span>
                </button>
                <button id="reloadStreamBtn" class="player-btn-squircle" title="Reload stream">
                    <span class="material-symbols-sharp">refresh</span>
                </button>
            </div>
        </div>
        <iframe id="streamFrame" referrerpolicy="no-referrer" allow="fullscreen; picture-in-picture" allowfullscreen frameborder="0"></iframe>
        <div id="archiveLinksPanel" class="hidden" style="flex:1; overflow-y:auto; padding:2rem; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1rem; background:#0d0d0f; color:var(--text-main);">
            <p style="color:var(--text-muted); font-size:0.95rem; margin:0; text-align:center;">This archived game provides external replay/download links:</p>
            <div id="archiveLinksList" style="display:flex; flex-wrap:wrap; gap:0.75rem; justify-content:center; max-width:680px;"></div>
        </div>
    </div>

    <script>
        (function() {
            const DAMITV_CACHE_KEY = '12am_sports_damitv_cache_v1';
            const DAMITV_TTL_MS = 60 * 1000;
            const ARCHIVE_DIRECT = 'https://bn32423.us.ci/api';
            const SHIELD_MODE_KEY = '12am_sports_shield_mode';
            const SANDBOX_VALUE = 'allow-scripts allow-same-origin allow-forms allow-presentation';
            const SHIELD_MODES = ['smart', 'proxy', 'sandbox', 'off'];

            let viewMode = 'live'; // 'live' (DAMITV) | 'archive' (Sport-Video-Archive)
            let liveStreams = [];
            let liveCategories = [];
            let activeCategory = 'all';

            let archiveSources = [];
            let archiveVideos = [];
            let archiveTotal = 0;
            let archiveOffset = 0;
            let activeArchiveSource = 'all';
            let archiveLoading = false;
            let searchQuery = '';
            let searchTimer = null;

            const categoryTabsEl = document.getElementById('categoryTabs');
            const sportsGridEl = document.getElementById('sportsGrid');
            const emptyStateEl = document.getElementById('emptyState');
            const streamCountLabelEl = document.getElementById('streamCountLabel');
            const gridHeadingEl = document.getElementById('gridHeading');
            const searchInputEl = document.getElementById('sportsSearchInput');
            const refreshBtnEl = document.getElementById('refreshStreamsBtn');
            const modeLiveBtn = document.getElementById('modeLiveBtn');
            const modeArchiveBtn = document.getElementById('modeArchiveBtn');
            const loadMoreWrap = document.getElementById('loadMoreWrap');
            const loadMoreBtn = document.getElementById('loadMoreBtn');

            const spotlightBanner = document.getElementById('spotlightBanner');
            const spotlightBg = document.getElementById('spotlightBg');
            const spotlightBadge = document.getElementById('spotlightBadge');
            const spotlightBadgeText = document.getElementById('spotlightBadgeText');
            const spotlightTitle = document.getElementById('spotlightTitle');
            const spotlightLeague = document.getElementById('spotlightLeague');
            const spotlightTime = document.getElementById('spotlightTime');
            const spotlightPlayBtn = document.getElementById('spotlightPlayBtn');

            const playerModal = document.getElementById('playerModal');
            const streamFrame = document.getElementById('streamFrame');
            const playerTitle = document.getElementById('playerTitle');
            const sourceSelect = document.getElementById('sourceSelect');
            const openExternalBtn = document.getElementById('openExternalBtn');
            const archiveLinksPanel = document.getElementById('archiveLinksPanel');
            const archiveLinksList = document.getElementById('archiveLinksList');
            const closePlayerBtn = document.getElementById('closePlayerBtn');
            const reloadStreamBtn = document.getElementById('reloadStreamBtn');
            const shieldToggleBtn = document.getElementById('shieldToggleBtn');

            let shieldMode = localStorage.getItem(SHIELD_MODE_KEY) || 'smart';
            if (!SHIELD_MODES.includes(shieldMode)) shieldMode = 'smart';

            function updateShieldUi() {
                if (!shieldToggleBtn) return;
                const iconEl = shieldToggleBtn.querySelector('.material-symbols-sharp');
                const meta = {
                    smart: { icon: 'shield', color: 'var(--accent-color)', title: 'AdShield: Smart (Zero-Alarm + In-Frame Blocker)' },
                    proxy: { icon: 'verified_user', color: '#22c55e', title: 'AdShield: Deep Proxy AdBlock' },
                    sandbox: { icon: 'gpp_maybe', color: '#eab308', title: 'AdShield: Strict Sandbox' },
                    off: { icon: 'gpp_off', color: '', title: 'AdShield: OFF' }
                }[shieldMode];
                if (iconEl) iconEl.textContent = meta.icon;
                shieldToggleBtn.style.color = meta.color;
                shieldToggleBtn.style.borderColor = meta.color;
                shieldToggleBtn.title = meta.title;
            }

            function loadStreamUrl(rawUrl, forceFallback = false) {
                if (!rawUrl) return;
                if (forceFallback) {
                    streamFrame.setAttribute('sandbox', SANDBOX_VALUE);
                    streamFrame.src = rawUrl;
                    return;
                }
                if (shieldMode === 'sandbox') {
                    streamFrame.setAttribute('sandbox', SANDBOX_VALUE);
                    streamFrame.src = rawUrl;
                } else if (shieldMode === 'proxy' || shieldMode === 'smart') {
                    streamFrame.removeAttribute('sandbox');
                    streamFrame.src = `/api/sports?action=embed&url=${encodeURIComponent(rawUrl)}`;
                } else {
                    streamFrame.removeAttribute('sandbox');
                    streamFrame.src = rawUrl;
                }
            }

            updateShieldUi();
            if (shieldToggleBtn) {
                shieldToggleBtn.onclick = () => {
                    const idx = SHIELD_MODES.indexOf(shieldMode);
                    shieldMode = SHIELD_MODES[(idx + 1) % SHIELD_MODES.length];
                    localStorage.setItem(SHIELD_MODE_KEY, shieldMode);
                    updateShieldUi();
                    if (sourceSelect.value) loadStreamUrl(sourceSelect.value);
                };
            }

            window.addEventListener('message', (e) => {
                if (e.data && e.data.type === '12am-embed-fallback' && e.data.url && playerModal.style.display === 'flex') {
                    loadStreamUrl(e.data.url, true);
                }
            });

            window.addEventListener('beforeunload', (e) => {
                if (playerModal.style.display === 'flex' && shieldMode !== 'off') {
                    e.preventDefault();
                    e.returnValue = '';
                }
            });

            function esc(str) {
                return String(str || '')
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;');
            }

            function formatMatchTime(ts) {
                if (!ts) return 'Scheduled';
                const d = new Date(Number(ts) * 1000);
                if (isNaN(d.getTime())) return 'Scheduled';
                return d.toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
            }

            function isDamitvLive(s) {
                return s.status === 'live' || Number(s.always_live) === 1;
            }

            function getDamitvSources(s) {
                const out = [];
                if (Array.isArray(s.sources)) {
                    s.sources.forEach((src, i) => {
                        if (!src || !src.embed) return;
                        const qLabel = src.hd ? 'HD' : (src.sd ? 'SD' : 'Auto');
                        out.push({
                            label: `${src.name || `Source ${i + 1}`} • ${qLabel}`,
                            url: src.embed
                        });
                    });
                }
                if (s.embed && !out.some(o => o.url === s.embed)) {
                    out.unshift({ label: 'Main Embed • HD', url: s.embed });
                }
                return out;
            }

            function renderTabs() {
                categoryTabsEl.innerHTML = '';
                if (viewMode === 'live') {
                    const list = ['all', ...liveCategories];
                    list.forEach(cat => {
                        const btn = document.createElement('button');
                        btn.className = `cinema-tab${activeCategory === cat ? ' active' : ''}`;
                        btn.textContent = cat === 'all' ? 'All Sports' : cat.replace(/-/g, ' ');
                        btn.onclick = () => {
                            activeCategory = cat;
                            renderTabs();
                            renderLiveGrid();
                        };
                        categoryTabsEl.appendChild(btn);
                    });
                } else {
                    const list = [{ key: 'all', label: 'All Replays' }, ...archiveSources];
                    list.forEach(src => {
                        const btn = document.createElement('button');
                        btn.className = `cinema-tab${activeArchiveSource === src.key ? ' active' : ''}`;
                        btn.textContent = src.label;
                        btn.onclick = () => {
                            activeArchiveSource = src.key;
                            renderTabs();
                            loadArchiveVideos(true);
                        };
                        categoryTabsEl.appendChild(btn);
                    });
                }
            }

            function renderSpotlight(streams) {
                if (viewMode !== 'live' || searchQuery.trim() || !streams.length) {
                    spotlightBanner.classList.add('hidden');
                    return;
                }
                spotlightBanner.classList.remove('hidden', 'is-hidden-search');
                const featured = streams.find(isDamitvLive) || streams[0];
                const live = isDamitvLive(featured);

                spotlightBg.src = featured.poster || '';
                spotlightBg.onerror = () => { spotlightBg.style.display = 'none'; };
                spotlightBg.onload = () => { spotlightBg.style.display = 'block'; };
                spotlightTitle.textContent = featured.name || 'Live Match';
                spotlightLeague.textContent = featured.league || (featured.category_name || 'Sports').replace(/-/g, ' ');
                spotlightTime.textContent = Number(featured.always_live) === 1
                    ? '24/7 Live Channel'
                    : (live ? `Live • ${featured.viewers || 0} watching` : formatMatchTime(featured.starts_at));
                spotlightBadge.classList.toggle('is-upcoming', !live);
                spotlightBadgeText.textContent = Number(featured.always_live) === 1 ? '24/7' : (live ? 'Live Now' : 'Upcoming');
                spotlightPlayBtn.onclick = () => openLiveStream(featured);
            }

            function renderLiveGrid() {
                loadMoreWrap.classList.add('hidden');
                const q = searchQuery.trim().toLowerCase();
                let filtered = liveStreams.filter(s => {
                    const catOk = activeCategory === 'all' || (s.category_name || '').toLowerCase() === activeCategory.toLowerCase();
                    if (!catOk) return false;
                    if (!q) return true;
                    return (
                        (s.name || '').toLowerCase().includes(q) ||
                        (s.league || '').toLowerCase().includes(q) ||
                        (s.category_name || '').toLowerCase().includes(q)
                    );
                });

                filtered.sort((a, b) => {
                    const aLive = isDamitvLive(a) ? 1 : 0;
                    const bLive = isDamitvLive(b) ? 1 : 0;
                    if (aLive !== bLive) return bLive - aLive;
                    return (b.viewers || 0) - (a.viewers || 0);
                });

                renderSpotlight(filtered);

                gridHeadingEl.textContent = activeCategory === 'all'
                    ? 'Live & Upcoming (DAMITV)'
                    : activeCategory.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
                streamCountLabelEl.textContent = `${filtered.length} ${filtered.length === 1 ? 'stream' : 'streams'}`;

                sportsGridEl.innerHTML = '';
                if (!filtered.length) {
                    emptyStateEl.classList.remove('hidden');
                    return;
                }
                emptyStateEl.classList.add('hidden');

                filtered.forEach(stream => {
                    const live = isDamitvLive(stream);
                    const is247 = Number(stream.always_live) === 1;
                    const sources = getDamitvSources(stream);
                    const card = document.createElement('article');
                    card.className = 'sport-card';
                    card.onclick = () => openLiveStream(stream);

                    const thumb = stream.poster || '';
                    const statusLabel = is247 ? '24/7' : (live ? 'LIVE' : 'SOON');
                    const timeLabel = is247 ? 'Always Live' : (live ? `${stream.viewers || 0} viewers` : formatMatchTime(stream.starts_at));

                    card.innerHTML = `
                        <div class="sport-thumb-wrap">
                            ${thumb ? `<img class="sport-thumb" src="${esc(thumb)}" alt="" loading="lazy" onerror="this.style.display='none'">` : ''}
                            <div class="sport-thumb-placeholder"><i class="fa-solid fa-trophy"></i></div>
                            <span class="sport-badge ${live ? 'badge-live' : 'badge-upcoming'}">
                                ${live ? '<span class="live-dot"></span>' : ''}${statusLabel}
                            </span>
                            <span class="sport-quality-pill">${sources.length} ${sources.length === 1 ? 'SRC' : 'SRCS'}</span>
                        </div>
                        <div class="sport-card-body">
                            <h3 class="sport-card-title">${esc(stream.name || 'Match Stream')}</h3>
                            <div class="sport-card-meta">
                                <span>${esc(stream.league || stream.category_name || 'Sports')}</span>
                                <span>${esc(timeLabel)}</span>
                            </div>
                        </div>
                    `;
                    sportsGridEl.appendChild(card);
                });
            }

            function renderArchiveGrid() {
                spotlightBanner.classList.add('hidden');
                gridHeadingEl.textContent = 'Past Games & Replays';
                streamCountLabelEl.textContent = `${archiveVideos.length} of ${archiveTotal.toLocaleString()} replays`;

                sportsGridEl.innerHTML = '';
                if (!archiveVideos.length && !archiveLoading) {
                    emptyStateEl.classList.remove('hidden');
                    loadMoreWrap.classList.add('hidden');
                    return;
                }
                emptyStateEl.classList.add('hidden');

                archiveVideos.forEach(item => {
                    const card = document.createElement('article');
                    card.className = 'sport-card';
                    card.onclick = () => openArchiveItem(item);

                    const thumb = item.thumb || item.screenshot || '';
                    const streamCount = Array.isArray(item.streams) ? item.streams.length : 0;
                    const pill = streamCount > 0 ? `${streamCount} PLAY` : (item.mega && item.mega.length ? 'MEGA' : (item.torrent ? 'TORRENT' : 'REPLAY'));

                    card.innerHTML = `
                        <div class="sport-thumb-wrap">
                            ${thumb ? `<img class="sport-thumb" src="${esc(thumb)}" alt="" loading="lazy" onerror="this.style.display='none'">` : ''}
                            <div class="sport-thumb-placeholder"><i class="fa-solid fa-clapperboard"></i></div>
                            <span class="sport-badge badge-upcoming">${esc(item.source || 'archive')}</span>
                            <span class="sport-quality-pill">${esc(pill)}</span>
                        </div>
                        <div class="sport-card-body">
                            <h3 class="sport-card-title">${esc(item.title || 'Archived Replay')}</h3>
                            <div class="sport-card-meta">
                                <span>${esc(item.section || 'Replay')}</span>
                                <span>${esc(item.date || '')}</span>
                            </div>
                        </div>
                    `;
                    sportsGridEl.appendChild(card);
                });

                if (archiveVideos.length < archiveTotal) {
                    loadMoreWrap.classList.remove('hidden');
                } else {
                    loadMoreWrap.classList.add('hidden');
                }
            }

            function openLiveStream(stream) {
                playerTitle.textContent = stream.name || 'Live Stream';
                archiveLinksPanel.classList.add('hidden');
                streamFrame.classList.remove('hidden');
                sourceSelect.classList.remove('hidden');
                openExternalBtn.classList.add('hidden');
                playerModal.style.display = 'flex';
                document.body.style.overflow = 'hidden';

                const sources = getDamitvSources(stream);
                sourceSelect.innerHTML = '';
                sources.forEach(src => {
                    const opt = document.createElement('option');
                    opt.value = src.url;
                    opt.textContent = src.label;
                    sourceSelect.appendChild(opt);
                });
                if (sources[0]) {
                    sourceSelect.value = sources[0].url;
                    loadStreamUrl(sources[0].url);
                }
            }

            function openArchiveItem(item) {
                playerTitle.textContent = item.title || 'Past Game Replay';
                playerModal.style.display = 'flex';
                document.body.style.overflow = 'hidden';

                const streams = Array.isArray(item.streams) ? item.streams : [];
                if (streams.length > 0) {
                    archiveLinksPanel.classList.add('hidden');
                    streamFrame.classList.remove('hidden');
                    sourceSelect.classList.remove('hidden');
                    openExternalBtn.classList.remove('hidden');

                    sourceSelect.innerHTML = '';
                    streams.forEach((s, idx) => {
                        const opt = document.createElement('option');
                        opt.value = s.url;
                        opt.textContent = s.label || `Replay Server #${idx + 1}`;
                        sourceSelect.appendChild(opt);
                    });
                    sourceSelect.value = streams[0].url;
                    openExternalBtn.href = streams[0].url;
                    loadStreamUrl(streams[0].url);
                } else {
                    streamFrame.src = 'about:blank';
                    streamFrame.classList.add('hidden');
                    sourceSelect.classList.add('hidden');
                    openExternalBtn.classList.add('hidden');
                    archiveLinksPanel.classList.remove('hidden');
                    archiveLinksList.innerHTML = '';

                    const addLink = (label, href) => {
                        if (!href) return;
                        const a = document.createElement('a');
                        a.href = href;
                        a.target = '_blank';
                        a.rel = 'noopener';
                        a.className = 'spotlight-btn-play';
                        a.style.textDecoration = 'none';
                        a.innerHTML = `<i class="fa-solid fa-arrow-up-right-from-square"></i><span>${esc(label)}</span>`;
                        archiveLinksList.appendChild(a);
                    };

                    (item.mega || []).forEach((u, i) => addLink(`MEGA${item.mega.length > 1 ? ` #${i + 1}` : ''}`, u));
                    if (item.torrent) addLink('Torrent (.mkv.torrent)', item.torrent);
                    if (item.pageUrl) addLink('Open Replay Page', item.pageUrl);
                }
            }

            function closePlayer() {
                playerModal.style.display = 'none';
                streamFrame.src = 'about:blank';
                document.body.style.overflow = '';
            }

            sourceSelect.onchange = () => {
                if (sourceSelect.value) {
                    openExternalBtn.href = sourceSelect.value;
                    loadStreamUrl(sourceSelect.value);
                }
            };
            reloadStreamBtn.onclick = () => {
                if (sourceSelect.value) loadStreamUrl(sourceSelect.value);
            };
            closePlayerBtn.onclick = closePlayer;

            async function loadLiveData(forceRefresh = false) {
                if (!forceRefresh) {
                    try {
                        const cached = JSON.parse(localStorage.getItem(DAMITV_CACHE_KEY) || 'null');
                        if (cached && Date.now() - cached.ts < DAMITV_TTL_MS && Array.isArray(cached.streams)) {
                            liveStreams = cached.streams;
                            liveCategories = cached.categories || [];
                            renderTabs();
                            renderLiveGrid();
                            return;
                        }
                    } catch (_) {}
                }

                streamCountLabelEl.textContent = 'Loading DAMITV streams...';
                try {
                    const res = await fetch('/api/sports?provider=damitv&action=streams');
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    const data = await res.json();
                    const groups = Array.isArray(data.streams) ? data.streams : [];
                    const flat = [];
                    const cats = [];
                    groups.forEach(g => {
                        if (g.category) cats.push(g.category);
                        if (Array.isArray(g.streams)) {
                            g.streams.forEach(item => flat.push(item));
                        }
                    });
                    liveCategories = Array.from(new Set(cats));
                    liveStreams = flat;
                    try {
                        localStorage.setItem(DAMITV_CACHE_KEY, JSON.stringify({
                            ts: Date.now(),
                            categories: liveCategories,
                            streams: liveStreams
                        }));
                    } catch (_) {}
                    renderTabs();
                    renderLiveGrid();
                } catch (err) {
                    streamCountLabelEl.textContent = 'DAMITV unavailable';
                    emptyStateEl.classList.remove('hidden');
                }
            }

            async function loadArchiveSources() {
                if (archiveSources.length) return;
                try {
                    const res = await fetch('/api/sports?provider=archive&action=sources');
                    const data = res.ok ? await res.json() : await fetch(`${ARCHIVE_DIRECT}/sources`).then(r => r.json());
                    if (Array.isArray(data)) archiveSources = data;
                } catch (_) {}
            }

            async function loadArchiveVideos(reset = true) {
                if (archiveLoading) return;
                archiveLoading = true;
                if (reset) {
                    archiveOffset = 0;
                    archiveVideos = [];
                    streamCountLabelEl.textContent = 'Loading past games...';
                }
                const params = new URLSearchParams({
                    provider: 'archive',
                    action: 'videos',
                    limit: '48',
                    offset: String(archiveOffset)
                });
                if (activeArchiveSource !== 'all') params.set('source', activeArchiveSource);
                if (searchQuery.trim()) params.set('q', searchQuery.trim());

                try {
                    let data;
                    try {
                        const r = await fetch(`/api/sports?${params.toString()}`);
                        if (!r.ok) throw new Error('proxy');
                        data = await r.json();
                    } catch (_) {
                        const directParams = new URLSearchParams({ limit: '48', offset: String(archiveOffset) });
                        if (activeArchiveSource !== 'all') directParams.set('source', activeArchiveSource);
                        if (searchQuery.trim()) directParams.set('q', searchQuery.trim());
                        const r2 = await fetch(`${ARCHIVE_DIRECT}/videos?${directParams.toString()}`);
                        data = await r2.json();
                    }
                    const list = Array.isArray(data.videos) ? data.videos : [];
                    archiveTotal = Number(data.total || list.length);
                    archiveVideos = reset ? list : [...archiveVideos, ...list];
                    archiveOffset += list.length;
                    renderTabs();
                    renderArchiveGrid();
                } catch (err) {
                    streamCountLabelEl.textContent = 'Archive unavailable';
                    emptyStateEl.classList.remove('hidden');
                } finally {
                    archiveLoading = false;
                }
            }

            modeLiveBtn.onclick = () => {
                if (viewMode === 'live') return;
                viewMode = 'live';
                modeLiveBtn.classList.add('active');
                modeArchiveBtn.classList.remove('active');
                renderTabs();
                if (liveStreams.length) {
                    renderLiveGrid();
                } else {
                    loadLiveData(false);
                }
            };

            modeArchiveBtn.onclick = async () => {
                if (viewMode === 'archive') return;
                viewMode = 'archive';
                modeArchiveBtn.classList.add('active');
                modeLiveBtn.classList.remove('active');
                await loadArchiveSources();
                renderTabs();
                if (archiveVideos.length) {
                    renderArchiveGrid();
                } else {
                    loadArchiveVideos(true);
                }
            };

            loadMoreBtn.onclick = () => loadArchiveVideos(false);

            searchInputEl.addEventListener('input', () => {
                searchQuery = searchInputEl.value;
                if (viewMode === 'live') {
                    renderLiveGrid();
                } else {
                    clearTimeout(searchTimer);
                    searchTimer = setTimeout(() => loadArchiveVideos(true), 300);
                }
            });

            refreshBtnEl.onclick = () => {
                if (viewMode === 'live') {
                    loadLiveData(true);
                } else {
                    loadArchiveVideos(true);
                }
            };

            loadLiveData(false);
        })();
    </script>
</body>
</html>
