<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <style>
    body{margin:0;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
         background:#0f1115;color:#fff;font-family:system-ui,sans-serif}
    button{padding:14px 32px;font-size:18px;border:0;border-radius:10px;background:#4f8cff;color:#fff;cursor:pointer}
    button:hover{background:#3b76e8}
    p{opacity:.6;font-size:14px;max-width:360px;text-align:center}
  </style>
</head>
<body>
  <h1>12am</h1>
  <button id="go">Launch</button>
  <p id="msg"></p>
  <script>
    var SITE = <?!= JSON.stringify(siteUrl) ?>;
    document.getElementById('go').onclick = function () {
      var w = window.open('about:blank', '_blank');
      if (!w) {
        document.getElementById('msg').textContent = 'Popup blocked. Allow popups for this page and click again.';
        return;
      }
      w.document.title = 'Home';
      w.document.body.style.cssText = 'margin:0;height:100vh;overflow:hidden';
      var f = w.document.createElement('iframe');
      f.src = SITE;
      f.style.cssText = 'border:none;width:100%;height:100%';
      f.allow = 'fullscreen; autoplay; clipboard-write';
      f.setAttribute('allowfullscreen', '');
      w.document.body.appendChild(f);
    };
  </script>
</body>
</html>
