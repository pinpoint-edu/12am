<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;height:100%}
    body{display:flex;align-items:center;justify-content:center;color:#e8eaf0;
         font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
         background:radial-gradient(1200px 600px at 20% -10%,#1d2450 0%,transparent 60%),
                    radial-gradient(900px 500px at 110% 110%,#3b1d5a 0%,transparent 55%),#0a0b12}
    .card{width:min(420px,92vw);padding:44px 36px 30px;text-align:center;border-radius:24px;
          background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);
          box-shadow:0 30px 80px rgba(0,0,0,.55);backdrop-filter:blur(14px)}
    .logo{font-size:56px;font-weight:800;letter-spacing:-2px;margin:0;
          background:linear-gradient(135deg,#8ea2ff,#c58bff);-webkit-background-clip:text;background-clip:text;color:transparent}
    .tag{margin:6px 0 30px;color:#9aa0b4;font-size:14px}
    #go{width:100%;padding:15px 20px;font-size:16px;font-weight:600;color:#fff;border:0;border-radius:14px;cursor:pointer;
        background:linear-gradient(135deg,#5b7cff,#9b5cff);box-shadow:0 10px 30px rgba(110,100,255,.35);
        transition:transform .12s,box-shadow .12s,opacity .12s}
    #go:hover{transform:translateY(-1px);box-shadow:0 14px 36px rgba(110,100,255,.5)}
    #go:active{transform:translateY(0)}
    #go:disabled{opacity:.55;cursor:default;transform:none}
    #msg{min-height:20px;margin:16px 0 0;font-size:13px;color:#ff9aa8}
    details{margin-top:18px;text-align:left;font-size:13px;color:#8d93a8}
    summary{cursor:pointer;text-align:center;list-style:none;opacity:.8}
    summary::-webkit-details-marker{display:none}
    .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
    select{flex:1;background:rgba(255,255,255,.06);color:#e8eaf0;border:1px solid rgba(255,255,255,.12);
           border-radius:10px;padding:8px 10px;font-size:13px;outline:none}
    select option{background:#14161f}
  </style>
</head>
<body>
  <div class="card">
    <h1 class="logo">12am</h1>
    <p class="tag">Opens in a new cloaked tab</p>
    <button id="go">Launch</button>
    <p id="msg"></p>
    <details>
      <summary>Advanced</summary>
      <div class="row"><span>Mirror</span><select id="mirror"></select></div>
    </details>
  </div>

  <script>
    // Config injected from Code.gs: { siteUrl, cdnRepo, cdnRef, entry, mirrors[] }
    var CONFIG = <?!= JSON.stringify(config) ?>;

    // ============ Runs INSIDE each page iframe, before the page's own scripts ============
    function frameShim(cfg) {
      var BASE = cfg.base;
      var HOSTS = cfg.mirrors.map(function (m) { return new URL(m).host; });
      try { if (location.origin && location.origin !== 'null') HOSTS.push(new URL(location.origin).host); } catch (e) {}
      var API = ['/api/', '/music-api/', '/tglsc-proxy/', '/assets/', '/textbooks/', '/share'];
      window.__GAS_LAUNCHER__ = true;

      // Storage can be blocked/partitioned in about:blank; fall back to memory so pages don't crash
      ['localStorage', 'sessionStorage'].forEach(function (name) {
        try { window[name].getItem('__t'); } catch (e) {
          var mem = {};
          var fake = {
            getItem: function (k) { return Object.prototype.hasOwnProperty.call(mem, k) ? mem[k] : null; },
            setItem: function (k, v) { mem[k] = String(v); },
            removeItem: function (k) { delete mem[k]; },
            clear: function () { mem = {}; },
            key: function (i) { return Object.keys(mem)[i] || null; },
            get length() { return Object.keys(mem).length; }
          };
          try { Object.defineProperty(window, name, { configurable: true, get: function () { return fake; } }); } catch (e2) {}
        }
      });

      // Map any URL the page builds -> where it actually lives
      function fix(u) {
        try {
          var a = new URL(String(u), document.baseURI || BASE);
          if (HOSTS.indexOf(a.host) < 0) return String(u);
          var path = a.pathname, root = new URL(BASE).pathname, sub;
          if (path.indexOf(root) === 0) sub = '/' + path.slice(root.length);
          else if (path.indexOf('/gh/') === 0 || path.indexOf('/npm/') === 0) return a.href; // other CDN package
          else sub = path;
          for (var i = 0; i < API.length; i++)
            if (sub.indexOf(API[i]) === 0) return cfg.siteUrl + sub + a.search;
          return BASE + sub.slice(1) + a.search + a.hash;
        } catch (e) { return String(u); }
      }
      window.__gasFix = fix;

      var _fetch = window.fetch;
      window.fetch = function (input, init) {
        try {
          if (typeof input === 'string' || input instanceof URL) return _fetch.call(this, fix(input), init);
          if (input && input.url) return _fetch.call(this, new Request(fix(input.url), input), init);
        } catch (e) {}
        return _fetch.call(this, input, init);
      };
      var _open = XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open = function (m, u) {
        var args = Array.prototype.slice.call(arguments); args[1] = fix(u);
        return _open.apply(this, args);
      };
      if (navigator.sendBeacon) {
        var _sb = navigator.sendBeacon.bind(navigator);
        navigator.sendBeacon = function (u, d) { return _sb(fix(u), d); };
      }
      if (window.EventSource) {
        var _ES = window.EventSource;
        window.EventSource = function (u, o) { return new _ES(fix(u), o); };
      }

      function patchProp(proto, prop) {
        var d = Object.getOwnPropertyDescriptor(proto, prop);
        if (!d || !d.set) return;
        Object.defineProperty(proto, prop, {
          configurable: true, enumerable: d.enumerable, get: d.get,
          set: function (v) { d.set.call(this, fix(v)); }
        });
      }
      [[HTMLImageElement, 'src'], [HTMLScriptElement, 'src'], [HTMLMediaElement, 'src'], [HTMLSourceElement, 'src'],
       [HTMLEmbedElement, 'src'], [HTMLLinkElement, 'href'], [HTMLIFrameElement, 'src']].forEach(function (p) { patchProp(p[0].prototype, p[1]); });
      var _sa = Element.prototype.setAttribute;
      Element.prototype.setAttribute = function (n, v) {
        if ((n === 'src' || n === 'href' || n === 'poster') && !(this instanceof HTMLAnchorElement)) v = fix(v);
        return _sa.call(this, n, v);
      };

      // ---- Navigation: hand every page change to the shell so we never leave about:blank ----
      function go(u) { parent.__gasLoad(fix(new URL(String(u), document.baseURI).href)); }
      window.__gasNavigate = go;

      function isAppUrl(abs) { var a = new URL(abs); return HOSTS.indexOf(a.host) >= 0; }

      document.addEventListener('click', function (e) {
        var a = e.target && e.target.closest && e.target.closest('a[href]');
        if (!a || e.defaultPrevented || e.button || e.ctrlKey || e.metaKey || e.shiftKey) return;
        var h = a.getAttribute('href');
        if (!h || h.charAt(0) === '#' || /^(javascript|mailto|tel|blob|data):/i.test(h)) return;
        if (a.target && a.target !== '_self') return;
        var abs; try { abs = new URL(h, document.baseURI).href; } catch (er) { return; }
        if (!isAppUrl(abs)) return;
        e.preventDefault();
        go(abs);
      }, true);

      // Catches location.href=, location.assign/replace, window.open(_self), form posts, reload
      if (window.navigation && navigation.addEventListener) {
        navigation.addEventListener('navigate', function (e) {
          if (e.hashChange || e.downloadRequest || !e.cancelable) return;
          var dest = e.destination && e.destination.url;
          if (!dest) return;
          if (e.navigationType === 'reload') { e.preventDefault(); parent.__gasReload(); return; }
          if (/^(about:|blob:|data:|javascript:)/i.test(dest)) return;
          try { if (!isAppUrl(dest)) return; } catch (er) { return; }
          e.preventDefault();
          go(dest);
        });
      }
    }

    // ============ Runs in the about:blank TAB (the shell). One iframe per page. ============
    function shellMain(cfg, shimSrc) {
      var frame = document.getElementById('app');
      var current = null;

      function pageUrl(u) {
        var a;
        try { a = new URL(u, current || cfg.base); } catch (e) { return null; }
        if (a.href.indexOf(cfg.base) !== 0) return null;
        var p = a.pathname, last = p.split('/').pop();
        if (/\/$/.test(p)) p += 'index.html';
        else if (!/\.[a-z0-9]+$/i.test(last)) p += '.html';      // cleanUrls: /games -> games.html
        else if (!/\.html?$/i.test(last)) return null;           // an asset, not a page
        a.pathname = p;
        return a;
      }

      function build(html, a) {
        var dir = a.href.slice(0, a.href.lastIndexOf('/') + 1);
        var inject = '<base href="' + dir + '"><script>(' + shimSrc + ')(' + JSON.stringify(cfg) + ')<\/script>';
        return /<head[^>]*>/i.test(html) ? html.replace(/<head[^>]*>/i, function (m) { return m + inject; }) : inject + html;
      }

      function showError(msg) {
        frame.srcdoc = '<body style="background:#0a0b12;color:#e8eaf0;font-family:system-ui;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;text-align:center"><div><h3>Couldn\'t load page</h3><p style="opacity:.6">' + msg + '</p><button onclick="parent.__gasReload()" style="padding:10px 18px;border-radius:10px;border:0;background:#5b7cff;color:#fff;cursor:pointer">Retry</button></div></body>';
      }

      window.__gasLoad = function (u) {
        var a = pageUrl(u);
        if (!a) { window.open(u, '_blank'); return; }
        current = a.href;
        fetch(a.href + (a.search ? '&' : '?') + 't=' + Date.now())
          .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
          .then(function (html) { frame.srcdoc = build(html, a); })
          .catch(function (e) { showError(e.message); });
      };
      window.__gasReload = function () { if (current) window.__gasLoad(current); };

      // Keep the tab title in sync with the page
      setInterval(function () {
        try { var t = frame.contentDocument.title; if (t && t !== document.title) document.title = t; } catch (e) {}
      }, 800);

      // top.location.* from inside pages
      if (window.navigation && navigation.addEventListener) {
        navigation.addEventListener('navigate', function (e) {
          if (e.hashChange || !e.cancelable || e.downloadRequest) return;
          var dest = e.destination && e.destination.url;
          if (!dest || /^(about:|blob:|data:|javascript:)/i.test(dest)) return;
          if (pageUrl(dest)) { e.preventDefault(); window.__gasLoad(dest); }
        });
      }

      window.__gasLoad(cfg.base + cfg.entry);
    }

    // ============ Launcher UI ============
    function msg(t) { document.getElementById('msg').textContent = t || ''; }
    var sel = document.getElementById('mirror');
    CONFIG.mirrors.forEach(function (m) {
      var o = document.createElement('option'); o.value = m; o.textContent = new URL(m).host; sel.appendChild(o);
    });
    function baseFor(mirror) { return mirror + '/gh/' + CONFIG.cdnRepo + '@' + CONFIG.cdnRef + '/'; }

    function shellHtml(cfg) {
      return '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Home</title>' +
        '<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}' +
        'iframe{border:0;width:100%;height:100%;display:block}</style></head><body>' +
        '<iframe id="app" allow="fullscreen; autoplay; clipboard-read; clipboard-write; gamepad; microphone; camera; encrypted-media; ' +
        'pointer-lock; web-share" allowfullscreen></iframe>' +
        '<script>(' + shellMain.toString() + ')(' + JSON.stringify(cfg) + ',' + JSON.stringify(frameShim.toString()) + ')<\/script>' +
        '</body></html>';
    }

    function fallbackFrame(w, url) {
      w.document.open();
      w.document.write('<!DOCTYPE html><title>Home</title><body style="margin:0;height:100vh;overflow:hidden">' +
        '<iframe src="' + url + '" style="border:0;width:100%;height:100%" allow="fullscreen; autoplay; clipboard-write" allowfullscreen></iframe></body>');
      w.document.close();
    }

    document.getElementById('go').onclick = async function () {
      var btn = this; btn.disabled = true; msg('');
      var w = window.open('about:blank', '_blank');
      if (!w) { msg('Popup blocked. Allow popups for this page, then click again.'); btn.disabled = false; return; }

      var order = [sel.value].concat(CONFIG.mirrors.filter(function (m) { return m !== sel.value; }));
      var good = null;
      for (var i = 0; i < order.length && !good; i++) {
        try {
          var r = await fetch(baseFor(order[i]) + CONFIG.entry + '?t=' + Date.now());
          if (r.ok) good = order[i];
        } catch (e) {}
      }
      if (!good) { fallbackFrame(w, CONFIG.siteUrl); btn.disabled = false; return; }

      var cfg = { siteUrl: CONFIG.siteUrl, mirrors: CONFIG.mirrors, base: baseFor(good), entry: CONFIG.entry };
      w.document.open(); w.document.write(shellHtml(cfg)); w.document.close();
      btn.disabled = false;
    };
  </script>
</body>
</html>
