<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12AM — Movies &amp; Shows</title>
    <meta name="description" content="Stream high-definition movies and TV series with instant multi-server streaming on 12AM.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Supabase & 12AM Device Auth Core -->
    <script src="supabase-config.js"></script>
    <script src="device-auth.js"></script>

    <!-- 12AM Core Theme & Navigation -->
    <link rel="stylesheet" href="navigation.css">
    <script src="theme.js"></script>
    <script src="navigation.js" defer></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brandPurple: '#8b5cf6',
                        brandPurpleDark: '#7c3aed'
                    },
                    fontFamily: {
                        sans: ['Geist', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --bg-page: #040404;
            --bg-card: #0c0c0e;
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            --accent-color: #8b5cf6;
            --accent-glow: rgba(139, 92, 246, 0.4);
            --border-main: #1c1c20;
            --border-faint: rgba(255, 255, 255, 0.06);
            --btn-bg: rgba(139, 92, 246, 0.12);
        }

        body {
            font-family: 'Geist', sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            padding-top: calc(var(--navbar-height, 64px) + 1.25rem);
            -webkit-font-smoothing: antialiased;
        }

        .cinema-wrapper {
            max-width: 1350px;
            margin: 0 auto;
            padding: 0 1.5rem 5rem;
        }

        /* Top Controls: Search & Tabs */
        .top-cinema-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1.25rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .cinema-tabs {
            display: inline-flex;
            background: var(--bg-card);
            border: 1px solid var(--border-main);
            padding: 4px;
            border-radius: 9999px;
            gap: 4px;
        }

        .cinema-tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 6px 18px;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .cinema-tab-btn:hover {
            color: #ffffff;
        }

        .cinema-tab-btn.active {
            background: var(--accent-color);
            color: #ffffff;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .search-cinema-box {
            position: relative;
            flex: 1;
            max-width: 440px;
        }

        .search-cinema-input {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-main);
            border-radius: 9999px;
            padding: 8px 16px 8px 40px;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .search-cinema-input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .search-cinema-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 14px;
        }

        /* Hero Spotlight Banner */
        .spotlight-banner {
            position: relative;
            width: 100%;
            height: 380px;
            border-radius: 24px;
            overflow: hidden;
            margin-bottom: 2.5rem;
            border: 1px solid var(--border-main);
            background: #08080a;
            display: flex;
            align-items: flex-end;
            padding: 2.5rem;
        }

        .spotlight-backdrop {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.45;
            transition: opacity 0.5s ease;
        }

        .spotlight-gradient {
            position: absolute;
            inset: 0;
            background: linear-gradient(0deg, rgba(4, 4, 4, 0.95) 10%, rgba(4, 4, 4, 0.5) 60%, transparent 100%);
        }

        .spotlight-content {
            position: relative;
            z-index: 2;
            max-width: 650px;
        }

        .spotlight-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.72rem;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 9999px;
            background: var(--btn-bg);
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            text-transform: uppercase;
            margin-bottom: 0.75rem;
        }

        .spotlight-title {
            font-size: clamp(1.8rem, 4vw, 2.8rem);
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 0.75rem;
            letter-spacing: -0.02em;
        }

        .spotlight-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
        }

        .spotlight-rating {
            color: #fbbf24;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .spotlight-desc {
            font-size: 0.9rem;
            line-height: 1.5;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .spotlight-btn-play {
            background: var(--accent-color);
            color: #ffffff;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 0.65rem 1.6rem;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 0 20px var(--accent-glow);
            transition: all 0.2s ease;
        }

        .spotlight-btn-play:hover {
            background: #9d74f8;
            transform: scale(1.03);
        }

        /* Movie / Series Cards Grid */
        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1.5rem;
        }

        .media-card {
            background: var(--bg-card);
            border: 1px solid var(--border-main);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        .media-card:hover {
            border-color: var(--accent-color);
            transform: translateY(-4px);
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.7), 0 0 20px var(--accent-glow);
        }

        .media-poster-wrap {
            width: 100%;
            aspect-ratio: 2 / 3;
            background: #121216;
            overflow: hidden;
            position: relative;
        }

        .media-poster {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.35s ease;
        }

        .media-card:hover .media-poster {
            transform: scale(1.06);
        }

        .media-badge-rating {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            padding: 3px 8px;
            border-radius: 8px;
            font-size: 0.72rem;
            font-weight: 700;
            color: #fbbf24;
            display: flex;
            align-items: center;
            gap: 3px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .media-badge-type {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(139, 92, 246, 0.85);
            backdrop-filter: blur(8px);
            padding: 2px 7px;
            border-radius: 6px;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            color: #ffffff;
            letter-spacing: 0.04em;
        }

        .media-info {
            padding: 0.9rem;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .media-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .media-meta-row {
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Fullscreen Player Modal */
        #playerModal {
            position: fixed;
            inset: 0;
            z-index: 10000;
            background: #000000;
            display: none;
            flex-direction: column;
        }

        .player-bar {
            height: 56px;
            background: rgba(10, 10, 12, 0.95);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-main);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.25rem;
            gap: 1rem;
            flex-shrink: 0;
        }

        .player-left, .player-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .player-title-text {
            font-size: 0.95rem;
            font-weight: 700;
            color: #ffffff;
            max-width: 280px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .select-dark {
            background: #141418;
            border: 1px solid var(--border-main);
            color: #ffffff;
            font-size: 0.8rem;
            font-weight: 600;
            border-radius: 8px;
            padding: 5px 10px;
            outline: none;
            cursor: pointer;
        }

        .btn-player-action {
            height: 32px;
            padding: 0 12px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #ffffff;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s ease;
        }

        .btn-player-action:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .btn-player-action.btn-close {
            background: rgba(239, 68, 68, 0.15);
            border-color: rgba(239, 68, 68, 0.3);
            color: #f87171;
        }

        .btn-player-action.btn-close:hover {
            background: #ef4444;
            color: #ffffff;
        }

        .player-frame-area {
            flex: 1;
            width: 100%;
            height: 100%;
            background: #000000;
            position: relative;
        }

        #streamIframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* 12AM Footer */
        .cinema-footer {
            border-top: 1px solid var(--border-main);
            padding: 2.5rem 1.5rem;
            background: rgba(8, 8, 10, 0.85);
            margin-top: 5rem;
        }

        .cinema-footer-inner {
            max-width: 1350px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="cinema-wrapper">
        <!-- Top Search and Filter Bar -->
        <div class="top-cinema-bar">
            <div class="cinema-tabs">
                <button class="cinema-tab-btn active" data-tab="trending" onclick="switchCinemaTab('trending')">Trending</button>
                <button class="cinema-tab-btn" data-tab="movie" onclick="switchCinemaTab('movie')">Movies</button>
                <button class="cinema-tab-btn" data-tab="tv" onclick="switchCinemaTab('tv')">TV Series</button>
            </div>

            <div class="search-cinema-box">
                <i class="fa-solid fa-magnifying-glass search-cinema-icon"></i>
                <input type="text" id="cinemaSearchInput" class="search-cinema-input" placeholder="Search movies, TV shows... (Press /)" autocomplete="off">
            </div>
        </div>

        <!-- Featured Spotlight Hero -->
        <div class="spotlight-banner" id="spotlightBanner">
            <img id="spotlightBackdrop" class="spotlight-backdrop" src="" alt="">
            <div class="spotlight-gradient"></div>
            <div class="spotlight-content">
                <div class="spotlight-badge" id="spotlightBadge">Featured Spotlight</div>
                <h1 class="spotlight-title" id="spotlightTitle">Loading cinema...</h1>
                <div class="spotlight-meta">
                    <span class="spotlight-rating" id="spotlightRating"><i class="fa-solid fa-star"></i> --</span>
                    <span id="spotlightYear">2026</span>
                    <span id="spotlightType">Movie</span>
                </div>
                <p class="spotlight-desc" id="spotlightDesc">Connecting to high-speed stream gateway...</p>
                <button class="spotlight-btn-play" id="spotlightPlayBtn">
                    <i class="fa-solid fa-play"></i>
                    <span>Watch Now</span>
                </button>
            </div>
        </div>

        <!-- Media Grid Section -->
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-xl font-bold tracking-tight text-white" id="gridHeading">Trending Worldwide</h2>
            <span class="text-xs text-zinc-500 font-mono" id="resultsCount">Loading...</span>
        </div>

        <div class="media-grid" id="cinemaGrid"></div>
    </div>

    <!-- Fullscreen Player Modal -->
    <div id="playerModal">
        <div class="player-bar">
            <div class="player-left">
                <button class="btn-player-action btn-close" onclick="closePlayer()">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Close</span>
                </button>
                <span class="player-title-text" id="playerTitle">Streaming Media</span>
            </div>

            <div class="player-right">
                <!-- TV Selectors (Hidden on Movies) -->
                <div id="tvSelectors" style="display: none;" class="flex items-center gap-2">
                    <select id="seasonSelect" class="select-dark" onchange="handleSeasonChange()"></select>
                    <select id="episodeSelect" class="select-dark" onchange="handleEpisodeChange()"></select>
                </div>

                <!-- Server Selector -->
                <select id="serverSelect" class="select-dark" onchange="changeServer()">
                    <option value="vidlink">Server 1 (VidLink HD)</option>
                    <option value="vidsrc">Server 2 (VidSrc Fast)</option>
                    <option value="embedsu">Server 3 (EmbedSu)</option>
                    <option value="vidnest">Server 4 (VidNest)</option>
                    <option value="2embed">Server 5 (2Embed)</option>
                </select>

                <button class="btn-player-action" onclick="reloadPlayer()" title="Reload Stream">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
                <button class="btn-player-action" onclick="togglePlayerFullscreen()" title="Fullscreen">
                    <i class="fa-solid fa-expand"></i>
                </button>
            </div>
        </div>

        <div class="player-frame-area">
            <iframe id="streamIframe" allow="fullscreen; autoplay; picture-in-picture; encrypted-media"></iframe>
        </div>
    </div>

    <!-- Styled 12AM Footer -->
    <footer class="cinema-footer">
        <div class="cinema-footer-inner">
            <div class="flex items-center gap-3">
                <img src="images/logo-white.png" class="h-6 w-auto opacity-80" alt="12AM">
                <span class="text-sm font-semibold tracking-wider text-white">12AM Cinema</span>
            </div>
            <p class="text-xs text-zinc-500">&copy; 2026 12AM. Multi-source high-speed streaming platform.</p>
            <div class="flex items-center gap-4 text-xs text-zinc-400">
                <a href="dashboard.html" class="hover:text-white transition-colors">Dashboard</a>
                <a href="games.html" class="hover:text-white transition-colors">Games</a>
                <a href="music.html" class="hover:text-white transition-colors">Music</a>
                <a href="legal.html" class="hover:text-white transition-colors">Terms</a>
            </div>
        </div>
    </footer>

    <script>
        const TMDB_KEY = "1cf50e6248dc270629e802686245c2c8";
        const TMDB_BASE = "https://api.themoviedb.org/3";
        const IMG_W500 = "https://image.tmdb.org/t/p/w500";
        const IMG_ORIGINAL = "https://image.tmdb.org/t/p/original";

        let currentActiveTab = 'trending';
        let currentItem = null;
        let currentSeason = 1;
        let currentEpisode = 1;
        let tvSeasonsData = [];

        // Fetch TMDB
        async function fetchTMDB(endpoint, params = {}) {
            const queryParams = new URLSearchParams({
                api_key: TMDB_KEY,
                language: 'en-US',
                ...params
            });
            const url = `${TMDB_BASE}${endpoint}?${queryParams.toString()}`;
            try {
                const res = await fetch(url);
                return await res.json();
            } catch(e) {
                console.warn('TMDB Fetch Error:', e);
                return null;
            }
        }

        // Initialize Cinema
        async function initCinema() {
            loadTrending();
            setupSearch();
        }

        // Load Trending
        async function loadTrending() {
            const data = await fetchTMDB('/trending/all/day');
            if (!data || !data.results) return;

            const items = data.results.filter(i => (i.title || i.name) && (i.poster_path || i.backdrop_path));
            if (items.length > 0) {
                renderSpotlight(items[0]);
            }
            renderGrid(items, 'Trending Worldwide');
        }

        // Load Movies
        async function loadMovies() {
            const data = await fetchTMDB('/movie/popular');
            if (!data || !data.results) return;
            const items = data.results.map(i => ({ ...i, media_type: 'movie' }));
            if (items.length > 0) renderSpotlight(items[0]);
            renderGrid(items, 'Popular Movies');
        }

        // Load TV
        async function loadTV() {
            const data = await fetchTMDB('/tv/popular');
            if (!data || !data.results) return;
            const items = data.results.map(i => ({ ...i, media_type: 'tv' }));
            if (items.length > 0) renderSpotlight(items[0]);
            renderGrid(items, 'Popular TV Series');
        }

        // Switch Tabs
        function switchCinemaTab(tab) {
            currentActiveTab = tab;
            document.querySelectorAll('.cinema-tab-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tab === tab);
            });

            if (tab === 'trending') loadTrending();
            else if (tab === 'movie') loadMovies();
            else if (tab === 'tv') loadTV();
        }

        // Spotlight
        function renderSpotlight(item) {
            const backdrop = document.getElementById('spotlightBackdrop');
            const titleEl = document.getElementById('spotlightTitle');
            const ratingEl = document.getElementById('spotlightRating');
            const yearEl = document.getElementById('spotlightYear');
            const typeEl = document.getElementById('spotlightType');
            const descEl = document.getElementById('spotlightDesc');
            const playBtn = document.getElementById('spotlightPlayBtn');

            const isMovie = item.media_type === 'movie' || Boolean(item.title);
            const title = item.title || item.name || 'Untitled';
            const year = (item.release_date || item.first_air_date || '2026').slice(0, 4);
            const rating = item.vote_average ? item.vote_average.toFixed(1) : '8.2';

            if (item.backdrop_path) {
                backdrop.src = `${IMG_ORIGINAL}${item.backdrop_path}`;
            } else if (item.poster_path) {
                backdrop.src = `${IMG_W500}${item.poster_path}`;
            }

            titleEl.textContent = title;
            ratingEl.innerHTML = `<i class="fa-solid fa-star"></i> ${rating}`;
            yearEl.textContent = year;
            typeEl.textContent = isMovie ? 'Movie' : 'TV Series';
            descEl.textContent = item.overview || 'High-definition streaming provided through 12AM Cinema nodes.';

            playBtn.onclick = () => openPlayer(item);
        }

        // Render Media Grid
        function renderGrid(items, heading) {
            const grid = document.getElementById('cinemaGrid');
            const headingEl = document.getElementById('gridHeading');
            const countEl = document.getElementById('resultsCount');

            if (headingEl) headingEl.textContent = heading;
            if (countEl) countEl.textContent = `${items.length} titles available`;

            grid.innerHTML = items.map(item => {
                const isMovie = item.media_type === 'movie' || Boolean(item.title);
                const title = item.title || item.name || 'Untitled';
                const year = (item.release_date || item.first_air_date || '2026').slice(0, 4);
                const rating = item.vote_average ? item.vote_average.toFixed(1) : '7.8';
                const poster = item.poster_path ? `${IMG_W500}${item.poster_path}` : 'https://placehold.co/300x450/141418/8b5cf6?text=No+Poster';

                return `
                    <div class="media-card" onclick='openPlayer(${JSON.stringify(item).replace(/'/g, "&apos;")})'>
                        <div class="media-poster-wrap">
                            <img src="${poster}" alt="${title}" class="media-poster" loading="lazy">
                            <span class="media-badge-rating"><i class="fa-solid fa-star text-[10px]"></i> ${rating}</span>
                            <span class="media-badge-type">${isMovie ? 'Movie' : 'TV'}</span>
                        </div>
                        <div class="media-info">
                            <h3 class="media-title" title="${title}">${title}</h3>
                            <div class="media-meta-row">
                                <span>${year}</span>
                                <span class="text-[var(--accent-color)] font-semibold"><i class="fa-solid fa-play text-[10px] mr-1"></i>Watch</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Search Setup
        function setupSearch() {
            const input = document.getElementById('cinemaSearchInput');
            let debounceTimer = null;

            window.addEventListener('keydown', (e) => {
                if (e.key === '/' && !['INPUT', 'TEXTAREA'].includes(e.target.tagName)) {
                    e.preventDefault();
                    input.focus();
                }
            });

            input.addEventListener('input', () => {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(async () => {
                    const q = input.value.trim();
                    if (!q) {
                        switchCinemaTab(currentActiveTab);
                        return;
                    }
                    const data = await fetchTMDB('/search/multi', { query: q });
                    if (!data || !data.results) return;
                    const items = data.results.filter(i => (i.title || i.name) && (i.poster_path || i.backdrop_path));
                    renderGrid(items, `Search: "${q}"`);
                }, 350);
            });
        }

        // --- STREAMING PLAYER LOGIC ---
        async function openPlayer(item) {
            currentItem = item;
            const modal = document.getElementById('playerModal');
            const titleEl = document.getElementById('playerTitle');
            const tvSelectors = document.getElementById('tvSelectors');

            const isMovie = item.media_type === 'movie' || Boolean(item.title);
            const title = item.title || item.name;
            titleEl.textContent = title;

            modal.style.display = 'flex';

            if (!isMovie) {
                tvSelectors.style.display = 'flex';
                await loadTVSeasons(item.id);
            } else {
                tvSelectors.style.display = 'none';
                updatePlayerSource();
            }
        }

        async function loadTVSeasons(tvId) {
            const data = await fetchTMDB(`/tv/${tvId}`);
            const seasonSelect = document.getElementById('seasonSelect');
            seasonSelect.innerHTML = '';

            if (data && data.seasons) {
                tvSeasonsData = data.seasons.filter(s => s.season_number > 0);
                tvSeasonsData.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s.season_number;
                    opt.textContent = `Season ${s.season_number}`;
                    seasonSelect.appendChild(opt);
                });
            } else {
                seasonSelect.innerHTML = `<option value="1">Season 1</option>`;
            }

            currentSeason = 1;
            handleSeasonChange();
        }

        function handleSeasonChange() {
            const seasonSelect = document.getElementById('seasonSelect');
            currentSeason = parseInt(seasonSelect.value, 10) || 1;

            const epSelect = document.getElementById('episodeSelect');
            epSelect.innerHTML = '';

            const seasonObj = tvSeasonsData.find(s => s.season_number === currentSeason);
            const epCount = seasonObj ? seasonObj.episode_count : 24;

            for (let i = 1; i <= epCount; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = `Episode ${i}`;
                epSelect.appendChild(opt);
            }

            currentEpisode = 1;
            updatePlayerSource();
        }

        function handleEpisodeChange() {
            const epSelect = document.getElementById('episodeSelect');
            currentEpisode = parseInt(epSelect.value, 10) || 1;
            updatePlayerSource();
        }

        function changeServer() {
            updatePlayerSource();
        }

        function updatePlayerSource() {
            if (!currentItem) return;
            const iframe = document.getElementById('streamIframe');
            const server = document.getElementById('serverSelect').value;
            const isMovie = currentItem.media_type === 'movie' || Boolean(currentItem.title);
            const id = currentItem.id;

            let streamUrl = '';

            if (isMovie) {
                switch (server) {
                    case 'vidlink': streamUrl = `https://vidlink.pro/movie/${id}?primaryColor=8b5cf6&autoplay=true`; break;
                    case 'vidsrc': streamUrl = `https://vidsrc.su/embed/movie/${id}`; break;
                    case 'embedsu': streamUrl = `https://embed.su/embed/movie/${id}`; break;
                    case 'vidnest': streamUrl = `https://vidnest.fun/movie/${id}`; break;
                    case '2embed': streamUrl = `https://www.2embed.cc/embed/${id}`; break;
                    default: streamUrl = `https://vidlink.pro/movie/${id}?primaryColor=8b5cf6&autoplay=true`;
                }
            } else {
                switch (server) {
                    case 'vidlink': streamUrl = `https://vidlink.pro/tv/${id}/${currentSeason}/${currentEpisode}?primaryColor=8b5cf6&autoplay=true`; break;
                    case 'vidsrc': streamUrl = `https://vidsrc.su/embed/tv/${id}/${currentSeason}/${currentEpisode}`; break;
                    case 'embedsu': streamUrl = `https://embed.su/embed/tv/${id}/${currentSeason}/${currentEpisode}`; break;
                    case 'vidnest': streamUrl = `https://vidnest.fun/tv/${id}/${currentSeason}/${currentEpisode}`; break;
                    case '2embed': streamUrl = `https://www.2embed.cc/embedtv/${id}&s=${currentSeason}&e=${currentEpisode}`; break;
                    default: streamUrl = `https://vidlink.pro/tv/${id}/${currentSeason}/${currentEpisode}?primaryColor=8b5cf6&autoplay=true`;
                }
            }

            iframe.src = streamUrl;
        }

        function reloadPlayer() {
            const iframe = document.getElementById('streamIframe');
            iframe.src = iframe.src;
        }

        function togglePlayerFullscreen() {
            const modal = document.getElementById('playerModal');
            if (!document.fullscreenElement) {
                modal.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        function closePlayer() {
            const modal = document.getElementById('playerModal');
            const iframe = document.getElementById('streamIframe');
            modal.style.display = 'none';
            iframe.src = 'about:blank';
            currentItem = null;
        }

        document.addEventListener('DOMContentLoaded', initCinema);
    </script>
</body>
</html>
