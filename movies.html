<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12AM — Media</title>
    <meta name="description" content="Stream high-definition movies, TV series, and anime with instant Vidy proxy streaming on 12AM.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Supabase & 12AM Device Auth Core -->
    <script type="module" src="supabase-config.js"></script>
    <script src="device-auth.js"></script>

    <!-- 12AM Core Theme & Navigation -->
    <link rel="stylesheet" href="navigation.css">
    <script src="theme.js"></script>
    <script src="navigation.js" defer></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brandPurple: '#8b5cf6',
                        brandPurpleDark: '#7c3aed'
                    },
                    fontFamily: {
                        sans: ['Geist', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --bg-page: var(--bg-primary, #040404);
            --bg-card: var(--bg-secondary, #0c0c0e);
            --text-main: var(--text-primary, #ffffff);
            --text-muted: var(--text-secondary, #a1a1aa);
            --accent-color: var(--accent-primary, #8b5cf6);
            --accent-glow: var(--accent-secondary, rgba(139, 92, 246, 0.4));
            --border-main: var(--border-primary, #1c1c20);
            --border-faint: var(--border-secondary, rgba(255, 255, 255, 0.06));
            --btn-bg: var(--button-bg, rgba(139, 92, 246, 0.12));
            --navbar-bg: var(--bg-secondary, #09090b);
            --navbar-border: var(--border-primary, #27272a);
        }

        html, body, input, button, select, textarea {
            font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif !important;
        }

        .material-symbols-sharp {
            font-family: 'Material Symbols Sharp' !important;
            font-weight: normal;
            font-style: normal;
            font-size: 20px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: 'Geist', sans-serif !important;
            background-color: var(--bg-page);
            color: var(--text-main);
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            padding-top: 5.5rem;
            -webkit-font-smoothing: antialiased;
        }

        .cinema-wrapper {
            max-width: 1440px;
            width: 100%;
            margin: 0 auto;
            padding: 1.5rem 1.5rem 5rem;
            box-sizing: border-box;
        }

        /* Top Controls: 12AM Logo + Squircles */
        .top-cinema-bar {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1.25rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .movies-brand {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            user-select: none;
            line-height: 1;
        }

        .movies-logo-wrap {
            width: 36px;
            height: 36px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            flex-shrink: 0;
        }

        .movies-logo-img {
            height: 28px;
            width: auto;
            object-fit: contain;
            display: block;
            transition: filter 0.3s ease;
        }

        .movies-brand-title {
            font-size: 28px;
            font-weight: 500;
            line-height: 1;
            letter-spacing: -0.03em;
            color: var(--text-main);
            font-family: 'Geist', sans-serif;
            display: inline-flex;
            align-items: center;
        }

        /* Squircles Tabs & Controls */
        .cinema-squircle-tabs {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--bg-card);
            border: 1px solid var(--border-main);
            padding: 6px;
            border-radius: 20px;
        }

        .cinema-squircle-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            outline: none;
        }

        .cinema-squircle-btn:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.05);
        }

        .cinema-squircle-btn.active {
            background: var(--bg-card);
            color: var(--accent-color) !important;
            border-color: var(--accent-color);
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .cinema-squircle-btn.active:hover {
            background: var(--btn-bg);
            color: #ffffff !important;
        }

        .cinema-squircle-btn .material-symbols-sharp {
            font-size: 18px;
        }

        /* Squircle Search Box */
        .search-cinema-box {
            position: relative;
            min-width: 260px;
            flex-grow: 1;
            max-width: 400px;
        }

        .search-cinema-input {
            width: 100%;
            height: 44px;
            background: var(--bg-card);
            border: 1px solid var(--border-main);
            border-radius: 18px;
            padding: 8px 16px 8px 42px;
            color: var(--text-main);
            font-size: 13.5px;
            outline: none;
            transition: all 0.2s ease;
        }

        .search-cinema-input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .search-cinema-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 19px;
            pointer-events: none;
        }

        /* Hero Spotlight Banner */
        .spotlight-banner {
            position: relative;
            z-index: 1;
            border-radius: 18px;
            overflow: hidden;
            height: 420px;
            max-height: 420px;
            margin-bottom: 2.5rem;
            display: flex;
            align-items: flex-end;
            border: 1px solid var(--border-main);
            background: var(--bg-card);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1),
                        transform 0.35s cubic-bezier(0.16, 1, 0.3, 1),
                        max-height 0.38s cubic-bezier(0.16, 1, 0.3, 1),
                        margin-bottom 0.38s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .spotlight-banner.is-hidden-search {
            opacity: 0;
            transform: translateY(-28px);
            max-height: 0;
            margin-bottom: 0;
            border-width: 0;
            pointer-events: none;
        }

        html.light .spotlight-banner {
            box-shadow: 0 12px 32px rgba(15, 23, 42, 0.1);
            border-color: rgba(15, 23, 42, 0.12);
        }

        html.light .spotlight-gradient {
            background: linear-gradient(to top, rgba(248, 250, 252, 0.96) 0%, rgba(248, 250, 252, 0.72) 48%, rgba(248, 250, 252, 0.18) 100%),
                        linear-gradient(to right, rgba(248, 250, 252, 0.94) 0%, transparent 70%);
        }

        html.light .spotlight-title {
            color: #0f172a;
            text-shadow: none;
        }

        html.light .spotlight-meta {
            color: #334155;
        }

        html.light .spotlight-desc {
            color: #475569;
        }

        html.light .spotlight-badge {
            background: rgba(79, 70, 229, 0.12);
            border-color: rgba(79, 70, 229, 0.3);
            color: #4338ca;
        }

        .spotlight-backdrop {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.65);
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .spotlight-banner:hover .spotlight-backdrop {
            transform: scale(1.03);
        }

        .spotlight-gradient {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(4, 4, 4, 0.98) 0%, rgba(4, 4, 4, 0.6) 45%, rgba(4, 4, 4, 0.2) 100%),
                        linear-gradient(to right, rgba(4, 4, 4, 0.95) 0%, transparent 70%);
            z-index: 1;
        }

        .spotlight-content {
            position: relative;
            z-index: 2;
            padding: 2.5rem;
            max-width: 680px;
        }

        .spotlight-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 8px;
            background: rgba(139, 92, 246, 0.2);
            border: 1px solid rgba(139, 92, 246, 0.4);
            color: #d8b4fe;
            font-size: 0.75rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.85rem;
        }

        .spotlight-title {
            font-size: 2.35rem;
            font-weight: 500;
            line-height: 1.15;
            margin-bottom: 0.75rem;
            color: #ffffff;
            letter-spacing: -0.03em;
            text-shadow: 0 4px 14px rgba(0,0,0,0.8);
        }

        .spotlight-meta {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 0.85rem;
            color: #d4d4d8;
            margin-bottom: 1rem;
            font-weight: 500;
        }

        .spotlight-rating {
            color: #facc15;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .spotlight-desc {
            font-size: 0.92rem;
            line-height: 1.55;
            color: #a1a1aa;
            margin-bottom: 1.5rem;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .spotlight-btn-play {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 22px;
            border-radius: 16px;
            background: var(--accent-color);
            color: #ffffff;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            box-shadow: 0 10px 25px var(--accent-glow);
        }

        .spotlight-btn-play:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        html.theme-amoled-midnight .spotlight-btn-play,
        html.theme-amoled-midnight .spotlight-btn-play * {
            color: #000000 !important;
            fill: currentColor !important;
        }

        /* Media Grid */
        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1.35rem;
            width: 100%;
            box-sizing: border-box;
        }

        @media (max-width: 640px) {
            .media-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 1rem;
            }
            .spotlight-banner {
                height: 340px;
            }
            .spotlight-content {
                padding: 1.5rem;
            }
            .spotlight-title {
                font-size: 1.6rem;
            }
        }

        .media-card {
            background: var(--bg-card);
            border: 1px solid var(--border-main);
            border-radius: 14px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .media-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-color);
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.6), 0 0 18px var(--accent-glow);
        }

        .media-poster-wrap {
            position: relative;
            aspect-ratio: 2 / 3;
            width: 100%;
            overflow: hidden;
            background: #111115;
        }

        .media-poster {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .media-card:hover .media-poster {
            transform: scale(1.05);
        }

        .media-badge-rating {
            position: absolute;
            top: 8px;
            left: 8px;
            padding: 3px 7px;
            border-radius: 7px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.75rem;
            font-weight: 500;
            color: #facc15;
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .media-badge-type {
            position: absolute;
            top: 8px;
            right: 8px;
            padding: 3px 7px;
            border-radius: 7px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.7rem;
            font-weight: 500;
            color: #e4e4e7;
            text-transform: uppercase;
        }

        .media-info {
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex-grow: 1;
            justify-content: space-between;
        }

        .media-title {
            font-size: 0.88rem;
            font-weight: 500;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .media-meta-row {
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Fullscreen Player Modal (Vidy Integration) */
        #playerModal {
            position: fixed;
            inset: 0;
            z-index: 10000;
            background: #000000;
            display: none;
            flex-direction: column;
        }

        .player-bar {
            height: 56px;
            background: var(--navbar-bg, var(--bg-secondary, #09090b)) !important;
            border-bottom: 1px solid var(--navbar-border, var(--border-primary, #27272a)) !important;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            flex-shrink: 0;
            position: relative;
            color: var(--text-main, #ffffff);
        }

        .player-left, .player-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .player-btn-squircle {
            width: 36px;
            height: 36px;
            border-radius: 11px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-card, var(--bg-secondary, #18181b));
            border: 1px solid var(--border-primary, #27272a);
            color: var(--text-main, #fafafa);
            cursor: pointer;
            transition: all 0.15s ease;
            padding: 0;
            flex-shrink: 0;
            outline: none;
        }

        .player-btn-squircle:hover {
            background: var(--button-bg, rgba(255, 255, 255, 0.1));
            border-color: var(--accent-primary, #8b5cf6);
            color: var(--accent-primary, #ffffff);
            box-shadow: 0 0 12px var(--accent-glow, rgba(139, 92, 246, 0.3));
            transform: translateY(-1px);
        }

        .player-btn-squircle:active {
            transform: scale(0.94);
        }

        .player-btn-squircle.btn-close:hover {
            background: rgba(239, 68, 68, 0.2);
            border-color: #ef4444;
            color: #ef4444;
        }

        .player-btn-squircle .material-symbols-sharp {
            font-size: 20px;
        }

        .player-title {
            font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif !important;
            font-size: 13.5px;
            font-weight: 500;
            color: var(--text-main, #f4f4f5) !important;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 320px;
            padding: 5px 14px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-primary, rgba(255, 255, 255, 0.1));
            border-radius: 11px;
            letter-spacing: -0.01em;
            display: inline-flex;
            align-items: center;
        }

        .select-dark {
            height: 36px;
            background: var(--bg-card, var(--bg-secondary, #18181b));
            border: 1px solid var(--border-primary, #27272a);
            color: var(--text-main, #ffffff);
            font-size: 13px;
            font-weight: 500;
            padding: 0 10px;
            border-radius: 11px;
            outline: none;
            cursor: pointer;
            transition: border-color 0.15s ease;
        }

        .select-dark:focus {
            border-color: var(--accent-primary, #8b5cf6);
        }

        .player-frame-area {
            flex: 1;
            width: 100%;
            height: 100%;
            background: #000000;
            position: relative;
        }

        #streamIframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: #000000;
        }

        /* Home View Media Rows (Horizontal Scrolling Trending Rows) */
        .media-grid.trending-mode {
            display: flex;
            flex-direction: column;
            gap: 2.25rem;
            width: 100%;
        }

        .media-row-section {
            width: 100%;
            margin-bottom: 0.5rem;
        }

        .media-row-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border-faint);
        }

        .media-row-title {
            font-size: 1.15rem;
            font-weight: 500;
            color: var(--text-main);
            letter-spacing: -0.01em;
        }

        .media-row-scroll {
            display: flex;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-snap-type: x mandatory;
            gap: 1.15rem;
            padding: 18px 16px 26px 16px;
            margin: -18px -16px -10px -16px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.15) transparent;
        }

        .media-row-scroll::-webkit-scrollbar {
            height: 6px;
        }
        .media-row-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .media-row-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.18);
            border-radius: 9999px;
        }
        .media-row-scroll::-webkit-scrollbar-thumb:hover {
            background: var(--accent-color);
        }

        .media-row-scroll .media-card {
            flex: 0 0 175px;
            width: 175px;
            max-width: 175px;
            scroll-snap-align: start;
        }

        /* Minimal clean centered footer */
        .cinema-footer {
            margin-top: 5rem;
            border-top: 1px solid var(--border-faint);
            padding: 2rem 1.5rem;
            background: transparent;
        }

        .cinema-footer-inner {
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="cinema-wrapper">
        <!-- Topbar: 12AM Logo + "media" Left | Squircles & Search Right -->
        <div class="top-cinema-bar">
            <div class="movies-brand">
                <div class="movies-logo-wrap">
                    <img src="images/logo-white.png" alt="12AM Logo" class="movies-logo-img navbar-logo" id="movies-page-logo">
                </div>
                <span class="movies-brand-title">media</span>
            </div>

            <!-- Squircles on Right Side -->
            <div class="flex items-center gap-3 flex-wrap">
                <div class="cinema-squircle-tabs">
                    <button class="cinema-squircle-btn active" data-tab="trending" onclick="switchCinemaTab('trending')">
                        <span class="material-symbols-sharp">trending_up</span>
                        <span>Trending</span>
                    </button>
                    <button class="cinema-squircle-btn" data-tab="movie" onclick="switchCinemaTab('movie')">
                        <span class="material-symbols-sharp">movie</span>
                        <span>Movies</span>
                    </button>
                    <button class="cinema-squircle-btn" data-tab="tv" onclick="switchCinemaTab('tv')">
                        <span class="material-symbols-sharp">tv</span>
                        <span>Series</span>
                    </button>
                    <button class="cinema-squircle-btn" data-tab="anime" onclick="switchCinemaTab('anime')">
                        <span class="material-symbols-sharp">animation</span>
                        <span>Anime</span>
                    </button>
                </div>

                <div class="search-cinema-box">
                    <span class="material-symbols-sharp search-cinema-icon">search</span>
                    <input type="text" id="cinemaSearchInput" class="search-cinema-input" placeholder="Search movies, series, animes..." autocomplete="off">
                </div>
            </div>
        </div>

        <!-- Featured Spotlight Hero -->
        <div class="spotlight-banner" id="spotlightBanner">
            <img id="spotlightBackdrop" class="spotlight-backdrop" src="" alt="">
            <div class="spotlight-gradient"></div>
            <div class="spotlight-content">
                <div class="spotlight-badge" id="spotlightBadge">Featured Spotlight</div>
                <h1 class="spotlight-title" id="spotlightTitle">Loading cinema...</h1>
                <div class="spotlight-meta">
                    <span class="spotlight-rating" id="spotlightRating">
                        <span class="material-symbols-sharp text-base text-yellow-400">star</span>
                        <span id="spotlightRatingVal">8.5</span>
                    </span>
                    <span id="spotlightYear">2026</span>
                    <span id="spotlightType">Movie</span>
                </div>
                <p class="spotlight-desc" id="spotlightDesc">Connecting to Vidy high-speed proxy gateway...</p>
                <button class="spotlight-btn-play" id="spotlightPlayBtn">
                    <span class="material-symbols-sharp">play_arrow</span>
                    <span>Watch Now</span>
                </button>
            </div>
        </div>

        <!-- Media Grid Section -->
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-xl font-bold tracking-tight text-[var(--text-main)]" id="gridHeading">Trending Worldwide</h2>
            <span class="text-xs text-[var(--text-muted)] font-mono" id="resultsCount" style="display: none;"></span>
        </div>

        <div class="media-grid" id="cinemaGrid"></div>
    </div>

    <!-- Fullscreen Player Modal (Vidy Stream Integration) -->
    <div id="playerModal">
        <div class="player-bar">
            <div class="player-left">
                <button class="player-btn-squircle" onclick="closePlayer()" title="Back to Catalog">
                    <span class="material-symbols-sharp">arrow_back</span>
                </button>
                <span class="player-title" id="playerTitle">Streaming Media</span>
            </div>

            <div class="player-right">
                <!-- TV / Episode Selectors (Hidden on Movies/Anime with Vidy auto-controls) -->
                <div id="tvSelectors" style="display: none;" class="flex items-center gap-2">
                    <select id="seasonSelect" class="select-dark" onchange="handleSeasonChange()"></select>
                    <select id="episodeSelect" class="select-dark" onchange="handleEpisodeChange()"></select>
                </div>

                <!-- Server Selector -->
                <select id="serverSelect" class="select-dark" onchange="changeServer()">
                    <option value="vidlink" selected>Server 1 (VidLink HD)</option>
                    <option value="vidy">Server 2 (Vidy Player)</option>
                    <option value="vidsrc">Server 3 (VidSrc Fast)</option>
                    <option value="multiembed">Server 4 (MultiEmbed)</option>
                    <option value="autoembed">Server 5 (AutoEmbed)</option>
                </select>

                <button class="player-btn-squircle" onclick="reloadPlayer()" title="Reload Stream">
                    <span class="material-symbols-sharp">refresh</span>
                </button>
                <button class="player-btn-squircle" onclick="togglePlayerFullscreen()" title="Fullscreen">
                    <span class="material-symbols-sharp">fullscreen</span>
                </button>
                <button class="player-btn-squircle btn-close" onclick="closePlayer()" title="Close">
                    <span class="material-symbols-sharp">close</span>
                </button>
            </div>
        </div>

        <div class="player-frame-area">
            <iframe id="streamIframe" allow="encrypted-media; autoplay *; fullscreen *; clipboard-write; picture-in-picture"></iframe>
        </div>
    </div>

    <!-- Minimal Centered Footer -->
    <footer class="cinema-footer">
        <div class="cinema-footer-inner">
            <img src="images/logo-white.png" class="h-5 w-auto opacity-70" alt="12AM">
            <span class="text-xs text-[var(--text-muted)]">&copy; 2026 12AM. All rights reserved.</span>
            <span class="text-xs text-[var(--text-muted)] opacity-30">•</span>
            <a href="legal.html" class="text-xs text-[var(--text-muted)] hover:text-[var(--accent-color)] transition-colors">Terms &amp; Policies</a>
        </div>
    </footer>

    <script>
        const TMDB_KEY = "1cf50e6248dc270629e802686245c2c8";
        const TMDB_BASE = "https://api.themoviedb.org/3";
        const IMG_W500 = "https://image.tmdb.org/t/p/w500";
        const IMG_ORIGINAL = "https://image.tmdb.org/t/p/original";

        let currentActiveTab = 'trending';
        let currentItem = null;
        let currentSeason = 1;
        let currentEpisode = 1;
        let tvSeasonsData = [];

        // Safe cinema items registry to avoid escaping / JSON serialization issues in onclick attributes
        window._cinemaItems = window._cinemaItems || new Map();
        function openCinemaItem(id) {
            const item = window._cinemaItems.get(String(id));
            if (item) {
                openPlayer(item);
            }
        }

        // Format ratings strictly to nearest tenth (e.g., 8.8, 8.0)
        function formatRating(val, fallback = '8.0') {
            const num = parseFloat(val);
            if (isNaN(num) || num <= 0) return fallback;
            return num.toFixed(1);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function stripHtml(html) {
            if (!html) return '';
            return String(html).replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
        }

        function getThemeAccentHex() {
            let hex = '8b5cf6';
            if (typeof window.getCurrentTheme === 'function') {
                const t = window.getCurrentTheme();
                if (t && t['accent-primary']) {
                    hex = t['accent-primary'].replace('#', '').trim();
                }
            }
            return hex;
        }

        async function fetchWithProxyFallback(url, options = {}) {
            try {
                const res = await fetch(url, options);
                if (res.ok) return res;
            } catch (e) {}
            if (typeof window !== 'undefined' && window.location && window.location.protocol.startsWith('http')) {
                return await fetch(`/api/proxy?url=${encodeURIComponent(url)}`, options);
            }
            throw new Error(`Failed to fetch ${url}`);
        }

        function proxyFallbackImg(img) {
            if (!img || img.dataset.proxied === '1') {
                if (img) img.style.display = 'none';
                return;
            }
            img.dataset.proxied = '1';
            const src = img.getAttribute('src') || '';
            if (/^https?:\/\//i.test(src) && typeof window !== 'undefined' && window.location && window.location.protocol.startsWith('http')) {
                img.src = `/api/proxy?url=${encodeURIComponent(src)}`;
            } else {
                img.src = 'images/logo-white.png';
            }
        }

        // Fetch TMDB Helper
        async function fetchTMDB(endpoint, params = {}) {
            const queryParams = new URLSearchParams({
                api_key: TMDB_KEY,
                language: 'en-US',
                ...params
            });
            const url = `${TMDB_BASE}${endpoint}?${queryParams.toString()}`;
            try {
                const res = await fetchWithProxyFallback(url);
                if (!res.ok) return null;
                return await res.json();
            } catch(e) {
                console.warn('TMDB Fetch Error:', e);
                return null;
            }
        }

        // Initialize Cinema Hub
        async function initCinema() {
            loadTrending();
            setupSearch();
            applyThemeLogo();
        }

        function applyThemeLogo() {
            const logo = document.getElementById('movies-page-logo');
            if (!logo) return;
            const t = typeof window.getCurrentTheme === 'function' ? window.getCurrentTheme() : null;
            if (!t) return;
            const noFilterThemes = ['Dark', 'Light', 'Christmas'];
            if (noFilterThemes.includes(t.name)) {
                logo.style.filter = '';
                logo.style.transform = '';
            } else {
                const tint = t['accent-primary'] || '#8b5cf6';
                logo.style.filter = `drop-shadow(100px 0 0 ${tint})`;
                logo.style.transform = 'translateX(-100px)';
            }
        }

        window.addEventListener('12am:theme-changed', applyThemeLogo);

        // Load Trending Worldwide with 3 Dedicated Rows: Top Movies, Top TV Series, Top Anime
        async function loadTrending() {
            const headingEl = document.getElementById('gridHeading');
            const countEl = document.getElementById('resultsCount');
            const grid = document.getElementById('cinemaGrid');

            grid.className = 'media-grid trending-mode';
            if (headingEl) headingEl.style.display = 'none';
            if (countEl) countEl.style.display = 'none';

            grid.innerHTML = '<div class="py-12 text-center text-sm text-[var(--text-muted)]"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Loading cinema rows...</div>';

            const [moviesRes, tvRes, animeList] = await Promise.all([
                fetchTMDB('/movie/popular'),
                fetchTMDB('/tv/popular'),
                fetchAnimeData()
            ]);

            const topMovies = (moviesRes?.results || []).map(i => ({ ...i, media_type: 'movie' }));
            const topTV = (tvRes?.results || []).map(i => ({ ...i, media_type: 'tv' }));
            const topAnime = animeList || [];

            if (topMovies.length > 0) {
                renderSpotlight(topMovies[0]);
            }

            grid.innerHTML = `
                <div class="media-row-section">
                    <div class="media-row-header">
                        <h2 class="media-row-title">Top Movies</h2>
                        <button class="text-xs text-[var(--accent-color)] hover:underline cursor-pointer bg-transparent border-0" onclick="switchCinemaTab('movie')">View All</button>
                    </div>
                    <div class="media-row-scroll">
                        ${topMovies.slice(0, 10).map(item => createMediaCardHTML(item)).join('')}
                    </div>
                </div>

                <div class="media-row-section">
                    <div class="media-row-header">
                        <h2 class="media-row-title">Top TV Series</h2>
                        <button class="text-xs text-[var(--accent-color)] hover:underline cursor-pointer bg-transparent border-0" onclick="switchCinemaTab('tv')">View All</button>
                    </div>
                    <div class="media-row-scroll">
                        ${topTV.slice(0, 10).map(item => createMediaCardHTML(item)).join('')}
                    </div>
                </div>

                <div class="media-row-section">
                    <div class="media-row-header">
                        <h2 class="media-row-title">Top Anime</h2>
                        <button class="text-xs text-[var(--accent-color)] hover:underline cursor-pointer bg-transparent border-0" onclick="switchCinemaTab('anime')">View All</button>
                    </div>
                    <div class="media-row-scroll">
                        ${topAnime.slice(0, 10).map(item => createMediaCardHTML(item)).join('')}
                    </div>
                </div>
            `;
        }

        // Load Movies (Multi-page for full-width expansive catalog)
        async function loadMovies() {
            const [p1, p2] = await Promise.all([
                fetchTMDB('/movie/popular', { page: 1 }),
                fetchTMDB('/movie/popular', { page: 2 })
            ]);
            const results = [...(p1?.results || []), ...(p2?.results || [])];
            if (results.length === 0) return;
            const items = results.map(i => ({ ...i, media_type: 'movie' }));
            if (items.length > 0) renderSpotlight(items[0]);
            renderGrid(items, 'Popular Movies');
        }

        // Load TV Series (Multi-page for full-width expansive catalog)
        async function loadTV() {
            const [p1, p2] = await Promise.all([
                fetchTMDB('/tv/popular', { page: 1 }),
                fetchTMDB('/tv/popular', { page: 2 })
            ]);
            const results = [...(p1?.results || []), ...(p2?.results || [])];
            if (results.length === 0) return;
            const items = results.map(i => ({ ...i, media_type: 'tv' }));
            if (items.length > 0) renderSpotlight(items[0]);
            renderGrid(items, 'Popular TV Series');
        }

        // Fetch Anime Data (Official AniList GraphQL API as required by Vidy /anime/{anilistId}/{episode})
        async function fetchAnimeData() {
            const query = `
            query ($page: Int) {
                Page(page: $page, perPage: 25) {
                    media(type: ANIME, sort: TRENDING_DESC) {
                        id
                        idMal
                        title {
                            romaji
                            english
                        }
                        coverImage {
                            large
                            extraLarge
                        }
                        bannerImage
                        averageScore
                        description(asHtml: false)
                        episodes
                        startDate {
                            year
                        }
                    }
                }
            }`;
            try {
                const [r1, r2] = await Promise.all([
                    fetchWithProxyFallback('https://graphql.anilist.co', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ query, variables: { page: 1 } })
                    }),
                    fetchWithProxyFallback('https://graphql.anilist.co', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ query, variables: { page: 2 } })
                    })
                ]);
                const [j1, j2] = await Promise.all([r1.json(), r2.json()]);
                const media = [...(j1?.data?.Page?.media || []), ...(j2?.data?.Page?.media || [])];
                if (media.length > 0) {
                    return media.map(a => ({
                        id: a.id,
                        anilistId: a.id,
                        idMal: a.idMal,
                        title: a.title.english || a.title.romaji,
                        name: a.title.english || a.title.romaji,
                        poster_path: a.coverImage.extraLarge || a.coverImage.large,
                        backdrop_path: a.bannerImage || a.coverImage.extraLarge,
                        vote_average: a.averageScore ? formatRating(a.averageScore / 10, '8.6') : '8.6',
                        release_date: a.startDate?.year ? String(a.startDate.year) : 'Anime',
                        overview: stripHtml(a.description) || 'Watch anime on 12AM Vidy nodes.',
                        media_type: 'anime',
                        isAnime: true,
                        totalEpisodes: a.episodes || 24
                    }));
                }
            } catch(e) {
                console.warn('AniList Anime Error:', e);
            }
            return [];
        }

        // Load Anime
        async function loadAnime() {
            const items = await fetchAnimeData();
            if (items.length > 0) renderSpotlight(items[0]);
            renderGrid(items, 'Trending Anime');
        }

        // Switch Tabs
        function switchCinemaTab(tab) {
            currentActiveTab = tab;
            document.querySelectorAll('.cinema-squircle-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tab === tab);
            });

            if (tab === 'trending') loadTrending();
            else if (tab === 'movie') loadMovies();
            else if (tab === 'tv') loadTV();
            else if (tab === 'anime') loadAnime();
        }

        // Spotlight
        function renderSpotlight(item) {
            if (!item) return;
            const backdrop = document.getElementById('spotlightBackdrop');
            const titleEl = document.getElementById('spotlightTitle');
            const ratingVal = document.getElementById('spotlightRatingVal');
            const yearEl = document.getElementById('spotlightYear');
            const typeEl = document.getElementById('spotlightType');
            const descEl = document.getElementById('spotlightDesc');
            const playBtn = document.getElementById('spotlightPlayBtn');

            const isAnime = Boolean(item.isAnime || item.media_type === 'anime');
            const isMovie = !isAnime && (item.media_type === 'movie' || Boolean(item.title && !item.first_air_date && !item.name));
            const title = item.title || item.name || 'Untitled';
            const year = isAnime ? 'Anime' : (item.release_date || item.first_air_date || '2026').slice(0, 4);
            const rating = formatRating(item.vote_average, '8.5');

            backdrop.dataset.proxied = '';
            backdrop.style.display = '';
            backdrop.onerror = function() { proxyFallbackImg(this); };
            if (item.backdrop_path) {
                backdrop.src = item.backdrop_path.startsWith('http') ? item.backdrop_path : `${IMG_ORIGINAL}${item.backdrop_path}`;
            } else if (item.poster_path) {
                backdrop.src = item.poster_path.startsWith('http') ? item.poster_path : `${IMG_W500}${item.poster_path}`;
            }

            titleEl.textContent = title;
            if (ratingVal) ratingVal.textContent = rating;
            yearEl.textContent = year;
            typeEl.textContent = isAnime ? 'Anime Series' : (isMovie ? 'Movie' : 'TV Series');
            descEl.textContent = item.overview || 'High-definition streaming provided through 12AM Vidy nodes.';

            playBtn.onclick = () => openPlayer(item);
        }

        function createMediaCardHTML(item) {
            if (!item || !item.id) return '';
            window._cinemaItems.set(String(item.id), item);

            const isAnime = Boolean(item.isAnime || item.media_type === 'anime');
            const isMovie = !isAnime && (item.media_type === 'movie' || Boolean(item.title && !item.first_air_date && !item.name));
            const rawTitle = item.title || item.name || 'Untitled';
            const title = escapeHtml(rawTitle);
            const year = isAnime ? 'Anime' : (item.release_date || item.first_air_date || '2026').slice(0, 4);
            const rating = formatRating(item.vote_average, '8.0');
            
            let poster = 'images/logo-white.png';
            if (item.poster_path) {
                poster = item.poster_path.startsWith('http') ? item.poster_path : `${IMG_W500}${item.poster_path}`;
            }

            return `
                <div class="media-card" onclick="openCinemaItem('${item.id}')">
                    <div class="media-poster-wrap">
                        <img src="${poster}" alt="${title}" class="media-poster" loading="lazy" onerror="proxyFallbackImg(this)">
                        <span class="media-badge-rating">
                            <span class="material-symbols-sharp text-[13px] text-yellow-400">star</span>
                            <span>${rating}</span>
                        </span>
                        <span class="media-badge-type">${isAnime ? 'Anime' : (isMovie ? 'Movie' : 'TV')}</span>
                    </div>
                    <div class="media-info">
                        <h3 class="media-title" title="${title}">${title}</h3>
                        <div class="media-meta-row">
                            <span>${year}</span>
                            <span class="text-[var(--accent-color)] font-medium inline-flex items-center gap-1">
                                <span class="material-symbols-sharp text-[14px]">play_arrow</span>Watch
                            </span>
                        </div>
                    </div>
                </div>
            `;
        }

        // Render Media Grid (Full width catalog, title count indicator removed)
        function renderGrid(items, heading) {
            const grid = document.getElementById('cinemaGrid');
            grid.className = 'media-grid';
            const headingEl = document.getElementById('gridHeading');
            const countEl = document.getElementById('resultsCount');

            if (headingEl) {
                headingEl.style.display = 'block';
                headingEl.textContent = heading;
            }
            if (countEl) {
                countEl.style.display = 'none';
                countEl.textContent = '';
            }

            grid.innerHTML = items.map(item => createMediaCardHTML(item)).join('');
        }

        // Search Setup
        function setupSearch() {
            const input = document.getElementById('cinemaSearchInput');
            let debounceTimer = null;

            window.addEventListener('keydown', (e) => {
                if (e.key === '/' && !['INPUT', 'TEXTAREA'].includes(e.target.tagName)) {
                    e.preventDefault();
                    input.focus();
                }
            });

            input.addEventListener('input', () => {
                clearTimeout(debounceTimer);
                const bannerEl = document.getElementById('spotlightBanner');
                const immediateQ = input.value.trim();
                if (bannerEl) {
                    bannerEl.classList.toggle('is-hidden-search', Boolean(immediateQ));
                }
                debounceTimer = setTimeout(async () => {
                    const q = input.value.trim();
                    if (!q) {
                        if (bannerEl) bannerEl.classList.remove('is-hidden-search');
                        switchCinemaTab(currentActiveTab);
                        return;
                    }
                    if (currentActiveTab === 'anime') {
                        const animeResults = await searchAnime(q);
                        renderGrid(animeResults, `Anime: "${q}"`);
                    } else {
                        const data = await fetchTMDB('/search/multi', { query: q });
                        if (!data || !data.results) return;
                        const items = data.results.filter(i => (i.title || i.name) && (i.poster_path || i.backdrop_path));
                        renderGrid(items, `Search: "${q}"`);
                    }
                }, 350);
            });
        }

        async function searchAnime(query) {
            const gql = `
            query ($search: String) {
                Page(page: 1, perPage: 30) {
                    media(type: ANIME, search: $search, sort: SEARCH_MATCH) {
                        id
                        idMal
                        title {
                            romaji
                            english
                        }
                        coverImage {
                            large
                            extraLarge
                        }
                        bannerImage
                        averageScore
                        description(asHtml: false)
                        episodes
                        startDate {
                            year
                        }
                    }
                }
            }`;
            try {
                const res = await fetchWithProxyFallback('https://graphql.anilist.co', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: gql, variables: { search: query } })
                });
                const json = await res.json();
                const media = json?.data?.Page?.media || [];
                return media.map(a => ({
                    id: a.id,
                    anilistId: a.id,
                    idMal: a.idMal,
                    title: a.title.english || a.title.romaji,
                    name: a.title.english || a.title.romaji,
                    poster_path: a.coverImage.extraLarge || a.coverImage.large,
                    backdrop_path: a.bannerImage || a.coverImage.extraLarge,
                    vote_average: a.averageScore ? formatRating(a.averageScore / 10, '8.0') : '8.0',
                    release_date: a.startDate?.year ? String(a.startDate.year) : 'Anime',
                    overview: stripHtml(a.description) || 'Watch anime on 12AM Vidy nodes.',
                    media_type: 'anime',
                    isAnime: true,
                    totalEpisodes: a.episodes || 24
                }));
            } catch(e) {
                console.warn('AniList Anime Search Error:', e);
                return [];
            }
        }

        // --- STREAMING PLAYER LOGIC (Multi-Server Streaming API) ---
        async function openPlayer(item) {
            currentItem = item;
            const modal = document.getElementById('playerModal');
            const titleEl = document.getElementById('playerTitle');
            const tvSelectors = document.getElementById('tvSelectors');
            const serverSelect = document.getElementById('serverSelect');

            const isAnime = Boolean(item.isAnime || item.media_type === 'anime');
            const isMovie = !isAnime && (item.media_type === 'movie' || Boolean(item.title && !item.first_air_date && !item.name));
            const title = item.title || item.name || 'Untitled';
            titleEl.textContent = title;

            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden';

            currentSeason = 1;
            currentEpisode = 1;

            if (isAnime) {
                // Populate anime episodes up to real episode count
                const count = item.totalEpisodes || 24;
                const seasonSelect = document.getElementById('seasonSelect');
                const epSelect = document.getElementById('episodeSelect');
                seasonSelect.innerHTML = '<option value="1">Season 1</option>';
                epSelect.innerHTML = '';
                const maxEpisodes = Math.min(count, 150);
                for (let i = 1; i <= maxEpisodes; i++) {
                    const opt = document.createElement('option');
                    opt.value = i;
                    opt.textContent = `Episode ${i}`;
                    epSelect.appendChild(opt);
                }
                tvSelectors.style.display = 'flex';

                // Look up TMDB ID asynchronously for anime so servers 3 and 4 work too
                if (!item.tmdbId) {
                    fetchTMDB('/search/tv', { query: item.title }).then(res => {
                        if (res?.results?.[0]?.id) {
                            item.tmdbId = res.results[0].id;
                        }
                    }).catch(() => {});
                }

                // Default to VidLink for anime since Vidy's anime backend has upstream Cloudflare blocks
                if (serverSelect) serverSelect.value = 'vidlink';
                updatePlayerSource();
            } else if (!isMovie) {
                tvSelectors.style.display = 'flex';
                await loadTVSeasons(item.id);
            } else {
                tvSelectors.style.display = 'none';
                updatePlayerSource();
            }
        }

        async function loadTVSeasons(tvId) {
            const data = await fetchTMDB(`/tv/${tvId}`);
            const seasonSelect = document.getElementById('seasonSelect');
            seasonSelect.innerHTML = '';

            if (data && data.seasons) {
                tvSeasonsData = data.seasons.filter(s => s.season_number > 0);
                tvSeasonsData.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s.season_number;
                    opt.textContent = `Season ${s.season_number}`;
                    seasonSelect.appendChild(opt);
                });
            } else {
                seasonSelect.innerHTML = `<option value="1">Season 1</option>`;
            }

            currentSeason = 1;
            handleSeasonChange();
        }

        function handleSeasonChange() {
            const seasonSelect = document.getElementById('seasonSelect');
            currentSeason = parseInt(seasonSelect.value, 10) || 1;

            const epSelect = document.getElementById('episodeSelect');
            epSelect.innerHTML = '';

            const seasonObj = tvSeasonsData.find(s => s.season_number === currentSeason);
            const epCount = seasonObj ? seasonObj.episode_count : 24;

            for (let i = 1; i <= epCount; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = `Episode ${i}`;
                epSelect.appendChild(opt);
            }

            currentEpisode = 1;
            updatePlayerSource();
        }

        function handleEpisodeChange() {
            const epSelect = document.getElementById('episodeSelect');
            currentEpisode = parseInt(epSelect.value, 10) || 1;
            updatePlayerSource();
        }

        function changeServer() {
            updatePlayerSource();
        }

        function updatePlayerSource() {
            if (!currentItem) return;
            const iframe = document.getElementById('streamIframe');
            const server = document.getElementById('serverSelect').value;
            const isAnime = Boolean(currentItem.isAnime || currentItem.media_type === 'anime');
            const isMovie = !isAnime && (currentItem.media_type === 'movie' || Boolean(currentItem.title && !currentItem.first_air_date && !currentItem.name));
            const id = currentItem.id;
            const anilistId = currentItem.anilistId || id;
            const malId = currentItem.idMal || anilistId;
            const tmdbId = currentItem.tmdbId;
            const color = getThemeAccentHex();
            const season = currentSeason || 1;
            const episode = currentEpisode || 1;

            let streamUrl = '';

            if (server === 'vidlink') {
                if (isAnime) {
                    streamUrl = `https://vidlink.pro/anime/${malId}/${episode}/sub?fallback=true&primaryColor=${color}&autoplay=true`;
                } else if (isMovie) {
                    streamUrl = `https://vidlink.pro/movie/${id}?primaryColor=${color}&autoplay=true`;
                } else {
                    streamUrl = `https://vidlink.pro/tv/${id}/${season}/${episode}?primaryColor=${color}&autoplay=true`;
                }
            } else if (server === 'vidy') {
                if (isAnime) {
                    // Official Vidy Anime route according to Vidy docs: /anime/{anilistId}/{episode}
                    streamUrl = `https://www.vidy.st/anime/${anilistId}/${episode}?color=${color}&nextEpisode=true&episodeSelector=true`;
                } else if (isMovie) {
                    streamUrl = `https://www.vidy.st/movie/${id}?color=${color}&autoplay=true`;
                } else {
                    streamUrl = `https://www.vidy.st/tv/${id}/${season}/${episode}?color=${color}&nextEpisode=true&episodeSelector=true&autoplayNextEpisode=true`;
                }
            } else if (server === 'vidsrc') {
                if (isAnime) {
                    if (tmdbId) {
                        streamUrl = `https://vidsrc.su/embed/tv/${tmdbId}/${season}/${episode}`;
                    } else {
                        streamUrl = `https://vidlink.pro/anime/${malId}/${episode}/sub?fallback=true&primaryColor=${color}&autoplay=true`;
                    }
                } else if (isMovie) {
                    streamUrl = `https://vidsrc.su/embed/movie/${id}`;
                } else {
                    streamUrl = `https://vidsrc.su/embed/tv/${id}/${season}/${episode}`;
                }
            } else if (server === 'multiembed') {
                if (isAnime) {
                    if (tmdbId) {
                        streamUrl = `https://multiembed.mov/?video_id=${tmdbId}&tmdb=1&s=${season}&e=${episode}`;
                    } else {
                        streamUrl = `https://vidlink.pro/anime/${malId}/${episode}/sub?fallback=true&primaryColor=${color}&autoplay=true`;
                    }
                } else if (isMovie) {
                    streamUrl = `https://multiembed.mov/?video_id=${id}&tmdb=1`;
                } else {
                    streamUrl = `https://multiembed.mov/?video_id=${id}&tmdb=1&s=${season}&e=${episode}`;
                }
            } else {
                if (isAnime) {
                    if (tmdbId) {
                        streamUrl = `https://autoembed.co/tv/tmdb/${tmdbId}-${season}-${episode}`;
                    } else {
                        streamUrl = `https://vidlink.pro/anime/${malId}/${episode}/sub?fallback=true&primaryColor=${color}&autoplay=true`;
                    }
                } else if (isMovie) {
                    streamUrl = `https://autoembed.co/movie/tmdb/${id}`;
                } else {
                    streamUrl = `https://autoembed.co/tv/tmdb/${id}-${season}-${episode}`;
                }
            }

            iframe.removeAttribute('srcdoc');
            if (window.location.protocol.startsWith('http')) {
                iframe.src = `/api/web?mode=browse&embed=1&url=${encodeURIComponent(streamUrl)}`;
            } else {
                iframe.src = streamUrl;
            }
        }

        function reloadPlayer() {
            const iframe = document.getElementById('streamIframe');
            if (iframe.src) iframe.src = iframe.src;
        }

        function togglePlayerFullscreen() {
            const modal = document.getElementById('playerModal');
            if (!document.fullscreenElement) {
                modal.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        function closePlayer() {
            const modal = document.getElementById('playerModal');
            const iframe = document.getElementById('streamIframe');
            modal.style.display = 'none';
            document.body.style.overflow = '';
            iframe.src = 'about:blank';
        }

        document.addEventListener('DOMContentLoaded', initCinema);
    </script>
</body>
</html>
