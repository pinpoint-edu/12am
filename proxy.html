<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>12AM — Web Proxy</title>
  <meta name="description" content="Fast, private web browsing and proxy on 12AM.">

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <!-- 12AM Core Theme & Navigation -->
  <link rel="stylesheet" href="navigation.css">
  <script src="theme.js"></script>
  <script src="device-auth.js"></script>
  <script src="navigation.js" defer></script>

  <style>
    html, body {
      height: 100%;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    body {
      padding-top: var(--navbar-height);
      display: flex;
      flex-direction: column;
      background: var(--bg-page);
    }

    .proxy-layout {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: calc(100vh - var(--navbar-height));
      overflow: hidden;
    }

    /* Proxy Omnibox Toolbar */
    .proxy-toolbar {
      height: 48px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-main);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 1rem;
      flex-shrink: 0;
    }

    .proxy-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--border-faint);
      border: 1px solid var(--border-main);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.15s ease;
    }

    .proxy-btn:hover {
      border-color: var(--accent-color);
      color: var(--text-main);
    }

    .proxy-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      border-color: var(--border-main);
    }

    .omnibox-form {
      flex: 1;
      display: flex;
      align-items: center;
      background: var(--bg-page);
      border: 1px solid var(--border-main);
      border-radius: 12px;
      padding: 4px 12px;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .omnibox-form:focus-within {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 2px var(--accent-glow);
    }

    .omnibox-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 0.88rem;
      font-family: inherit;
    }

    .omnibox-go-btn {
      background: var(--accent-color);
      border: none;
      color: #ffffff;
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* Viewport & Start Screen */
    .proxy-workspace {
      flex: 1;
      position: relative;
      background: #000000;
      overflow: hidden;
    }

    .proxy-start-screen {
      position: absolute;
      inset: 0;
      background: var(--bg-page);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      z-index: 5;
    }

    .proxy-hero {
      text-align: center;
      margin-bottom: 2rem;
    }

    .proxy-logo {
      height: 48px;
      width: auto;
      object-fit: contain;
      margin: 0 auto 1.25rem;
      display: block;
      opacity: 0.95;
    }

    .proxy-title {
      font-size: 2.25rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin: 0 0 0.5rem;
      color: var(--text-main);
    }

    .proxy-subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin: 0;
      font-weight: 300;
    }

    /* Minimalist Center Search */
    .proxy-center-search {
      width: 100%;
      max-width: 580px;
      display: flex;
      align-items: center;
      background: var(--bg-card);
      border: 1px solid var(--border-main);
      border-radius: 9999px;
      padding: 0.6rem 0.8rem 0.6rem 1.25rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      transition: all 0.25s ease;
      gap: 10px;
    }

    .proxy-center-search:focus-within {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .proxy-center-search i {
      color: var(--text-muted);
      font-size: 15px;
    }

    .proxy-center-search input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 1rem;
      font-family: inherit;
    }

    .proxy-center-search input::placeholder {
      color: var(--text-muted);
      opacity: 0.7;
    }

    .proxy-center-search button {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--accent-color);
      border: none;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 13px;
    }

    .proxy-center-search button:hover {
      background: #7c3aed;
      transform: scale(1.05);
    }

    #proxyViewport {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body class="grid-bg">
  <div id="dynamic-background"></div>

  <div class="proxy-layout">
    <!-- Browser Toolbar -->
    <div class="proxy-toolbar">
      <button class="proxy-btn" id="btnBack" onclick="goBack()" title="Back" disabled>
        <i class="fa-solid fa-arrow-left"></i>
      </button>
      <button class="proxy-btn" id="btnForward" onclick="goForward()" title="Forward" disabled>
        <i class="fa-solid fa-arrow-right"></i>
      </button>
      <button class="proxy-btn" id="btnReload" onclick="reloadPage()" title="Reload">
        <i class="fa-solid fa-arrow-rotate-right"></i>
      </button>
      <button class="proxy-btn" onclick="showStartScreen()" title="Home">
        <i class="fa-solid fa-house"></i>
      </button>

      <form class="omnibox-form" id="omniboxForm" onsubmit="handleNavigate(event)">
        <i class="fa-solid fa-globe" style="color: var(--text-muted); font-size: 13px;"></i>
        <input type="text" id="omniboxInput" class="omnibox-input" placeholder="Search the web or type a URL..." autocomplete="off">
        <button type="submit" class="omnibox-go-btn">Go</button>
      </form>

      <button class="proxy-btn" onclick="popOutCurrent()" title="Open in New Window">
        <i class="fa-solid fa-arrow-up-right-from-square"></i>
      </button>
    </div>

    <!-- Workspace -->
    <div class="proxy-workspace">
      <!-- Start screen -->
      <div class="proxy-start-screen" id="startScreen">
        <div class="proxy-hero">
          <img src="images/logo-white.png" alt="12AM" class="proxy-logo">
          <h1 class="proxy-title">12AM Web</h1>
          <p class="proxy-subtitle">Private, unblocked web browsing.</p>
        </div>

        <form class="proxy-center-search" onsubmit="handleCenterSearch(event)">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="centerSearchInput" placeholder="Search the web or enter address..." autocomplete="off" autofocus>
          <button type="submit" title="Navigate">
            <i class="fa-solid fa-arrow-right"></i>
          </button>
        </form>
      </div>

      <!-- Iframe viewport -->
      <iframe id="proxyViewport" allow="fullscreen; autoplay; clipboard-read; clipboard-write"></iframe>
    </div>
  </div>

  <script>
    const PROXY_DOMAIN = "https://ohio-notes.broshan.com.np";
    const viewport = document.getElementById('proxyViewport');
    const startScreen = document.getElementById('startScreen');
    const omnibox = document.getElementById('omniboxInput');

    let historyStack = [];
    let historyIdx = -1;

    function handleCenterSearch(e) {
      if (e) e.preventDefault();
      const input = document.getElementById('centerSearchInput');
      const val = input ? input.value.trim() : '';
      if (!val) return;
      navigate(val);
    }

    function handleNavigate(e) {
      if (e) e.preventDefault();
      const input = omnibox.value.trim();
      if (!input) return;
      navigate(input);
    }

    function navigate(query) {
      let url = query;
      if (!/^https?:\/\//i.test(url)) {
        if (url.includes('.') && !url.includes(' ')) {
          url = 'https://' + url;
        } else {
          url = 'https://www.google.com/search?q=' + encodeURIComponent(url);
        }
      }

      omnibox.value = url;
      startScreen.style.display = 'none';

      // Route via proxy backend
      const proxyUrl = PROXY_DOMAIN + '/uv/service/' + encodeURIComponent(url);
      viewport.src = proxyUrl;

      historyStack.push(url);
      historyIdx = historyStack.length - 1;
      updateNavButtons();
    }

    function showStartScreen() {
      startScreen.style.display = 'flex';
      viewport.src = 'about:blank';
      omnibox.value = '';
    }

    function reloadPage() {
      if (viewport.src && viewport.src !== 'about:blank') {
        viewport.src = viewport.src;
      }
    }

    function goBack() {
      if (historyIdx > 0) {
        historyIdx--;
        const url = historyStack[historyIdx];
        omnibox.value = url;
        viewport.src = PROXY_DOMAIN + '/uv/service/' + encodeURIComponent(url);
        updateNavButtons();
      }
    }

    function goForward() {
      if (historyIdx < historyStack.length - 1) {
        historyIdx++;
        const url = historyStack[historyIdx];
        omnibox.value = url;
        viewport.src = PROXY_DOMAIN + '/uv/service/' + encodeURIComponent(url);
        updateNavButtons();
      }
    }

    function updateNavButtons() {
      document.getElementById('btnBack').disabled = historyIdx <= 0;
      document.getElementById('btnForward').disabled = historyIdx >= historyStack.length - 1;
    }

    function popOutCurrent() {
      if (viewport.src && viewport.src !== 'about:blank') {
        window.open(viewport.src, '_blank');
      }
    }

    // Check if URL passed in search params
    const initialUrl = new URLSearchParams(window.location.search).get('url');
    if (initialUrl) {
      navigate(initialUrl);
    }
  </script>
</body>
</html>
