<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>12AM — Web Proxy</title>
  <meta name="description" content="Fast, private web browsing and proxy on 12AM.">

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <!-- 12AM Core Theme & Navigation -->
  <link rel="stylesheet" href="navigation.css">
  <script src="theme.js"></script>
  <script src="device-auth.js"></script>
  <script src="navigation.js" defer></script>

  <style>
    *, *::before, *::after,
    h1, h2, h3, h4, h5, h6,
    b, strong, th,
    .font-bold, .font-semibold, .font-extrabold, .font-black {
      font-weight: 500 !important;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    body {
      padding-top: var(--navbar-height);
      display: flex;
      flex-direction: column;
      background: var(--bg-page);
      font-family: 'Geist', sans-serif;
      font-weight: 400;
    }

    .proxy-layout {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: calc(100vh - var(--navbar-height));
      overflow: hidden;
    }

    /* Proxy Omnibox Toolbar */
    .proxy-toolbar {
      height: 52px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-main);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 1rem;
      flex-shrink: 0;
      box-sizing: border-box;
    }

    /* Unified Squircle UI Button */
    .proxy-squircle-btn {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      background: var(--bg-card, #0a0a0c);
      border: 1px solid var(--border-main, #1c1c22);
      color: var(--text-muted, #a1a1aa);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      flex-shrink: 0;
      outline: none;
      padding: 0;
    }

    .proxy-squircle-btn:hover:not(:disabled) {
      background: var(--btn-bg, rgba(255, 255, 255, 0.08));
      border-color: var(--accent-color, #8b5cf6);
      color: var(--accent-color, #ffffff);
      box-shadow: 0 0 12px var(--accent-glow, rgba(139, 92, 246, 0.3));
      transform: translateY(-1px);
    }

    .proxy-squircle-btn:active:not(:disabled) {
      transform: scale(0.94);
    }

    .proxy-squircle-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      border-color: var(--border-main);
    }

    .proxy-squircle-btn .material-symbols-sharp {
      font-size: 20px;
    }

    /* Omnibar Form */
    .proxy-omnibar-wrap {
      flex: 1;
      height: 38px;
      display: flex;
      align-items: center;
      background: var(--bg-page);
      border: 1px solid var(--border-main);
      border-radius: 12px;
      padding: 0 6px 0 12px;
      gap: 8px;
      transition: all 0.2s ease;
      min-width: 0;
    }

    .proxy-omnibar-wrap:focus-within {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 2px var(--accent-glow);
    }

    .proxy-lock-icon {
      font-size: 16px;
      color: var(--text-muted);
      opacity: 0.7;
      flex-shrink: 0;
    }

    .proxy-omnibar-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 0.88rem;
      font-family: inherit;
      font-weight: 400;
      min-width: 0;
    }

    .proxy-omnibar-input::placeholder {
      color: var(--text-muted);
      opacity: 0.6;
    }

    .proxy-go-btn {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--accent-color);
      border: none;
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
      flex-shrink: 0;
      padding: 0;
    }

    .proxy-go-btn:hover {
      filter: brightness(1.15);
      transform: scale(1.04);
    }

    .proxy-go-btn .material-symbols-sharp {
      font-size: 17px;
    }

    /* Viewport & Start Screen */
    .proxy-workspace {
      flex: 1;
      position: relative;
      background: #000000;
      overflow: hidden;
    }

    .proxy-start-screen {
      position: absolute;
      inset: 0;
      background: var(--bg-page);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      z-index: 5;
    }

    .proxy-hero {
      text-align: center;
      margin-bottom: 2rem;
    }

    .proxy-logo {
      height: 48px;
      width: auto;
      object-fit: contain;
      margin: 0 auto 1.25rem;
      display: block;
      opacity: 0.95;
    }

    .proxy-title {
      font-size: 2.25rem;
      font-weight: 500;
      letter-spacing: -0.03em;
      margin: 0 0 0.5rem;
      color: var(--text-main);
    }

    .proxy-subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin: 0;
      font-weight: 400;
    }

    /* Minimalist Center Search */
    .proxy-center-search {
      width: 100%;
      max-width: 580px;
      display: flex;
      align-items: center;
      background: var(--bg-card);
      border: 1px solid var(--border-main);
      border-radius: 9999px;
      padding: 0.55rem 0.65rem 0.55rem 1.25rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      transition: all 0.25s ease;
      gap: 10px;
    }

    .proxy-center-search:focus-within {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .proxy-center-search .material-symbols-sharp {
      color: var(--text-muted);
      font-size: 20px;
    }

    .proxy-center-search input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 0.95rem;
      font-family: inherit;
      font-weight: 400;
    }

    .proxy-center-search input::placeholder {
      color: var(--text-muted);
      opacity: 0.7;
    }

    .proxy-center-search button {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--accent-color);
      border: none;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
      padding: 0;
    }

    .proxy-center-search button:hover {
      filter: brightness(1.15);
      transform: scale(1.05);
    }

    .proxy-center-search button .material-symbols-sharp {
      color: #ffffff;
      font-size: 20px;
    }

    #proxyViewport {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body class="grid-bg">
  <div id="dynamic-background"></div>

  <div class="proxy-layout">
    <!-- Browser Squircle Toolbar -->
    <div class="proxy-toolbar">
      <button class="proxy-squircle-btn" id="btnBack" onclick="goBack()" title="Back" disabled>
        <span class="material-symbols-sharp">arrow_back</span>
      </button>
      <button class="proxy-squircle-btn" id="btnForward" onclick="goForward()" title="Forward" disabled>
        <span class="material-symbols-sharp">arrow_forward</span>
      </button>
      <button class="proxy-squircle-btn" id="btnReload" onclick="reloadPage()" title="Reload">
        <span class="material-symbols-sharp">refresh</span>
      </button>
      <button class="proxy-squircle-btn" onclick="showStartScreen()" title="Home">
        <span class="material-symbols-sharp">home</span>
      </button>

      <form class="proxy-omnibar-wrap" id="omniboxForm" onsubmit="handleNavigate(event)">
        <span class="material-symbols-sharp proxy-lock-icon">lock</span>
        <input type="text" id="omniboxInput" class="proxy-omnibar-input" placeholder="Search the web or type a URL..." autocomplete="off">
        <button type="submit" class="proxy-go-btn" title="Navigate">
          <span class="material-symbols-sharp">arrow_forward</span>
        </button>
      </form>

      <button class="proxy-squircle-btn" onclick="popOutCurrent()" title="Open in New Tab">
        <span class="material-symbols-sharp">open_in_new</span>
      </button>
      <button class="proxy-squircle-btn" onclick="toggleFullscreen()" title="Toggle Fullscreen">
        <span class="material-symbols-sharp" id="fsIcon">fullscreen</span>
      </button>
    </div>

    <!-- Workspace -->
    <div class="proxy-workspace">
      <!-- Start screen -->
      <div class="proxy-start-screen" id="startScreen">
        <div class="proxy-hero">
          <img src="images/logo-white.png" alt="12AM" class="proxy-logo">
          <h1 class="proxy-title">12AM Web</h1>
          <p class="proxy-subtitle">Private, unblocked web browsing.</p>
        </div>

        <form class="proxy-center-search" onsubmit="handleCenterSearch(event)">
          <span class="material-symbols-sharp">search</span>
          <input type="text" id="centerSearchInput" placeholder="Search the web or enter address (e.g. totaljerkface.com)..." autocomplete="off" autofocus>
          <button type="submit" title="Navigate">
            <span class="material-symbols-sharp">arrow_forward</span>
          </button>
        </form>
      </div>

      <!-- Iframe viewport -->
      <iframe id="proxyViewport" allow="fullscreen; autoplay; clipboard-read; clipboard-write; encrypted-media; picture-in-picture"></iframe>
    </div>
  </div>

  <script>
    const PROXY_GATEWAY = "https://classroom-docs.googleus-cloud1.workers.dev/browse?url=";
    const viewport = document.getElementById('proxyViewport');
    const startScreen = document.getElementById('startScreen');
    const omnibox = document.getElementById('omniboxInput');

    let historyStack = [];
    let historyIdx = -1;

    function normalizeUrl(raw) {
      let v = (raw || "").trim();
      if (!v) return "https://www.bing.com";
      if (/^https?:\/\//i.test(v)) return v;
      if (/^[a-zA-Z0-9-]+(\.[a-zA-Z0-9-]+)+(\/.*)?$/i.test(v) && !v.includes(" ")) {
        return "https://" + v;
      }
      return "https://www.bing.com/search?q=" + encodeURIComponent(v);
    }

    function getProxiedUrl(targetUrl) {
      return PROXY_GATEWAY + encodeURIComponent(targetUrl) + "&embed=1";
    }

    function handleCenterSearch(e) {
      if (e) e.preventDefault();
      const input = document.getElementById('centerSearchInput');
      const val = input ? input.value.trim() : '';
      if (!val) return;
      navigate(val);
    }

    function handleNavigate(e) {
      if (e) e.preventDefault();
      const input = omnibox.value.trim();
      if (!input) return;
      navigate(input);
    }

    function navigate(rawQuery) {
      const target = normalizeUrl(rawQuery);
      if (!target) return;

      omnibox.value = target;
      startScreen.style.display = 'none';

      const proxied = getProxiedUrl(target);
      viewport.src = proxied;

      historyStack = historyStack.slice(0, historyIdx + 1);
      historyStack.push(target);
      historyIdx = historyStack.length - 1;
      updateNavButtons();
    }

    function showStartScreen() {
      startScreen.style.display = 'flex';
      viewport.src = 'about:blank';
      omnibox.value = '';
    }

    function reloadPage() {
      if (viewport.src && viewport.src !== 'about:blank') {
        viewport.src = viewport.src;
      }
    }

    function goBack() {
      if (historyIdx > 0) {
        historyIdx--;
        const target = historyStack[historyIdx];
        omnibox.value = target;
        viewport.src = getProxiedUrl(target);
        updateNavButtons();
      }
    }

    function goForward() {
      if (historyIdx < historyStack.length - 1) {
        historyIdx++;
        const target = historyStack[historyIdx];
        omnibox.value = target;
        viewport.src = getProxiedUrl(target);
        updateNavButtons();
      }
    }

    function updateNavButtons() {
      document.getElementById('btnBack').disabled = historyIdx <= 0;
      document.getElementById('btnForward').disabled = historyIdx >= historyStack.length - 1;
    }

    function popOutCurrent() {
      if (viewport.src && viewport.src !== 'about:blank') {
        window.open(viewport.src, '_blank');
      }
    }

    function toggleFullscreen() {
      const layout = document.querySelector('.proxy-layout');
      if (!document.fullscreenElement) {
        (layout || document.documentElement).requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    document.addEventListener('fullscreenchange', () => {
      const icon = document.getElementById('fsIcon');
      if (icon) {
        icon.textContent = document.fullscreenElement ? 'fullscreen_exit' : 'fullscreen';
      }
    });

    // Check if URL passed in search params
    const initialUrl = new URLSearchParams(window.location.search).get('url');
    if (initialUrl) {
      navigate(initialUrl);
    }
  </script>
</body>
</html>
