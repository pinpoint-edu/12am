<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>12AM — Games Hub</title>
  <meta name="description" content="12AM high-performance unblocked games catalog featuring multi-CDN mirrors, offline storage, and section switching.">

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <!-- 12AM Core Theme & Navigation -->
  <link rel="stylesheet" href="navigation.css">
  <script src="theme.js"></script>
  <script src="device-auth.js"></script>
  <script src="navigation.js" defer></script>
  <script src="games.js"></script>
  <script src="game-loader.js" defer></script>

  <style>
    :root {
      --bg-page: var(--bg-primary, #040404);
      --bg-card: var(--bg-secondary, #0c0c0e);
      --text-main: var(--text-primary, #ffffff);
      --text-muted: var(--text-secondary, #a1a1aa);
      --accent-color: var(--accent-primary, #8b5cf6);
      --accent-glow: var(--accent-secondary, rgba(139, 92, 246, 0.4));
      --border-main: var(--border-primary, #1c1c20);
      --border-faint: var(--border-secondary, rgba(255, 255, 255, 0.06));
      --btn-bg: var(--button-bg, rgba(139, 92, 246, 0.12));
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      padding-top: calc(var(--navbar-height, 64px) + 1.25rem);
    }

    /* Subdued ambient background glow */
    #dynamic-background {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -2;
      background: radial-gradient(circle at 50% 0%, var(--accent-glow) 0%, transparent 60%);
    }

    .main-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1300px;
      margin: 0 auto;
      padding: 0 1.25rem 4rem;
      flex: 1;
    }

    /* Floating Bottom Search Bar */
    .search-bar-wrap {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 2rem);
      max-width: 600px;
      z-index: 1000;
      margin: 0;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-main);
      border-radius: 9999px;
      padding: 0.65rem 1.25rem;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.2), 0 0 20px var(--accent-glow);
      transition: all 0.25s ease;
    }

    .search-box:focus-within {
      border-color: var(--accent-color);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.25), 0 0 24px var(--accent-glow);
    }

    .search-box input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 0.95rem;
      font-family: inherit;
      padding: 0 0.5rem;
    }

    .search-box input::placeholder {
      color: var(--text-muted);
      opacity: 0.7;
    }

    .search-hint {
      font-size: 0.72rem;
      padding: 2px 7px;
      border-radius: 6px;
      background: var(--border-faint);
      border: 1px solid var(--border-main);
      color: var(--text-muted);
      font-family: monospace;
    }

    /* Search Dropdown Results Opening Upwards */
    #searchDropdown {
      position: absolute;
      bottom: calc(100% + 10px);
      top: auto;
      left: 0;
      right: 0;
      background: var(--bg-card);
      border: 1px solid var(--border-main);
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      max-height: 380px;
      overflow-y: auto;
      z-index: 1001;
      display: none;
    }

    .search-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border-faint);
      cursor: pointer;
      text-decoration: none;
      color: var(--text-main);
      transition: background 0.15s ease;
    }

    .search-item:hover {
      background: var(--btn-bg, var(--border-faint));
    }

    .search-item-info {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .search-item-thumb {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      object-fit: cover;
      background: var(--bg-page);
      border: 1px solid var(--border-main);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: var(--accent-color);
      flex-shrink: 0;
    }

    .search-item-meta {
      min-width: 0;
    }

    .search-item-title {
      font-size: 0.92rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .search-item-badge {
      font-size: 0.7rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* Category Specific Colors */
    .color-vault { color: var(--accent-color) !important; }
    .color-strongdog { color: #FFA500 !important; }
    .color-gnmath { color: #FB2651 !important; }
    .color-tglsc { color: #3B82F6 !important; }

    /* Segmented Squircle Sliding Pill Switcher Track */
    .pill-switcher-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 1.5rem auto 1.75rem;
      width: 100%;
    }

    .pill-switcher-track {
      position: relative;
      display: inline-flex;
      align-items: center;
      background: var(--bg-card);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid var(--border-main);
      border-radius: 20px;
      padding: 5px;
      gap: 4px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.16);
      user-select: none;
    }

    .pill-tab-btn {
      position: relative;
      z-index: 2;
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 9px 20px;
      border-radius: 16px;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      transition: color 0.25s ease;
      outline: none;
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .pill-tab-btn.active {
      color: #ffffff !important;
    }

    html.theme-amoled-midnight .pill-tab-btn.active {
      color: #000000 !important;
    }

    .pill-tab-btn:hover:not(.active) {
      color: var(--text-main);
    }

    .pill-slider-indicator {
      position: absolute;
      top: 5px;
      left: 5px;
      height: calc(100% - 10px);
      background: var(--accent-color);
      border-radius: 16px;
      box-shadow: 0 0 18px var(--accent-glow);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1;
    }

    /* Sub-bar showing active count and clear metadata */
    .catalog-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 0.5rem 0.5rem;
      margin-top: 0.75rem;
      text-align: center;
    }

    .catalog-tag {
      font-size: 0.75rem;
      font-weight: 500;
      padding: 3px 10px;
      border-radius: 10px;
      border: 1px solid var(--border-faint);
      background: var(--bg-card);
      color: var(--text-main);
    }

    .catalog-count {
      font-size: 0.82rem;
      color: var(--text-muted);
      opacity: 0.8;
    }

    /* Multi-column responsive Bento Squircle Grid */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
      width: 100%;
      margin: 0 auto 3rem;
      transition: opacity 0.2s ease;
    }

    /* Each game card: 16:11 squircle */
    .game-card {
      position: relative;
      aspect-ratio: 16 / 11;
      border-radius: 20px;
      overflow: hidden;
      background: var(--bg-card);
      border: 1px solid var(--border-main);
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s ease, border-color 0.25s ease;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.14);
    }

    .game-card:hover {
      transform: scale(1.03);
      border-color: var(--accent-color);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.28), 0 0 20px var(--accent-glow);
      z-index: 10;
    }

    /* Featured / Continue Playing Hero Card (spans 2 columns, 16:7 aspect ratio) */
    .game-card.hero-card {
      grid-column: span 2;
      aspect-ratio: 16 / 7;
      border-color: var(--border-main);
      background: var(--bg-card);
    }

    @media (max-width: 640px) {
      .game-card.hero-card {
        grid-column: span 1;
        aspect-ratio: 16 / 11;
      }
    }

    /* Card Artwork background */
    .card-bg-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
      z-index: 1;
    }

    .game-card:hover .card-bg-img {
      transform: scale(1.06);
    }

    .card-fallback-art {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--avatar-gradient, linear-gradient(135deg, var(--accent-color, #8b5cf6) 0%, #1e1b4b 100%));
      color: rgba(255, 255, 255, 0.28);
      font-size: 52px;
      z-index: 0;
    }

    /* Dark gradient overlay at the bottom */
    .card-gradient-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.88) 0%, rgba(0, 0, 0, 0.35) 50%, rgba(0, 0, 0, 0.0) 100%);
      z-index: 2;
      pointer-events: none;
    }

    /* Bottom-left title and pill category */
    .card-info {
      position: relative;
      z-index: 3;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      pointer-events: none;
      min-width: 0;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 500;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: -0.01em;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
    }

    .hero-card .card-title {
      font-size: 1.25rem;
    }

    .card-tag {
      align-self: flex-start;
      font-size: 0.68rem;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #f1f5f9;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .card-tag.hero-tag {
      background: var(--accent-color);
      color: #ffffff;
      border-color: transparent;
      box-shadow: 0 0 10px var(--accent-glow);
    }

    html.theme-amoled-midnight .card-tag.hero-tag {
      color: #000000;
    }

    /* Slide-up Frosted Squircle Action Buttons on Hover */
    .card-hover-actions {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      opacity: 0;
      transform: translateY(12px);
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
      padding: 12px;
    }

    .game-card:hover .card-hover-actions {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .card-btn-play {
      background: var(--accent-color);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      height: 38px;
      padding: 0 16px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      box-shadow: 0 4px 14px var(--accent-glow);
      transition: transform 0.15s ease, filter 0.15s ease;
      outline: none;
    }

    .card-btn-play:hover {
      filter: brightness(1.12);
      transform: scale(1.05);
    }

    .card-btn-star {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      border-radius: 14px;
      width: 38px;
      height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
      outline: none;
    }

    .card-btn-star:hover {
      background: rgba(255, 255, 255, 0.22);
      transform: scale(1.05);
    }

    .card-btn-star.pinned {
      background: rgba(251, 191, 36, 0.25);
      border-color: #fbbf24;
      color: #fbbf24;
    }

    .card-info-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 14px;
      cursor: pointer;
      padding: 4px;
      transition: color 0.15s ease;
    }

    .card-info-btn:hover {
      color: #ffffff;
    }

    .btn-sharp {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      border-radius: 10px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s ease;
      border: 1px solid var(--border-main);
      background: rgba(255, 255, 255, 0.04);
      color: #fafafa;
    }

    .btn-sharp:hover {
      background: var(--btn-bg);
      color: #ffffff;
      border-color: var(--accent-color);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .btn-primary-sharp {
      background: var(--btn-bg, var(--bg-card));
      color: var(--accent-color, #8b5cf6);
      border: 1px solid var(--accent-color, #8b5cf6);
      font-weight: 500;
      box-shadow: 0 2px 8px var(--accent-glow, rgba(139, 92, 246, 0.15));
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      line-height: 1;
    }

    .btn-primary-sharp:hover {
      background: var(--accent-color, #8b5cf6);
      color: #ffffff;
      border-color: var(--accent-color, #8b5cf6);
      box-shadow: 0 4px 14px var(--accent-glow, rgba(139, 92, 246, 0.35));
    }

    .btn-icon-sharp {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-main);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-icon-sharp:hover, .btn-icon-sharp.pinned-active {
      color: #fbbf24;
      border-color: rgba(251, 191, 36, 0.4);
      background: rgba(251, 191, 36, 0.1);
    }

    .search-item-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-faint);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
    }

    /* Favorites Section */
    #favoritesSection {
      margin-bottom: 2.5rem;
      display: none;
    }

    .favorites-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.1rem;
      font-weight: 500;
      color: #fbbf24;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border-faint);
    }

    /* Fullscreen Player Overlay (pinpoint-mini squircle style) */
    #player-view {
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: #000000;
      display: none;
      flex-direction: column;
    }

    .player-header {
      height: 54px;
      background: var(--navbar-bg, var(--bg-secondary, #09090b)) !important;
      border-bottom: 1px solid var(--navbar-border, var(--border-primary, #27272a)) !important;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
      position: relative;
    }

    .player-header-left, .player-header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .player-btn-squircle {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-card, var(--bg-secondary, #18181b));
      border: 1px solid var(--border-primary, #27272a);
      color: var(--text-main, #fafafa);
      cursor: pointer;
      transition: all 0.15s ease;
      padding: 0;
      flex-shrink: 0;
      outline: none;
    }

    .player-btn-squircle:hover {
      background: var(--button-bg, rgba(255, 255, 255, 0.1));
      border-color: var(--accent-primary, #8b5cf6);
      color: var(--accent-primary, #ffffff);
      box-shadow: 0 0 12px var(--accent-glow, rgba(139, 92, 246, 0.3));
      transform: translateY(-1px);
    }

    .player-btn-squircle:active {
      transform: scale(0.94);
    }

    .player-btn-squircle.pinned-active {
      color: #facc15 !important;
      border-color: rgba(250, 204, 21, 0.4) !important;
      background: rgba(250, 204, 21, 0.12) !important;
    }

    .player-btn-squircle.btn-close:hover {
      background: rgba(239, 68, 68, 0.2);
      border-color: #ef4444;
      color: #ef4444;
    }

    .player-btn-squircle .material-symbols-sharp {
      font-size: 20px;
    }

    .player-title {
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif !important;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-main, #f4f4f5) !important;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 320px;
      padding: 5px 14px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 9999px;
      letter-spacing: -0.01em;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      display: inline-flex;
      align-items: center;
    }

    .player-frame-wrapper {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      background: #000000;
      overflow: hidden;
    }

    #gameIframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* STYLED FOOTER (Fully self-contained CSS, premium 12AM styling) */
    .site-footer {
      width: 100%;
      margin-top: 4rem;
      border-top: 1px solid var(--border-main);
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      position: relative;
      z-index: 10;
    }

    .site-footer-inner {
      max-width: 1300px;
      margin: 0 auto;
      padding: 2.25rem 1.5rem;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .footer-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .footer-logo {
      height: 24px;
      width: auto;
      opacity: 0.85;
      display: block;
    }

    .footer-brand-title {
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      color: var(--text-main);
    }

    .footer-copy {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin: 0;
    }

    .footer-links {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      font-size: 0.82rem;
    }

    .footer-link {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .footer-link:hover {
      color: var(--accent-color);
    }
  </style>
</head>
<body>
  <div id="dynamic-background"></div>

  <div class="main-wrapper">
    <!-- Clean Search Bar without bold hero header -->
    <div class="search-bar-wrap">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass" style="color: var(--text-muted); font-size: 14px; margin-right: 6px;"></i>
        <input type="text" id="gameSearchInput" placeholder="Search 2,200+ games across all categories... (Press /)" autocomplete="off">
        <span class="search-hint">/</span>
      </div>
      <div id="searchDropdown"></div>
    </div>

    <!-- Segmented Squircle Sliding Pill Switcher Track -->
    <div class="pill-switcher-container">
      <div class="pill-switcher-track" id="categorySwitcherTrack">
        <div class="pill-slider-indicator" id="pillSliderIndicator"></div>
        <button type="button" class="pill-tab-btn active" data-tab="originals">
          <i class="fa-solid fa-cube"></i>
          <span>Originals</span>
        </button>
        <button type="button" class="pill-tab-btn" data-tab="strongdog">
          <i class="fa-solid fa-dog"></i>
          <span>StrongdogXP</span>
        </button>
        <button type="button" class="pill-tab-btn" data-tab="gnmath">
          <i class="fa-solid fa-shapes"></i>
          <span>GN-Math</span>
        </button>
        <button type="button" class="pill-tab-btn" data-tab="tglsc">
          <i class="fa-solid fa-bolt"></i>
          <span>TGLSC</span>
        </button>
      </div>

      <!-- Catalog Count & Badge Bar -->
      <div class="catalog-bar">
        <span class="catalog-tag color-vault" id="categoryTag">Originals</span>
        <span class="catalog-count" id="catalogCount">Loading games...</span>
      </div>
    </div>

    <!-- Active Games Bento Grid -->
    <div class="games-grid" id="gamesGrid"></div>
  </div>

  <!-- Fullscreen Player Overlay (pinpoint-mini squircle style) -->
  <div id="player-view">
    <div class="player-header">
      <div class="player-header-left">
        <button class="player-btn-squircle" onclick="closePlayer()" title="Back to Games">
          <span class="material-symbols-sharp">arrow_back</span>
        </button>
        <span class="player-title" id="currentPlayerTitle">Playing</span>
      </div>
      <div class="player-header-right">
        <button class="player-btn-squircle" id="playerPinBtn" onclick="togglePinCurrentGame()" title="Add to Favorites">
          <i class="fa-solid fa-star" id="playerPinIcon" style="font-size: 15px;"></i>
        </button>
        <button class="player-btn-squircle" onclick="reloadCurrentGame()" title="Reload Game">
          <span class="material-symbols-sharp">refresh</span>
        </button>
        <button class="player-btn-squircle" onclick="togglePlayerFullscreen()" title="Toggle Fullscreen">
          <span class="material-symbols-sharp">fullscreen</span>
        </button>
        <button class="player-btn-squircle btn-close" onclick="closePlayer()" title="Close Player">
          <span class="material-symbols-sharp">close</span>
        </button>
      </div>
    </div>
    <div class="player-frame-wrapper">
      <iframe id="gameIframe" allow="fullscreen; autoplay; camera; microphone; clipboard-read; clipboard-write; display-capture; geolocation; encrypted-media; picture-in-picture; web-share"></iframe>
    </div>
  </div>



  <script>
    let currentTab = 'originals';
    let categoryGames = {
      'Originals': [],
      'StrongdogXP': [],
      'GN-Math': [],
      'TGLSC': []
    };
    let allSearchableGames = [];
    let pinnedGames = [];

    try {
      const savedPins = JSON.parse(localStorage.getItem('12am_pinned_games') || '[]');
      pinnedGames = Array.isArray(savedPins) ? savedPins : [];
    } catch (e) {
      pinnedGames = [];
    }

    // Initialize & Load all Categories
    async function initGamesHub() {
      setupSwitcherControls();
      setupSearch();

      // 1. Load Originals (12AM Vault)
      try {
        let vaultRaw = [];
        if (window.__12AM_GAMES__ && Array.isArray(window.__12AM_GAMES__)) {
          vaultRaw = window.__12AM_GAMES__.filter(g => !g.isApp);
        } else {
          const res = await fetch('games.json');
          const data = await res.json();
          vaultRaw = data.filter(g => !g.isApp);
        }
        categoryGames['Originals'] = vaultRaw.map(g => ({
          id: `vault-${g.title.replace(/\s+/g, '-').toLowerCase()}`,
          name: g.title,
          url: g.file,
          imgSrc: g.thumbnail || '',
          category: 'Original',
          isLocal: true,
          sizeBytes: g.sizeBytes
        }));
      } catch (e) {
        console.warn('Failed loading Originals games:', e);
      }

      // 2. Load StrongdogXP
      try {
        const res = await fetch('strongdog-games.json');
        const data = await res.json();
        categoryGames['StrongdogXP'] = data.map(g => {
          return {
            ...g,
            url: normalizeGameUrl(g.url || ''),
            category: 'StrongdogXP'
          };
        });
      } catch (e) {
        console.warn('Failed loading Strongdog games:', e);
      }

      // 3. Load GN-Math
      try {
        const res = await fetch('gn-math-games.json');
        const data = await res.json();
        categoryGames['GN-Math'] = data.filter(g => g.id >= 0).map(g => ({
          id: `gn-${g.id}`,
          name: g.name,
          category: 'GN-Math',
          imgSrc: (g.cover || '').replace("{COVER_URL}", "https://cdn.jsdelivr.net/gh/freebuisness/covers@main").replace("{HTML_URL}", "https://raw.githubusercontent.com/freebuisness/html/main"),
          url: (g.url || '').replace("{COVER_URL}", "https://cdn.jsdelivr.net/gh/freebuisness/covers@main").replace("{HTML_URL}", "https://raw.githubusercontent.com/freebuisness/html/main")
        }));
      } catch (e) {
        console.warn('Failed loading GN-Math games:', e);
      }

      // 4. Load TGLSC (The Blue Category)
      try {
        const res = await fetch('tglsc-games.json');
        const data = await res.json();
        categoryGames['TGLSC'] = data.map(g => {
          let thumb = g.thumbnail || '';
          if (thumb.startsWith('/')) thumb = 'https://glseries.net' + thumb;
          return {
            id: `tglsc-${g.id}`,
            name: g.title,
            category: 'TGLSC',
            originalCategory: g.category,
            imgSrc: thumb,
            url: g.embed_url || `https://glseries.net${g.game_url}`,
            status: g.status
          };
        });
      } catch (e) {
        console.warn('Failed loading TGLSC games:', e);
      }

      // Assemble all searchable games
      allSearchableGames = [];
      Object.keys(categoryGames).forEach(cat => {
        allSearchableGames.push(...categoryGames[cat]);
      });

      // Render default tab
      renderActiveTab();
    }

    // Segmented Squircle Sliding Pill Switcher Controls
    function setupSwitcherControls() {
      const track = document.getElementById('categorySwitcherTrack');
      const indicator = document.getElementById('pillSliderIndicator');
      if (!track) return;
      const buttons = track.querySelectorAll('.pill-tab-btn');

      function updateIndicator(btn) {
        if (!indicator || !btn) return;
        indicator.style.left = `${btn.offsetLeft}px`;
        indicator.style.width = `${btn.offsetWidth}px`;
      }

      buttons.forEach(btn => {
        btn.addEventListener('click', () => {
          buttons.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          updateIndicator(btn);
          currentTab = btn.dataset.tab;
          renderActiveTab();
        });
      });

      window.addEventListener('resize', () => {
        const active = track.querySelector('.pill-tab-btn.active');
        if (active) updateIndicator(active);
      });

      // Initial indicator layout
      setTimeout(() => {
        const active = track.querySelector('.pill-tab-btn.active');
        if (active) updateIndicator(active);
      }, 50);
    }

    // Render Active Bento Grid
    async function renderActiveTab() {
      const grid = document.getElementById('gamesGrid');
      const countEl = document.getElementById('catalogCount');
      const tagEl = document.getElementById('categoryTag');
      if (!grid) return;

      let rawList = [];
      let tagText = 'Originals';
      let tagClass = 'color-vault';

      if (currentTab === 'originals') {
        rawList = categoryGames['Originals'] || [];
        tagText = 'Originals';
        tagClass = 'color-vault';
      } else if (currentTab === 'strongdog') {
        rawList = categoryGames['StrongdogXP'] || [];
        tagText = 'StrongdogXP';
        tagClass = 'color-strongdog';
      } else if (currentTab === 'gnmath') {
        rawList = categoryGames['GN-Math'] || [];
        tagText = 'GN-Math';
        tagClass = 'color-gnmath';
      } else if (currentTab === 'tglsc') {
        rawList = categoryGames['TGLSC'] || [];
        tagText = 'TGLSC';
        tagClass = 'color-tglsc';
      }

      if (tagEl) {
        tagEl.className = `catalog-tag ${tagClass}`;
        tagEl.textContent = tagText;
      }
      if (countEl) {
        countEl.textContent = `${rawList.length.toLocaleString()} games available`;
      }

      grid.style.opacity = '0';
      await new Promise(r => setTimeout(r, 90));

      if (rawList.length === 0) {
        grid.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; padding: 4rem 1rem; color: var(--text-muted);">
            <i class="fa-solid fa-spinner fa-spin" style="font-size: 32px; margin-bottom: 12px; color: var(--accent-color);"></i>
            <h3 style="color: var(--text-main); margin-bottom: 6px; font-weight: 500;">Loading games...</h3>
          </div>
        `;
        grid.style.opacity = '1';
        return;
      }

      // Favoriting ordering logic:
      // Pinned games are sorted to the very top in order of when they were starred!
      const sectionPinned = [];
      pinnedGames.forEach(name => {
        const match = rawList.find(g => g.name === name);
        if (match) sectionPinned.push(match);
      });
      const sectionUnpinned = rawList.filter(g => !pinnedGames.includes(g.name));
      const sortedGames = [...sectionPinned, ...sectionUnpinned];

      // The top game is the hero card (most recent favorited game, or first in list)
      const heroGame = sortedGames[0];
      const otherGames = sortedGames.slice(1);
      const isHeroPinned = heroGame && pinnedGames.includes(heroGame.name);

      let cardsHtml = '';
      if (heroGame) {
        cardsHtml += createGameCardHTML(heroGame, true, isHeroPinned);
      }
      cardsHtml += otherGames.map(game => createGameCardHTML(game, false, pinnedGames.includes(game.name))).join('');

      grid.innerHTML = cardsHtml;
      grid.style.opacity = '1';
    }

    function formatBytes(bytes) {
      if (!bytes || bytes === 0) return 'Instant Web App';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    function escapeHTML(str) {
      if (!str) return '';
      return String(str).replace(/[&<>'"]/g, tag => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        "'": '&#39;',
        '"': '&quot;'
      }[tag] || tag));
    }

    // Bento Squircle Card Generator
    function createGameCardHTML(game, isHero = false, isPinned = false) {
      let catColorClass = 'color-vault';
      if (game.category === 'StrongdogXP') catColorClass = 'color-strongdog';
      if (game.category === 'GN-Math') catColorClass = 'color-gnmath';
      if (game.category === 'TGLSC') catColorClass = 'color-tglsc';

      const heroClass = isHero ? 'hero-card' : '';
      const tagLabel = isHero && isPinned ? '⭐ Favorite' : (game.category || 'Game');

      return `
        <div class="game-card ${heroClass}" onclick="launchGame('${encodeURIComponent(game.url)}', '${encodeURIComponent(game.name)}', ${game.isLocal || false}, '${game.category || ''}')">
          <div class="card-fallback-art"><i class="fa-solid fa-gamepad"></i></div>
          ${game.imgSrc ? `
            <img src="${escapeHTML(game.imgSrc)}" alt="${escapeHTML(game.name)}" class="card-bg-img" loading="lazy" onerror="this.style.display='none';">
          ` : ''}
          <div class="card-gradient-overlay"></div>
          <div class="card-info">
            <span class="card-tag ${isHero && isPinned ? 'hero-tag' : catColorClass}">${tagLabel}</span>
            <span class="card-title">${escapeHTML(game.name)}</span>
          </div>
          <div class="card-hover-actions">
            <button type="button" class="card-btn-play" onclick="event.stopPropagation(); launchGame('${encodeURIComponent(game.url)}', '${encodeURIComponent(game.name)}', ${game.isLocal || false}, '${game.category || ''}')" title="Play ${escapeHTML(game.name)}">
              <i class="fa-solid fa-play"></i>
              <span>Play</span>
            </button>
            <button type="button" class="card-btn-star ${isPinned ? 'pinned' : ''}" onclick="event.stopPropagation(); togglePin('${encodeURIComponent(game.name)}')" title="${isPinned ? 'Unstar' : 'Add to Favorites'}">
              <i class="fa-solid fa-star"></i>
            </button>
          </div>
        </div>
      `;
    }

    const STRONGDOG_GN_UNITY_MAP = {
      'geometry dash lite': 27,
      'a dance of fire and ice': 59,
      'solar smash': 118,
      'snow rider 3d': 119,
      'ultrakill': 196,
      'jelly drift': 543,
      'yandere simulator': 554,
      'slime rancher': 591,
      'slime ranchers': 591,
      'cell machine': 730
    };

    // Normalize game URL: Clean StrongdogXP and GAMES outer container URLs to direct /game/index.html or /game/base.html
    function normalizeGameUrl(url) {
      if (!url) return '';
      let decoded = url;
      try { decoded = decodeURIComponent(url); } catch (e) {}
      const unityMatch = decoded.match(/pinpoint-edu\.github\.io\/strongdog[56]\/html\/([^/]+)\//i);
      if (unityMatch) {
        const gnId = STRONGDOG_GN_UNITY_MAP[unityMatch[1].trim().toLowerCase()];
        if (gnId) {
          return `https://raw.githubusercontent.com/freebuisness/html/main/${gnId}-fix2.html`;
        }
      }
      if (/pinpoint-edu\.github\.io\/(?:strongdog[0-9]*|GAMES)\/html\/[^/]+\/index\.html$/i.test(url)) {
        return url.replace(/\/index\.html$/i, '/game/index.html');
      }
      if (/pinpoint-edu\.github\.io\/(?:strongdog[0-9]*|GAMES)\/swf\/[^/]+\/base\.html$/i.test(url)) {
        return url.replace(/\/base\.html$/i, '/game/base.html');
      }
      return url;
    }

    // Toggle Pin / Favorite (Starred games go to top, most recent is big hero)
    function togglePin(nameEnc) {
      const name = decodeURIComponent(nameEnc);
      if (pinnedGames.includes(name)) {
        pinnedGames = pinnedGames.filter(n => n !== name);
      } else {
        pinnedGames.unshift(name); // Add to front as most recent favorite!
      }
      try {
        localStorage.setItem('12am_pinned_games', JSON.stringify(pinnedGames));
      } catch (e) {}

      renderActiveTab();
    }

    // Search Box & Dropdown Handling
    function setupSearch() {
      const input = document.getElementById('gameSearchInput');
      const dropdown = document.getElementById('searchDropdown');

      // '/' to focus
      window.addEventListener('keydown', (e) => {
        if (e.key === '/' && !['INPUT', 'TEXTAREA'].includes(e.target.tagName)) {
          e.preventDefault();
          input.focus();
          input.select();
        }
      });

      input.addEventListener('input', () => {
        const query = input.value.toLowerCase().trim();
        if (!query) {
          dropdown.style.display = 'none';
          dropdown.innerHTML = '';
          return;
        }

        const matches = allSearchableGames
          .filter(g => g.name.toLowerCase().includes(query))
          .slice(0, 8);

        if (matches.length === 0) {
          dropdown.innerHTML = `<div style="padding: 1rem; text-align: center; color: var(--text-muted); font-size: 0.85rem;">No games found for "${query}"</div>`;
          dropdown.style.display = 'block';
          return;
        }

        dropdown.innerHTML = matches.map(g => {
          let catColor = 'color-vault';
          if (g.category === 'StrongdogXP') catColor = 'color-strongdog';
          if (g.category === 'GN-Math') catColor = 'color-gnmath';
          if (g.category === 'TGLSC') catColor = 'color-tglsc';

          return `
            <div class="search-item" onclick="launchGame('${encodeURIComponent(g.url)}', '${encodeURIComponent(g.name)}', ${g.isLocal || false}, '${g.category || ''}')">
              <div class="search-item-info">
                <div class="search-item-icon"><i class="fa-solid fa-gamepad ${catColor}"></i></div>
                <div class="search-item-meta">
                  <div class="search-item-title">${escapeHTML(g.name)}</div>
                  <div class="search-item-badge ${catColor}">${g.category}</div>
                </div>
              </div>
              <button class="btn-sharp btn-primary-sharp" style="padding: 5px 12px; font-size: 11px;">
                <i class="fa-solid fa-play"></i>
                <span>Play</span>
              </button>
            </div>
          `;
        }).join('');

        dropdown.style.display = 'block';
      });

      document.addEventListener('click', (e) => {
        if (!e.target.closest('.search-bar-wrap')) {
          dropdown.style.display = 'none';
        }
      });
    }

    // Launch Game in Fullscreen Player View
    let currentGameUrl = '';
    let currentGameTitle = '';

    function updatePlayerPinBtn() {
      const pinBtn = document.getElementById('playerPinBtn');
      if (!pinBtn) return;
      const isPinned = Array.isArray(pinnedGames) ? pinnedGames.includes(currentGameTitle) : (pinnedGames && typeof pinnedGames.has === 'function' ? pinnedGames.has(currentGameTitle) : false);
      pinBtn.classList.toggle('pinned-active', isPinned);
      pinBtn.title = isPinned ? 'Remove from Favorites' : 'Add to Favorites';
    }

    function togglePinCurrentGame() {
      if (!currentGameTitle) return;
      togglePin(encodeURIComponent(currentGameTitle));
      updatePlayerPinBtn();
    }

    function launchGame(urlEnc, titleEnc, isLocal, category) {
      let url = decodeURIComponent(urlEnc);
      const title = decodeURIComponent(titleEnc);

      // Clean StrongdogXP / GAMES nested container to embedded game
      url = normalizeGameUrl(url);

      // Proxy TGLSC games through our own proxy (no cloudflare workers)
      if (category === 'TGLSC' || url.includes('glseries.net')) {
        url = `/api/web?mode=browse&embed=1&url=${encodeURIComponent(url)}`;
      }

      currentGameUrl = url;
      currentGameTitle = title;

      // Track recently played game for the Bento Hero Card
      try {
        const found = allSearchableGames.find(g => g.name === title);
        localStorage.setItem('12am_recent_game', JSON.stringify({
          name: title,
          url: url,
          imgSrc: found ? (found.imgSrc || '') : '',
          category: category,
          isLocal: isLocal
        }));
      } catch (e) {}

      const player = document.getElementById('player-view');
      const titleEl = document.getElementById('currentPlayerTitle');
      const iframe = document.getElementById('gameIframe');

      titleEl.textContent = title;
      updatePlayerPinBtn();
      player.style.display = 'flex';
      document.body.style.overflow = 'hidden';

      if ((isLocal || category === 'GN-Math' || category === 'StrongdogXP' || url.includes('pinpoint-edu.github.io') || url.includes('raw.githubusercontent.com') || url.includes('cdn.jsdelivr.net')) && window.playGame) {
        window.playGame(encodeURIComponent(url), encodeURIComponent(title));
        return;
      }

      iframe.removeAttribute('srcdoc');
      iframe.src = url;
    }

    function closePlayer() {
      const player = document.getElementById('player-view');
      const iframe = document.getElementById('gameIframe');
      player.style.display = 'none';
      document.body.style.overflow = '';
      iframe.removeAttribute('src');
      iframe.removeAttribute('srcdoc');
      iframe.src = 'about:blank';
    }

    function reloadCurrentGame() {
      const iframe = document.getElementById('gameIframe');
      if (iframe.src && iframe.src !== 'about:blank') {
        iframe.src = iframe.src;
      } else if (currentGameUrl) {
        iframe.src = currentGameUrl;
      }
    }

    function togglePlayerFullscreen() {
      const player = document.getElementById('player-view');
      if (!document.fullscreenElement) {
        player.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    document.addEventListener('DOMContentLoaded', initGamesHub);
  </script>
</body>
</html>
