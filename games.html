<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>12AM — Games Hub</title>
  <meta name="description" content="12AM high-performance unblocked games catalog featuring multi-CDN mirrors, offline storage, and section switching.">

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <!-- 12AM Core Theme & Navigation -->
  <link rel="stylesheet" href="navigation.css">
  <script src="theme.js"></script>
  <script src="device-auth.js"></script>
  <script src="navigation.js" defer></script>
  <script src="games.js"></script>
  <script src="game-loader.js" defer></script>

  <style>
    :root {
      --bg-page: var(--bg-primary, #040404);
      --bg-card: var(--bg-secondary, #0c0c0e);
      --text-main: var(--text-primary, #ffffff);
      --text-muted: var(--text-secondary, #a1a1aa);
      --accent-color: var(--accent-primary, #8b5cf6);
      --accent-glow: var(--accent-secondary, rgba(139, 92, 246, 0.4));
      --border-main: var(--border-primary, #1c1c20);
      --border-faint: var(--border-secondary, rgba(255, 255, 255, 0.06));
      --btn-bg: var(--button-bg, rgba(139, 92, 246, 0.12));
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      padding-top: calc(var(--navbar-height, 64px) + 1.25rem);
    }

    /* Subdued ambient background glow */
    #dynamic-background {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background: radial-gradient(circle at 50% 0%, rgba(139, 92, 246, 0.08) 0%, transparent 60%);
    }

    .main-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1300px;
      margin: 0 auto;
      padding: 0 1.25rem 4rem;
      flex: 1;
    }

    /* Floating Bottom Search Bar */
    .search-bar-wrap {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 2rem);
      max-width: 600px;
      z-index: 1000;
      margin: 0;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: rgba(12, 12, 16, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-main);
      border-radius: 9999px;
      padding: 0.65rem 1.25rem;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.75), 0 0 20px rgba(139, 92, 246, 0.15);
      transition: all 0.25s ease;
    }

    .search-box:focus-within {
      border-color: var(--accent-color);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8), 0 0 24px var(--accent-glow);
    }

    .search-box input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 0.95rem;
      font-family: inherit;
      padding: 0 0.5rem;
    }

    .search-box input::placeholder {
      color: var(--text-muted);
      opacity: 0.7;
    }

    .search-hint {
      font-size: 0.72rem;
      padding: 2px 7px;
      border-radius: 6px;
      background: var(--border-faint);
      border: 1px solid var(--border-main);
      color: var(--text-muted);
      font-family: monospace;
    }

    /* Search Dropdown Results Opening Upwards */
    #searchDropdown {
      position: absolute;
      bottom: calc(100% + 10px);
      top: auto;
      left: 0;
      right: 0;
      background: #0d0d11;
      border: 1px solid var(--border-main);
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
      max-height: 380px;
      overflow-y: auto;
      z-index: 1001;
      display: none;
    }

    .search-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border-faint);
      cursor: pointer;
      text-decoration: none;
      color: var(--text-main);
      transition: background 0.15s ease;
    }

    .search-item:hover {
      background: rgba(255, 255, 255, 0.04);
    }

    .search-item-info {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .search-item-thumb {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      object-cover: cover;
      background: #141418;
      border: 1px solid var(--border-main);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: var(--accent-color);
      flex-shrink: 0;
    }

    .search-item-meta {
      min-width: 0;
    }

    .search-item-title {
      font-size: 0.92rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .search-item-badge {
      font-size: 0.7rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* V6 Section Switcher (Slider) */
    #category-viewer {
      width: 100%;
      margin-bottom: 2rem;
    }

    .category-slider-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 640px;
      margin: 0 auto 0.75rem;
    }

    .cat-nav-btn {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      border: 1px solid var(--border-main);
      background: rgba(15, 15, 20, 0.7);
      backdrop-filter: blur(10px);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
      transition: all 0.2s ease;
      z-index: 10;
      flex-shrink: 0;
    }

    .cat-nav-btn:hover:not(:disabled) {
      color: #ffffff;
      border-color: var(--accent-color);
      background: var(--btn-bg);
      transform: scale(1.05);
    }

    .cat-nav-btn:disabled {
      opacity: 0.25;
      cursor: not-allowed;
      transform: none;
    }

    .category-slider-window {
      overflow: hidden;
      width: 100%;
      max-width: 440px;
      text-align: center;
      margin: 0 1rem;
    }

    .category-slider {
      display: flex;
      align-items: center;
      width: 100%;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .category-slide {
      width: 100%;
      min-width: 100%;
      max-width: 100%;
      flex: 0 0 100%;
      padding: 0.5rem 0.75rem;
      user-select: none;
      box-sizing: border-box;
    }

    .category-slide h2 {
      font-size: 2.1rem;
      font-weight: 500;
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin-bottom: 0.25rem;
      cursor: pointer;
    }

    .category-slide p {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* Category Specific Colors */
    .color-vault { color: #8b5cf6 !important; }
    .color-strongdog { color: #FFA500 !important; }
    .color-gnmath { color: #FB2651 !important; }
    .color-tglsc { color: #3B82F6 !important; } /* Blue category */

    /* Category Navigation Dots */
    .category-dots-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 1.5rem;
    }

    .cat-dot {
      width: 8px;
      height: 8px;
      border-radius: 9999px;
      background: var(--border-main);
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .cat-dot.active {
      width: 24px;
      background: var(--accent-color);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    /* Centered sub-bar showing active count and clear metadata */
    .catalog-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 0.75rem 0.5rem;
      border-bottom: 1px solid var(--border-faint);
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .catalog-bar-left {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .catalog-tag {
      font-size: 0.78rem;
      font-weight: 500;
      padding: 3px 10px;
      border-radius: 9999px;
      border: 1px solid var(--border-faint);
    }

    .catalog-count {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    /* Games Grid / Row Layout (pinpoint-mini reference-3.9.36 style) */
    .games-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: opacity 0.2s ease;
      width: 100%;
      max-width: 860px;
      margin: 0 auto;
    }

    /* Game Card Row */
    .game-card {
      background: var(--bg-card);
      border: 1px solid var(--border-main);
      border-radius: 14px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
      position: relative;
    }

    .game-card:hover {
      background: rgba(255, 255, 255, 0.03);
      border-color: var(--accent-color);
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.5), 0 0 18px var(--accent-glow);
      z-index: 2;
    }

    .game-left {
      display: flex;
      align-items: center;
      min-width: 0;
      flex: 1;
    }

    .game-details {
      min-width: 0;
      flex: 1;
    }

    .game-title {
      font-size: 15px;
      font-weight: 500;
      color: var(--text-main, #ffffff) !important;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
      transition: color 0.15s ease;
    }

    .game-card:hover .game-title {
      color: var(--accent-color) !important;
    }

    .game-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-muted, #a1a1aa) !important;
      margin-top: 3px;
    }

    .badge-cat {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 7px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-faint);
      font-size: 11px;
      font-weight: 500;
    }

    .badge-pinned {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 7px;
      border-radius: 6px;
      background: rgba(251, 191, 36, 0.12);
      border: 1px solid rgba(251, 191, 36, 0.3);
      font-size: 11px;
      font-weight: 500;
      color: #fbbf24;
    }

    .game-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn-sharp {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      border-radius: 10px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s ease;
      border: 1px solid var(--border-main);
      background: rgba(255, 255, 255, 0.04);
      color: #fafafa;
    }

    .btn-sharp:hover {
      background: var(--btn-bg);
      color: #ffffff;
      border-color: var(--accent-color);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .btn-primary-sharp {
      background: #09090c;
      color: var(--accent-color, #8b5cf6);
      border: 1px solid var(--accent-color, #8b5cf6);
      font-weight: 500;
      box-shadow: 0 2px 8px rgba(139, 92, 246, 0.15);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      line-height: 1;
    }

    .btn-primary-sharp:hover {
      background: var(--btn-bg, rgba(139, 92, 246, 0.16));
      color: #ffffff;
      border-color: var(--accent-color, #8b5cf6);
      box-shadow: 0 4px 14px var(--accent-glow, rgba(139, 92, 246, 0.35));
    }

    .btn-icon-sharp {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-main);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-icon-sharp:hover, .btn-icon-sharp.pinned-active {
      color: #fbbf24;
      border-color: rgba(251, 191, 36, 0.4);
      background: rgba(251, 191, 36, 0.1);
    }

    .search-item-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-faint);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
    }

    /* Favorites Section */
    #favoritesSection {
      margin-bottom: 2.5rem;
      display: none;
    }

    .favorites-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.1rem;
      font-weight: 500;
      color: #fbbf24;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border-faint);
    }

    /* Fullscreen Player Overlay (pinpoint-mini squircle style) */
    #player-view {
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: #000000;
      display: none;
      flex-direction: column;
    }

    .player-header {
      height: 54px;
      background: var(--navbar-bg, var(--bg-secondary, #09090b)) !important;
      border-bottom: 1px solid var(--navbar-border, var(--border-primary, #27272a)) !important;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
      position: relative;
    }

    .player-header-left, .player-header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .player-btn-squircle {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-card, var(--bg-secondary, #18181b));
      border: 1px solid var(--border-primary, #27272a);
      color: var(--text-main, #fafafa);
      cursor: pointer;
      transition: all 0.15s ease;
      padding: 0;
      flex-shrink: 0;
      outline: none;
    }

    .player-btn-squircle:hover {
      background: var(--button-bg, rgba(255, 255, 255, 0.1));
      border-color: var(--accent-primary, #8b5cf6);
      color: var(--accent-primary, #ffffff);
      box-shadow: 0 0 12px var(--accent-glow, rgba(139, 92, 246, 0.3));
      transform: translateY(-1px);
    }

    .player-btn-squircle:active {
      transform: scale(0.94);
    }

    .player-btn-squircle.pinned-active {
      color: #facc15 !important;
      border-color: rgba(250, 204, 21, 0.4) !important;
      background: rgba(250, 204, 21, 0.12) !important;
    }

    .player-btn-squircle.btn-close:hover {
      background: rgba(239, 68, 68, 0.2);
      border-color: #ef4444;
      color: #ef4444;
    }

    .player-btn-squircle .material-symbols-sharp {
      font-size: 20px;
    }

    .player-title {
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif !important;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-main, #f4f4f5) !important;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 320px;
      padding: 5px 14px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 9999px;
      letter-spacing: -0.01em;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      display: inline-flex;
      align-items: center;
    }

    .player-frame-wrapper {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      background: #000000;
      overflow: hidden;
    }

    #gameIframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* STYLED FOOTER (Fully self-contained CSS, premium 12AM styling) */
    .site-footer {
      width: 100%;
      margin-top: 4rem;
      border-top: 1px solid var(--border-main);
      background: rgba(8, 8, 10, 0.85);
      backdrop-filter: blur(16px);
      position: relative;
      z-index: 10;
    }

    .site-footer-inner {
      max-width: 1300px;
      margin: 0 auto;
      padding: 2.25rem 1.5rem;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .footer-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .footer-logo {
      height: 24px;
      width: auto;
      opacity: 0.85;
      display: block;
    }

    .footer-brand-title {
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      color: #ffffff;
    }

    .footer-copy {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin: 0;
    }

    .footer-links {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      font-size: 0.82rem;
    }

    .footer-link {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .footer-link:hover {
      color: var(--accent-color);
    }
  </style>
</head>
<body>
  <div id="dynamic-background"></div>

  <div class="main-wrapper">
    <!-- Clean Search Bar without bold hero header -->
    <div class="search-bar-wrap">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass" style="color: var(--text-muted); font-size: 14px; margin-right: 6px;"></i>
        <input type="text" id="gameSearchInput" placeholder="Search 2,200+ games across all categories... (Press /)" autocomplete="off">
        <span class="search-hint">/</span>
      </div>
      <div id="searchDropdown"></div>
    </div>

    <!-- Favorites Section -->
    <section id="favoritesSection">
      <div class="favorites-header">
        <i class="fa-solid fa-star"></i>
        <span>Favorites</span>
      </div>
      <div class="games-grid" id="favoritesGrid"></div>
    </section>

    <!-- V6 Section Switcher -->
    <div id="category-viewer">
      <div class="category-slider-container">
        <button id="prev-category" class="cat-nav-btn" aria-label="Previous Category">
          <i class="fa-solid fa-chevron-left"></i>
        </button>

        <div class="category-slider-window">
          <div id="category-slider" class="category-slider">
            <div class="category-slide" data-index="0">
              <h2 class="color-vault">12AM Vault</h2>
              <p>Offline IndexedDB &amp; Local Originals</p>
            </div>
            <div class="category-slide" data-index="1">
              <h2 class="color-strongdog">StrongdogXP</h2>
              <p>Core Flash, HTML5 &amp; Web Classics by Josh P</p>
            </div>
            <div class="category-slide" data-index="2">
              <h2 class="color-tglsc">TGLSC</h2>
              <p>Ultra-Fast High-Speed CDN Catalog (199 Games)</p>
            </div>
          </div>
        </div>

        <button id="next-category" class="cat-nav-btn" aria-label="Next Category">
          <i class="fa-solid fa-chevron-right"></i>
        </button>
      </div>

      <!-- Navigation Dots -->
      <div class="category-dots-row" id="categoryDots">
        <div class="cat-dot active" data-index="0"></div>
        <div class="cat-dot" data-index="1"></div>
        <div class="cat-dot" data-index="2"></div>
      </div>

      <!-- Catalog Count & Badge Bar -->
      <div class="catalog-bar">
        <div class="catalog-bar-left">
          <span class="catalog-tag color-vault" id="categoryTag">12AM Vault</span>
          <span class="catalog-count" id="catalogCount">Loading games...</span>
        </div>
      </div>
    </div>

    <!-- Active Category Games Grid -->
    <div class="games-grid" id="gamesGrid"></div>
  </div>

  <!-- Fullscreen Player Overlay (pinpoint-mini squircle style) -->
  <div id="player-view">
    <div class="player-header">
      <div class="player-header-left">
        <button class="player-btn-squircle" onclick="closePlayer()" title="Back to Games">
          <span class="material-symbols-sharp">arrow_back</span>
        </button>
        <span class="player-title" id="currentPlayerTitle">Playing</span>
      </div>
      <div class="player-header-right">
        <button class="player-btn-squircle" id="playerPinBtn" onclick="togglePinCurrentGame()" title="Pin Game">
          <span class="material-symbols-sharp" id="playerPinIcon">push_pin</span>
        </button>
        <button class="player-btn-squircle" onclick="reloadCurrentGame()" title="Reload Game">
          <span class="material-symbols-sharp">refresh</span>
        </button>
        <button class="player-btn-squircle" onclick="togglePlayerFullscreen()" title="Toggle Fullscreen">
          <span class="material-symbols-sharp">fullscreen</span>
        </button>
        <button class="player-btn-squircle btn-close" onclick="closePlayer()" title="Close Player">
          <span class="material-symbols-sharp">close</span>
        </button>
      </div>
    </div>
    <div class="player-frame-wrapper">
      <iframe id="gameIframe" allow="fullscreen; autoplay; camera; microphone; clipboard-read; clipboard-write; display-capture; geolocation; encrypted-media; picture-in-picture; web-share"></iframe>
    </div>
  </div>



  <script>
    // Categories definition
    const CATEGORIES = [
      { name: '12AM Vault', colorClass: 'color-vault', desc: 'Offline IndexedDB & Local Originals' },
      { name: 'StrongdogXP', colorClass: 'color-strongdog', desc: 'Core Flash, HTML5 & Web Classics by Josh P' },
      { name: 'TGLSC', colorClass: 'color-tglsc', desc: 'Ultra-Fast High-Speed CDN Catalog (199 Games)' }
    ];

    let currentCategoryIndex = 0;
    let categoryGames = {
      '12AM Vault': [],
      'StrongdogXP': [],
      'TGLSC': []
    };
    let allSearchableGames = [];
    let pinnedGames = new Set();

    try {
      const savedPins = JSON.parse(localStorage.getItem('12am_pinned_games') || '[]');
      pinnedGames = new Set(savedPins);
    } catch (e) {}

    // Initialize & Load all Categories
    async function initGamesHub() {
      setupSliderControls();
      setupSearch();

      // 1. Load 12AM Vault
      try {
        let vaultRaw = [];
        if (window.__12AM_GAMES__ && Array.isArray(window.__12AM_GAMES__)) {
          vaultRaw = window.__12AM_GAMES__.filter(g => !g.isApp);
        } else {
          const res = await fetch('games.json');
          const data = await res.json();
          vaultRaw = data.filter(g => !g.isApp);
        }
        categoryGames['12AM Vault'] = vaultRaw.map(g => ({
          id: `vault-${g.title.replace(/\s+/g, '-').toLowerCase()}`,
          name: g.title,
          url: g.file,
          imgSrc: g.thumbnail || '',
          category: '12AM Vault',
          isLocal: true,
          sizeBytes: g.sizeBytes
        }));
      } catch (e) {
        console.warn('Failed loading 12AM Vault games:', e);
      }

      // 2. Load StrongdogXP
      try {
        const res = await fetch('strongdog-games.json');
        const data = await res.json();
        categoryGames['StrongdogXP'] = data.map(g => {
          return {
            ...g,
            url: normalizeGameUrl(g.url || ''),
            category: 'StrongdogXP'
          };
        });
      } catch (e) {
        console.warn('Failed loading Strongdog games:', e);
      }

      // 3. Load TGLSC (The Blue Category)
      try {
        const res = await fetch('tglsc-games.json');
        const data = await res.json();
        categoryGames['TGLSC'] = data.map(g => {
          let thumb = g.thumbnail || '';
          if (thumb.startsWith('/')) thumb = 'https://glseries.net' + thumb;
          return {
            id: `tglsc-${g.id}`,
            name: g.title,
            category: 'TGLSC',
            originalCategory: g.category,
            imgSrc: thumb,
            url: g.embed_url || `https://glseries.net${g.game_url}`,
            status: g.status
          };
        });
      } catch (e) {
        console.warn('Failed loading TGLSC games:', e);
      }



      // Assemble all searchable games
      allSearchableGames = [];
      Object.keys(categoryGames).forEach(cat => {
        allSearchableGames.push(...categoryGames[cat]);
      });

      // Render default category
      renderCurrentCategory();
      renderFavorites();
    }

    // Slider Controls
    function setupSliderControls() {
      const prevBtn = document.getElementById('prev-category');
      const nextBtn = document.getElementById('next-category');
      const slider = document.getElementById('category-slider');
      const dots = document.querySelectorAll('.cat-dot');

      function goToCategory(index) {
        if (index < 0 || index >= CATEGORIES.length) return;
        currentCategoryIndex = index;
        slider.style.transform = `translateX(-${currentCategoryIndex * 100}%)`;

        // Update dots
        dots.forEach((dot, idx) => {
          dot.classList.toggle('active', idx === currentCategoryIndex);
        });

        // Update buttons
        prevBtn.disabled = currentCategoryIndex === 0;
        nextBtn.disabled = currentCategoryIndex === CATEGORIES.length - 1;

        // Update tag
        const tag = document.getElementById('categoryTag');
        const cat = CATEGORIES[currentCategoryIndex];
        tag.className = `catalog-tag ${cat.colorClass}`;
        tag.textContent = cat.name;

        renderCurrentCategory();
      }

      prevBtn.addEventListener('click', () => goToCategory(currentCategoryIndex - 1));
      nextBtn.addEventListener('click', () => goToCategory(currentCategoryIndex + 1));

      dots.forEach(dot => {
        dot.addEventListener('click', () => {
          goToCategory(parseInt(dot.dataset.index, 10));
        });
      });

      // Keyboard arrow keys left/right when not in inputs
      window.addEventListener('keydown', (e) => {
        if (['INPUT', 'TEXTAREA'].includes(e.target.tagName)) return;
        if (e.key === 'ArrowLeft') goToCategory(currentCategoryIndex - 1);
        if (e.key === 'ArrowRight') goToCategory(currentCategoryIndex + 1);
      });

      goToCategory(0);
    }

    // Render Active Category Games
    async function renderCurrentCategory() {
      const cat = CATEGORIES[currentCategoryIndex];
      const grid = document.getElementById('gamesGrid');
      const countEl = document.getElementById('catalogCount');
      if (!grid) return;

      const games = categoryGames[cat.name] || [];
      if (countEl) countEl.textContent = `${games.length.toLocaleString()} games available`;

      grid.style.opacity = '0';
      await new Promise(r => setTimeout(r, 120));

      if (games.length === 0) {
        grid.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; padding: 4rem 1rem; color: var(--text-muted);">
            <i class="fa-solid fa-spinner fa-spin" style="font-size: 32px; margin-bottom: 12px; color: var(--accent-color);"></i>
            <h3 style="color: var(--text-main); margin-bottom: 6px;">Loading games...</h3>
          </div>
        `;
        grid.style.opacity = '1';
        return;
      }

      grid.innerHTML = games.map(game => createGameCardHTML(game)).join('');
      grid.style.opacity = '1';
    }

    function formatBytes(bytes) {
      if (!bytes || bytes === 0) return 'Instant Web App';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    function escapeHTML(str) {
      if (!str) return '';
      return String(str).replace(/[&<>'"]/g, tag => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        "'": '&#39;',
        '"': '&quot;'
      }[tag] || tag));
    }

    // Game Card Generator (Row view without images, pinpoint-mini reference-3.9.36)
    function createGameCardHTML(game) {
      const isPinned = pinnedGames.has(game.name);
      let catColorClass = 'color-vault';
      if (game.category === 'StrongdogXP') catColorClass = 'color-strongdog';
      if (game.category === 'TGLSC') catColorClass = 'color-tglsc';

      const metaText = game.sizeBytes 
        ? formatBytes(game.sizeBytes) 
        : (game.status || (game.isLocal ? 'Offline Ready' : 'Fast Mirror'));

      return `
        <div class="game-card" onclick="launchGame('${encodeURIComponent(game.url)}', '${encodeURIComponent(game.name)}', ${game.isLocal || false}, '${game.category || ''}')">
          <div class="game-left">
            <div class="game-details">
              <span class="game-title">${escapeHTML(game.name)}</span>
              <div class="game-meta">
                <span class="badge-cat ${catColorClass}">${game.category}</span>
                <span>${metaText}</span>
                ${isPinned ? `
                  <span class="badge-pinned">
                    <i class="fa-solid fa-star" style="font-size: 11px;"></i>
                    Pinned
                  </span>
                ` : ''}
              </div>
            </div>
          </div>
          <div class="game-actions">
            <button class="btn-icon-sharp ${isPinned ? 'pinned-active' : ''}" onclick="event.stopPropagation(); togglePin('${encodeURIComponent(game.name)}')" title="${isPinned ? 'Unpin game' : 'Pin to top'}">
              <i class="fa-solid fa-star"></i>
            </button>
            <button class="btn-sharp btn-primary-sharp" onclick="event.stopPropagation(); launchGame('${encodeURIComponent(game.url)}', '${encodeURIComponent(game.name)}', ${game.isLocal || false}, '${game.category || ''}')">
              <i class="fa-solid fa-play"></i>
              <span>Play</span>
            </button>
          </div>
        </div>
      `;
    }

    // Normalize game URL: Clean StrongdogXP and GAMES outer container URLs to direct /game/index.html
    function normalizeGameUrl(url) {
      if (!url) return '';
      if (/pinpoint-edu\.github\.io\/(?:strongdog[0-9]*|GAMES)\/html\/[^/]+\/index\.html$/i.test(url)) {
        return url.replace(/\/index\.html$/i, '/game/index.html');
      }
      return url;
    }

    // Toggle Pin / Favorite
    function togglePin(nameEnc) {
      const name = decodeURIComponent(nameEnc);
      if (pinnedGames.has(name)) {
        pinnedGames.delete(name);
      } else {
        pinnedGames.add(name);
      }
      try {
        localStorage.setItem('12am_pinned_games', JSON.stringify([...pinnedGames]));
      } catch (e) {}

      renderFavorites();
      renderCurrentCategory();
    }

    // Render Favorites
    function renderFavorites() {
      const favSec = document.getElementById('favoritesSection');
      const favGrid = document.getElementById('favoritesGrid');
      if (!favSec || !favGrid) return;

      const favGames = allSearchableGames.filter(g => pinnedGames.has(g.name));
      if (favGames.length === 0) {
        favSec.style.display = 'none';
        return;
      }

      favSec.style.display = 'block';
      favGrid.innerHTML = favGames.map(game => createGameCardHTML(game)).join('');
    }

    // Search Box & Dropdown Handling
    function setupSearch() {
      const input = document.getElementById('gameSearchInput');
      const dropdown = document.getElementById('searchDropdown');

      // '/' to focus
      window.addEventListener('keydown', (e) => {
        if (e.key === '/' && !['INPUT', 'TEXTAREA'].includes(e.target.tagName)) {
          e.preventDefault();
          input.focus();
          input.select();
        }
      });

      input.addEventListener('input', () => {
        const query = input.value.toLowerCase().trim();
        if (!query) {
          dropdown.style.display = 'none';
          dropdown.innerHTML = '';
          return;
        }

        const matches = allSearchableGames
          .filter(g => g.name.toLowerCase().includes(query))
          .slice(0, 8);

        if (matches.length === 0) {
          dropdown.innerHTML = `<div style="padding: 1rem; text-align: center; color: var(--text-muted); font-size: 0.85rem;">No games found for "${query}"</div>`;
          dropdown.style.display = 'block';
          return;
        }

        dropdown.innerHTML = matches.map(g => {
          let catColor = 'color-vault';
          if (g.category === 'StrongdogXP') catColor = 'color-strongdog';
          if (g.category === 'TGLSC') catColor = 'color-tglsc';

          return `
            <div class="search-item" onclick="launchGame('${encodeURIComponent(g.url)}', '${encodeURIComponent(g.name)}', ${g.isLocal || false}, '${g.category || ''}')">
              <div class="search-item-info">
                <div class="search-item-icon"><i class="fa-solid fa-gamepad ${catColor}"></i></div>
                <div class="search-item-meta">
                  <div class="search-item-title">${escapeHTML(g.name)}</div>
                  <div class="search-item-badge ${catColor}">${g.category}</div>
                </div>
              </div>
              <button class="btn-sharp btn-primary-sharp" style="padding: 5px 12px; font-size: 11px;">
                <i class="fa-solid fa-play"></i>
                <span>Play</span>
              </button>
            </div>
          `;
        }).join('');

        dropdown.style.display = 'block';
      });

      document.addEventListener('click', (e) => {
        if (!e.target.closest('.search-bar-wrap')) {
          dropdown.style.display = 'none';
        }
      });
    }

    // Launch Game in Fullscreen Player View
    let currentGameUrl = '';
    let currentGameTitle = '';

    function updatePlayerPinBtn() {
      const pinBtn = document.getElementById('playerPinBtn');
      if (!pinBtn) return;
      const isPinned = pinnedGames.has(currentGameTitle);
      pinBtn.classList.toggle('pinned-active', isPinned);
      pinBtn.title = isPinned ? 'Unpin Game' : 'Pin Game';
    }

    function togglePinCurrentGame() {
      if (!currentGameTitle) return;
      togglePin(encodeURIComponent(currentGameTitle));
      updatePlayerPinBtn();
    }

    function launchGame(urlEnc, titleEnc, isLocal, category) {
      let url = decodeURIComponent(urlEnc);
      const title = decodeURIComponent(titleEnc);

      // Clean StrongdogXP / GAMES nested container to embedded game
      url = normalizeGameUrl(url);

      // Proxy TGLSC games through the worker gateway
      if (category === 'TGLSC' || url.includes('glseries.net')) {
        url = `https://classroom-docs.googleus-cloud1.workers.dev/browse?url=${encodeURIComponent(url)}&embed=1`;
      }

      currentGameUrl = url;
      currentGameTitle = title;

      const player = document.getElementById('player-view');
      const titleEl = document.getElementById('currentPlayerTitle');
      const iframe = document.getElementById('gameIframe');

      titleEl.textContent = title;
      updatePlayerPinBtn();
      player.style.display = 'flex';
      document.body.style.overflow = 'hidden';

      if ((isLocal || url.includes('pinpoint-edu.github.io')) && window.playGame) {
        window.playGame(encodeURIComponent(url), encodeURIComponent(title));
        return;
      }

      iframe.removeAttribute('srcdoc');
      iframe.src = url;
    }

    function closePlayer() {
      const player = document.getElementById('player-view');
      const iframe = document.getElementById('gameIframe');
      player.style.display = 'none';
      document.body.style.overflow = '';
      iframe.removeAttribute('src');
      iframe.removeAttribute('srcdoc');
      iframe.src = 'about:blank';
    }

    function reloadCurrentGame() {
      const iframe = document.getElementById('gameIframe');
      if (iframe.src && iframe.src !== 'about:blank') {
        iframe.src = iframe.src;
      } else if (currentGameUrl) {
        iframe.src = currentGameUrl;
      }
    }

    function togglePlayerFullscreen() {
      const player = document.getElementById('player-view');
      if (!document.fullscreenElement) {
        player.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    document.addEventListener('DOMContentLoaded', initGamesHub);
  </script>
</body>
</html>
