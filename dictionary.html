<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12AM — Dictionary & Lexicon</title>
    <meta name="description" content="Instant definitions, phonetics, audio pronunciations, and synonyms on 12AM.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 12AM Core Theme & Navigation -->
    <link rel="stylesheet" href="navigation.css">
    <script src="theme.js"></script>
    <script src="device-auth.js"></script>
    <script src="navigation.js" defer></script>

    <style>
        *, *::before, *::after,
        h1, h2, h3, h4, h5, h6,
        b, strong, th,
        .font-bold, .font-semibold, .font-extrabold, .font-black {
            font-weight: 500 !important;
        }

        :root {
            --bg-page: var(--bg-primary, #040404);
            --bg-card: var(--bg-secondary, #0c0c10);
            --text-main: var(--text-primary, #ffffff);
            --text-muted: var(--text-secondary, #a1a1aa);
            --accent-color: var(--accent-primary, #8b5cf6);
            --accent-glow: var(--accent-secondary, rgba(139, 92, 246, 0.4));
            --border-main: var(--border-primary, #1e1e24);
            --border-faint: var(--border-secondary, rgba(255, 255, 255, 0.06));
            --btn-bg: var(--button-bg, rgba(139, 92, 246, 0.12));
        }

        body { 
            font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif; 
            background-color: var(--bg-page); 
            color: var(--text-main); 
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        #dynamic-background {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 15%, var(--accent-glow), transparent 70%);
            pointer-events: none;
            z-index: -1;
            opacity: 0.35;
        }

        .dict-wrapper {
            width: 100%;
            max-width: 920px;
            margin: 0 auto;
            padding: 3.5rem 1.5rem 6rem;
            flex: 1 0 auto;
            box-sizing: border-box;
        }

        /* Search Omnibox */
        .search-omnibox {
            background: var(--bg-card);
            border: 1px solid var(--border-main);
            border-radius: 24px;
            padding: 0.55rem 0.65rem 0.55rem 1.4rem;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            margin-bottom: 2rem;
        }

        .search-omnibox:focus-within {
            border-color: var(--accent-color);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6), 0 0 0 2px var(--accent-glow);
        }

        .search-omnibox input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-size: 1.05rem;
            font-family: inherit;
        }

        .search-omnibox input::placeholder {
            color: var(--text-muted);
            opacity: 0.6;
            font-size: 0.95rem;
        }

        .search-btn {
            background: var(--accent-color);
            color: #ffffff;
            border: none;
            border-radius: 16px;
            padding: 0 1.4rem;
            height: 42px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px var(--accent-glow);
            outline: none;
            flex-shrink: 0;
        }

        .search-btn:hover {
            filter: brightness(1.12);
            transform: scale(1.02);
        }

        /* Definition Card */
        .dict-card {
            background: var(--bg-card);
            border: 1px solid var(--border-main);
            border-radius: 24px;
            padding: 2.25rem;
            box-shadow: 0 16px 45px rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            min-height: 320px;
            transition: all 0.25s ease;
        }

        /* Instant Audio Pronunciation Button */
        .instant-audio-btn {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            background: var(--btn-bg);
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            outline: none;
            margin-left: 12px;
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .instant-audio-btn:hover {
            background: var(--accent-color);
            color: #ffffff;
            transform: scale(1.08);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .instant-audio-btn.speaking {
            animation: pulse-ring 0.8s infinite;
        }

        @keyframes pulse-ring {
            0% { transform: scale(1); box-shadow: 0 0 0 0 var(--accent-glow); }
            50% { transform: scale(1.06); box-shadow: 0 0 0 8px var(--accent-glow); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 var(--accent-glow); }
        }

        /* Category Chips / Part of Speech */
        .pos-badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 12px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-main);
            color: var(--accent-color);
            font-size: 0.82rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 1.5rem;
            margin-bottom: 0.85rem;
        }

        /* Definition Item */
        .def-row {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 8px 0;
            line-height: 1.65;
            color: var(--text-main);
            font-size: 0.98rem;
        }

        .def-num {
            width: 22px;
            height: 22px;
            border-radius: 8px;
            background: var(--btn-bg);
            color: var(--accent-color);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 500;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .def-example {
            font-size: 0.86rem;
            color: var(--text-muted);
            font-style: italic;
            margin-top: 4px;
            opacity: 0.75;
        }

        /* Squircle Chip Tags */
        .squircle-chip {
            display: inline-flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            padding: 5px 14px;
            border-radius: 14px;
            font-size: 0.84rem;
            font-weight: 500;
            margin: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .squircle-chip:hover {
            background: var(--accent-color);
            color: #ffffff;
            border-color: var(--accent-color);
            transform: translateY(-2px);
            box-shadow: 0 4px 14px var(--accent-glow);
        }

        html.theme-amoled-midnight .search-btn,
        html.theme-amoled-midnight .search-btn svg,
        html.theme-amoled-midnight .instant-audio-btn:hover,
        html.theme-amoled-midnight .instant-audio-btn:hover svg,
        html.theme-amoled-midnight .squircle-chip:hover {
            color: #000000 !important;
        }

        /* Recent Searches bar */
        .history-wrap {
            margin-top: 2rem;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            color: var(--text-muted);
            font-size: 0.82rem;
        }
    </style>
</head>
<body>
    <div id="dynamic-background"></div>

    <main class="dict-wrapper">
        <!-- Header -->
        <div class="mb-6 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-[var(--btn-bg)] border border-[var(--accent-color)] flex items-center justify-center text-[var(--accent-color)] shadow-md">
                    <span class="material-symbols-sharp" style="font-size: 22px;">menu_book</span>
                </div>
                <div>
                    <h1 class="text-xl font-medium tracking-tight" style="color: var(--text-main);">12AM Lexicon</h1>
                    <p class="text-xs text-[var(--text-muted)] opacity-70">Instant definitions, phonetics, and speech synthesis</p>
                </div>
            </div>
            <span class="text-xs font-mono text-[var(--text-muted)] opacity-50 hidden sm:inline-block">Press / to focus</span>
        </div>

        <!-- Search Bar -->
        <div class="search-omnibox">
            <span class="material-symbols-sharp" style="color: var(--text-muted); font-size: 22px;">search</span>
            <input type="text" id="searchInput" placeholder="Search any word (e.g. serendipity, epiphany, quantum)..." autocomplete="off">
            <button id="searchBtn" class="search-btn">
                <span>Define</span>
                <span class="material-symbols-sharp" style="font-size: 18px;">arrow_forward</span>
            </button>
        </div>

        <!-- Definition Card Output -->
        <div id="definitionOutput" class="dict-card">
            <div class="h-full flex flex-col items-center justify-center py-16 text-center">
                <span class="material-symbols-sharp mb-4 text-[var(--accent-color)]" style="font-size: 48px; opacity: 0.8;">auto_stories</span>
                <p class="text-base font-medium mb-1" style="color: var(--text-main);">Lookup any English word instantly</p>
                <p class="text-xs text-[var(--text-muted)] opacity-60 mb-6 max-w-sm">Definitions, parts of speech, synonyms, and zero-latency vocal pronunciations.</p>
                
                <div class="flex flex-wrap justify-center gap-2 max-w-md">
                    <span class="squircle-chip" onclick="fetchWord('serendipity')">serendipity</span>
                    <span class="squircle-chip" onclick="fetchWord('ephemeral')">ephemeral</span>
                    <span class="squircle-chip" onclick="fetchWord('luminescence')">luminescence</span>
                    <span class="squircle-chip" onclick="fetchWord('zenith')">zenith</span>
                    <span class="squircle-chip" onclick="fetchWord('solitude')">solitude</span>
                </div>
            </div>
        </div>

        <!-- Recent Searches Row -->
        <div id="recentSearchesWrap" class="history-wrap hidden">
            <span class="opacity-60 mr-1"><i class="fa-solid fa-clock-rotate-left mr-1.5"></i>Recent:</span>
            <div id="recentChips" class="flex flex-wrap gap-2"></div>
        </div>
    </main>

    <script>
        const input = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const output = document.getElementById('definitionOutput');
        const recentWrap = document.getElementById('recentSearchesWrap');
        const recentChips = document.getElementById('recentChips');

        let searchHistory = [];
        try {
            searchHistory = JSON.parse(localStorage.getItem('12am_dict_history') || '[]');
        } catch(e) {}

        function renderRecentHistory() {
            if (!recentWrap || !recentChips) return;
            if (!searchHistory.length) {
                recentWrap.classList.add('hidden');
                return;
            }
            recentWrap.classList.remove('hidden');
            recentChips.innerHTML = searchHistory.slice(0, 6).map(w => `
                <span class="squircle-chip text-xs py-1 px-3" onclick="fetchWord('${escapeHTML(w)}')">${escapeHTML(w)}</span>
            `).join('');
        }

        function saveToHistory(word) {
            if (!word) return;
            searchHistory = [word, ...searchHistory.filter(w => w.toLowerCase() !== word.toLowerCase())].slice(0, 10);
            try {
                localStorage.setItem('12am_dict_history', JSON.stringify(searchHistory));
            } catch(e) {}
            renderRecentHistory();
        }

        function escapeHTML(str) {
            if (!str) return '';
            return String(str).replace(/[&<>'"]/g, tag => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[tag] || tag));
        }

        // Instant Zero-Delay Pronunciation using Web Speech API
        function instantSpeakWord(word, btnEl) {
            if (!word) return;
            if (btnEl) btnEl.classList.add('speaking');

            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utter = new SpeechSynthesisUtterance(word);
                utter.rate = 0.95;
                utter.pitch = 1.0;
                utter.lang = 'en-US';
                utter.onend = () => {
                    if (btnEl) btnEl.classList.remove('speaking');
                };
                utter.onerror = () => {
                    if (btnEl) btnEl.classList.remove('speaking');
                };
                window.speechSynthesis.speak(utter);
            } else {
                if (btnEl) btnEl.classList.remove('speaking');
            }
        }

        async function fetchWord(word) {
            const query = (word || input.value || '').trim().toLowerCase();
            if (!query) return;

            input.value = query;
            window.location.hash = '#word=' + encodeURIComponent(query);
            saveToHistory(query);

            output.innerHTML = `
                <div class="flex flex-col items-center justify-center py-20 text-center">
                    <i class="fa-solid fa-spinner fa-spin text-3xl mb-3 text-[var(--accent-color)]"></i>
                    <p class="text-sm text-[var(--text-muted)]">Looking up "${escapeHTML(query)}" in lexicon...</p>
                </div>
            `;

            try {
                const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(query)}`);
                if (!res.ok) {
                    displayNotFound(query);
                    return;
                }
                const data = await res.json();
                if (!data || !data.length) {
                    displayNotFound(query);
                    return;
                }
                renderDefinition(data[0]);
            } catch (err) {
                output.innerHTML = `
                    <div class="text-center py-16 text-red-400">
                        <i class="fa-solid fa-triangle-exclamation text-3xl mb-3"></i>
                        <p class="text-sm font-medium">Could not reach dictionary server.</p>
                        <p class="text-xs text-[var(--text-muted)] opacity-70 mt-1">Check your network or proxy settings.</p>
                    </div>
                `;
            }
        }

        function displayNotFound(query) {
            output.innerHTML = `
                <div class="text-center py-20 opacity-70">
                    <span class="material-symbols-sharp text-4xl mb-3 text-[var(--accent-color)]">help_outline</span>
                    <p class="text-lg font-medium mb-1 text-[var(--text-main)]">No definition found for "${escapeHTML(query)}"</p>
                    <p class="text-xs text-[var(--text-muted)]">Check spelling or search for another English word.</p>
                </div>
            `;
        }

        function renderDefinition(entry) {
            const word = entry.word || '';
            const phonetic = entry.phonetic || (entry.phonetics && entry.phonetics.find(p => p.text)?.text) || '';

            let html = `
                <div class="border-b pb-6 mb-6 flex items-center justify-between flex-wrap gap-4" style="border-color: var(--border-main);">
                    <div>
                        <div class="flex items-center gap-3">
                            <h2 class="text-3xl sm:text-4xl font-medium tracking-tight capitalize" style="color: var(--text-main);">${escapeHTML(word)}</h2>
                            <button type="button" class="instant-audio-btn" onclick="instantSpeakWord('${escapeHTML(word)}', this)" title="Instant Pronunciation">
                                <span class="material-symbols-sharp" style="font-size: 20px;">volume_up</span>
                            </button>
                        </div>
                        ${phonetic ? `<p class="text-sm font-mono mt-1 text-[var(--accent-color)] opacity-90">${escapeHTML(phonetic)}</p>` : ''}
                    </div>
                </div>
            `;

            if (entry.meanings && entry.meanings.length) {
                entry.meanings.forEach(m => {
                    html += `
                        <div class="pos-badge">${escapeHTML(m.partOfSpeech || 'definition')}</div>
                    `;

                    if (m.definitions && m.definitions.length) {
                        html += `<div class="space-y-3 mb-6">`;
                        m.definitions.slice(0, 5).forEach((d, idx) => {
                            html += `
                                <div class="def-row">
                                    <span class="def-num">${idx + 1}</span>
                                    <div class="flex-1">
                                        <span>${escapeHTML(d.definition)}</span>
                                        ${d.example ? `<p class="def-example">"${escapeHTML(d.example)}"</p>` : ''}
                                    </div>
                                </div>
                            `;
                        });
                        html += `</div>`;
                    }

                    if (m.synonyms && m.synonyms.length) {
                        html += `
                            <div class="mb-5 pt-1">
                                <span class="text-xs font-semibold uppercase tracking-wider text-[var(--text-muted)] opacity-60 mr-2">Synonyms:</span>
                                <div class="flex flex-wrap gap-1.5 mt-2">
                                    ${m.synonyms.slice(0, 8).map(s => `<span class="squircle-chip text-xs py-1 px-3" onclick="fetchWord('${escapeHTML(s)}')">${escapeHTML(s)}</span>`).join('')}
                                </div>
                            </div>
                        `;
                    }
                });
            }

            output.innerHTML = html;
        }

        // Keyboard shortcuts: '/' to focus search
        window.addEventListener('keydown', (e) => {
            if (e.key === '/' && !['INPUT', 'TEXTAREA'].includes(e.target.tagName)) {
                e.preventDefault();
                input.focus();
                input.select();
            }
        });

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') fetchWord();
        });
        searchBtn.addEventListener('click', () => fetchWord());

        document.addEventListener('DOMContentLoaded', () => {
            renderRecentHistory();
            if (window.location.hash.startsWith('#word=')) {
                const w = decodeURIComponent(window.location.hash.substring(6));
                fetchWord(w);
            }
        });
    </script>
</body>
</html>
